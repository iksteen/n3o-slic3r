# Linux CI for n3o-slic3r.
#
# Build matrix is intentionally Linux-only (PRD §3.2 — Windows/macOS are
# explicit non-goals for the MVP). The long pole is OrcaSlicer's deps
# tree (~17 min cold); we cache it keyed by the submodule SHA plus the
# contents of the wrapper that drives the build, so it only rebuilds
# when upstream OrcaSlicer moves or our build script changes.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs of the same ref to save CI minutes — fine here
# because every job is a full build, no partial-state risk.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record OrcaSlicer submodule SHA
        id: orca
        run: |
          sha=$(git -C external/OrcaSlicer rev-parse HEAD)
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Free runner disk space
        # Originally added after `Run 26332210186` failed mid-libslic3r
        # with `'No space left on device'` in MeshBoolean.cpp.o — the
        # RelWithDebInfo debug-symbol sections push the ubuntu runner
        # past its ~14 G free-disk ceiling once cargo target + cmake
        # build tree + npm modules stack up. Strip the runner image
        # of the toolchains we don't use; typical free is ~15-20 G,
        # plenty for libslic3r + cargo + npm to all fit.
        #
        # Moved EARLY in the job (before any cache restore) after runs
        # 26449015224 / 26453559888 stalled in the "Cache cargo
        # registry and target" step: the OrcaSlicer deps cache + the
        # libslic3r cmake tree cache (~5 G extracted) restore first,
        # and that left no room for cargo's restore-tarball
        # extraction. Running this step ahead of every cache restore
        # gives the whole pipeline its headroom up front.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            build-essential \
            cmake \
            ninja-build \
            pkgconf \
            clang \
            lld \
            file \
            gettext \
            git \
            wget \
            texinfo \
            m4 \
            extra-cmake-modules \
            eglexternalplatform-dev \
            libgtk-3-dev \
            gstreamer1.0-gtk3 \
            libgstreamerd-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            libudev-dev \
            libglew-dev \
            libmspack-dev \
            libsecret-1-dev \
            libspnav-dev \
            libtool \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libxkbcommon-dev

      - name: Restore OrcaSlicer deps cache
        id: cache-deps
        # Split restore + save so a downstream failure (cargo test,
        # libslic3r build, …) doesn't prevent the ~17 min deps
        # tree from being cached. `actions/cache@v4`'s default
        # post-step only saves on full job success — that's how
        # runs 26313140866 / 26327551678 / 26329702592 burned the
        # cold deps cost repeatedly. Restore here, save right
        # after the deps build succeeds (below).
        uses: actions/cache/restore@v4
        with:
          path: external/OrcaSlicer/deps/build/OrcaSlicer_dep
          key: orca-deps-${{ runner.os }}-${{ steps.orca.outputs.sha }}-${{ hashFiles('scripts/build.sh', 'external/OrcaSlicer/deps/CMakeLists.txt') }}

      - name: Build OrcaSlicer deps (cache miss only)
        id: build-deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./scripts/build.sh deps

      - name: Save OrcaSlicer deps cache
        # Only saves on cache miss + successful deps build. Runs
        # eagerly here so the cache is preserved even if the
        # downstream `cargo test` fails. `actions/cache/save` is
        # a no-op on cache hit (the cache already exists at that
        # key); we still gate explicitly for clarity.
        if: steps.cache-deps.outputs.cache-hit != 'true' && steps.build-deps.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: external/OrcaSlicer/deps/build/OrcaSlicer_dep
          key: ${{ steps.cache-deps.outputs.cache-primary-key }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore libslic3r cmake build tree cache
        # Same split-restore-save pattern as the deps cache. The
        # cmake build tree (~5G raw, ~1-2G compressed) holds
        # libslic3r.a, libslic3r_ffi.so, and all the .o files for
        # compiling libslic3r itself. Without this cache every
        # run pays the ~15 min cold libslic3r build even with the
        # OrcaSlicer deps tree cached. Save is gated on the cargo
        # build's success below, so a failed test step doesn't
        # invalidate the cache.
        #
        # NO `restore-keys` fallback here. The "Bump cached cmake
        # mtimes" step below needs an EXACT key hit so we know the
        # restored .o files were compiled from the same FFI sources
        # we just checked out. A loose prefix match (any FFI hash)
        # would mean touching potentially-stale .o files past
        # genuinely-changed sources — ninja then skips the rebuild
        # and we silently ship libslic3r linked against the old
        # shim. The cache key already pins everything that affects
        # the build: OrcaSlicer SHA covers libslic3r sources, the
        # hashFiles glob covers our ffi shim + CMakeLists +
        # build.rs. Anything truly changed → key changes → cache
        # miss → full clean rebuild.
        id: cache-ffi
        uses: actions/cache/restore@v4
        with:
          path: build/slic3r-ffi
          # Include the cmake config in the key so flipping
          # RelWithDebInfo ↔ Release doesn't cause the cached
          # build tree to grow indefinitely with parallel
          # per-config object trees.
          key: slic3r-ffi-${{ runner.os }}-${{ steps.orca.outputs.sha }}-release-${{ hashFiles('crates/slic3r-ffi/ffi/**', 'crates/slic3r-ffi/CMakeLists.txt', 'crates/slic3r-ffi/build.rs') }}

      - name: Bump cached cmake mtimes past checkout time
        # cmake + ninja decide what to rebuild by comparing source
        # mtime vs. output (.o) mtime. `actions/cache` restores
        # tar-preserved mtimes from the original compile (often
        # days old); `actions/checkout` sets every source mtime
        # to "now". Result: source mtime > output mtime for every
        # file → ninja rebuilds the whole tree.
        #
        # Run 26339260740 demonstrated this: the slic3r-ffi cache
        # restored successfully, but `cargo build` still took
        # 35m 47s — a full cold libslic3r rebuild — because every
        # restored .o file looked stale next to the just-checked-
        # out sources.
        #
        # Touching every cached file with the current timestamp
        # makes the cached artifacts unambiguously newer than the
        # sources, so ninja skips the per-file compile step and
        # only relinks libslic3r_ffi.so. Safe ONLY when the cache
        # was restored on an exact key hit (sources byte-identical
        # to what produced these .o files) — hence the strict
        # `cache-hit == 'true'` gate, not a substring fallback.
        if: steps.cache-ffi.outputs.cache-hit == 'true'
        run: find build/slic3r-ffi -exec touch {} +

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.orca.outputs.sha }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.orca.outputs.sha }}-

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Provision 8 GB swap for rustc peaks
        # The ubuntu-latest runner has ~7 G RAM, and individual rustc
        # invocations on heavy bindgen / proc-macro crates spike past
        # that ceiling in one allocation graph — runs 26313140866
        # (zvariant in release) and 26327551678 (webkit2gtk in debug)
        # both got SIGTERM (exit 143) from the cgroup soft-OOM at
        # roughly the same wall-clock memory mark, despite different
        # crates and different profiles. `CARGO_BUILD_JOBS=1` caps
        # cargo's *cross-crate* parallelism but does not bound a
        # single rustc's peak. libslic3r compiles fine because cmake
        # invokes one small `cc` per source file with no macro
        # expansion. Swap costs ~30 s of provisioning + occasional
        # thrash on the worst crate; in exchange the build completes.
        #
        # The ubuntu-24.04 runner image ships with a 4 GB /swapfile
        # already mounted (run 26329702592 failed with `fallocate:
        # Text file busy` on /swapfile). Swap it off, replace it with
        # an 8 GB file, swap on. `swapoff` is a no-op if no swap is
        # active.
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: cargo build (workspace, debug)
        # Splits the build from the test run so the
        # libslic3r cmake build (driven by slic3r-ffi's build.rs)
        # completes + caches before any tests can fail. Without
        # this split, a test failure cancels the cache save and
        # the next CI run pays the ~15 min cold libslic3r cost.
        id: cargo-build
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_INCREMENTAL: 0
          # Drop libslic3r's debug symbols to keep the cmake build
          # tree under the runner's disk ceiling. Local builds keep
          # RelWithDebInfo so PR-3-11-style segfault backtraces
          # stay actionable; CI doesn't ship binaries so it doesn't
          # need the symbols.
          N3O_SLIC3R_FFI_CMAKE_CONFIG: Release
        # `test-fixtures` compiles the bundled instance fixtures the
        # integration tests need; release builds never enable it.
        run: cargo build --workspace --tests --examples --features n3o-slic3r/test-fixtures

      - name: Save libslic3r cmake build tree cache
        # Gated on the cargo build succeeding so a half-built
        # cmake tree doesn't get cached. No-op on cache hit (key
        # already present). Runs before `cargo test` so a test
        # failure can't invalidate the cache.
        if: steps.cache-ffi.outputs.cache-hit != 'true' && steps.cargo-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/slic3r-ffi
          key: ${{ steps.cache-ffi.outputs.cache-primary-key }}

      - name: cargo test (workspace, debug)
        # Debug profile is kept (no LLVM optimization pass) on top of
        # the swap headroom; we don't need release-mode codegen for
        # the perf-budget tests (cascade_perf, scene_state_perf,
        # phase2_smoke) — they pass with 10-1000× headroom in debug
        # (translate p99 ≈ 1 µs vs the 5 ms ceiling, snapshot ≈
        # 100 µs vs 50 ms). JOBS=1 + INCREMENTAL=0 stay as
        # belt-and-suspenders against single-crate memory spikes
        # bleeding into swap thrash.
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_INCREMENTAL: 0
          N3O_SLIC3R_FFI_CMAKE_CONFIG: Release
        run: cargo test --workspace --features n3o-slic3r/test-fixtures

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Vite production build
        run: npm run build
