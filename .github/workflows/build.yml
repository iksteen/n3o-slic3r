# Linux CI for n3o-slic3r.
#
# Build matrix is intentionally Linux-only (PRD §3.2 — Windows/macOS are
# explicit non-goals for the MVP). The long pole is OrcaSlicer's deps
# tree (~17 min cold); we cache it keyed by the submodule SHA plus the
# contents of the wrapper that drives the build, so it only rebuilds
# when upstream OrcaSlicer moves or our build script changes.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs of the same ref to save CI minutes — fine here
# because every job is a full build, no partial-state risk.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record OrcaSlicer submodule SHA
        id: orca
        run: |
          sha=$(git -C external/OrcaSlicer rev-parse HEAD)
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            build-essential \
            cmake \
            ninja-build \
            pkgconf \
            clang \
            lld \
            file \
            gettext \
            git \
            wget \
            texinfo \
            m4 \
            extra-cmake-modules \
            eglexternalplatform-dev \
            libgtk-3-dev \
            gstreamer1.0-gtk3 \
            libgstreamerd-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            libudev-dev \
            libglew-dev \
            libmspack-dev \
            libsecret-1-dev \
            libspnav-dev \
            libtool \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libxkbcommon-dev

      - name: Cache OrcaSlicer deps prefix
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: external/OrcaSlicer/deps/build/OrcaSlicer_dep
          key: orca-deps-${{ runner.os }}-${{ steps.orca.outputs.sha }}-${{ hashFiles('scripts/build.sh', 'external/OrcaSlicer/deps/CMakeLists.txt') }}

      - name: Build OrcaSlicer deps (cache miss only)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./scripts/build.sh deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache libslic3r cmake build tree
        # The FFI crate's build.rs drives cmake under build/slic3r-ffi/
        # — that's where libslic3r.a, libslic3r_ffi.so, and all the
        # .o files for compiling libslic3r itself land (~5G raw,
        # ~1-2G compressed). Without this cache, every CI run pays
        # the ~15 min cold libslic3r build even with the OrcaSlicer
        # deps tree cached. Key invalidates when the submodule moves
        # or when the shim sources / CMakeLists / build.rs change;
        # the restore-keys fallback lets ninja do an incremental
        # rebuild on shim-source edits.
        uses: actions/cache@v4
        with:
          path: build/slic3r-ffi
          key: slic3r-ffi-${{ runner.os }}-${{ steps.orca.outputs.sha }}-${{ hashFiles('crates/slic3r-ffi/ffi/**', 'crates/slic3r-ffi/CMakeLists.txt', 'crates/slic3r-ffi/build.rs') }}
          restore-keys: |
            slic3r-ffi-${{ runner.os }}-${{ steps.orca.outputs.sha }}-

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.orca.outputs.sha }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.orca.outputs.sha }}-

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        run: npm ci

      - name: cargo test (workspace, debug)
        # Debug profile to keep peak rustc memory under the
        # ubuntu-latest runner's ~7 G RAM ceiling. Run 26313140866
        # OOM-killed at exit 143 while compiling `zvariant v5.11.0`
        # in release mode even with JOBS=1+INCREMENTAL=0 — the LLVM
        # optimization phase is the bulk of the memory usage, not
        # the parallelism. Debug compile of the full workspace fits
        # comfortably.
        #
        # The perf-budget tests (cascade_perf, scene_state_perf,
        # phase2_smoke) pass with 10-1000× headroom in debug mode
        # — translate p99 ≈ 1 µs vs the 5 ms ceiling, snapshot ≈
        # 100 µs vs 50 ms. JOBS=1 + INCREMENTAL=0 stay belt-and-
        # suspenders in case any single crate's debug compile still
        # spikes memory.
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_INCREMENTAL: 0
        run: cargo test --workspace

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Vite production build
        run: npm run build
