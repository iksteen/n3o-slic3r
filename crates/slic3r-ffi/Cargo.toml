[package]
name = "slic3r-ffi"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for libslic3r via the OrcaSlicer FFI shim. Owns the cmake build of libslic3r_ffi.so."
license = "AGPL-3.0-or-later"
# `links` makes this the "owner" of the native libslic3r_ffi library and
# enables passing metadata to downstream crates via DEP_SLIC3R_FFI_* env vars.
links = "slic3r_ffi"

[lib]
name = "slic3r_ffi"
path = "src/lib.rs"

[build-dependencies]
bindgen = "0.69"

[[example]]
name = "introspect"
path = "examples/introspect.rs"

[[example]]
name = "slice"
path = "examples/slice.rs"

[[example]]
name = "probe"
path = "examples/probe.rs"
