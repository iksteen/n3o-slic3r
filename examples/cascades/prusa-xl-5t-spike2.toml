# Filament rule — specificity 1, applies when context's filament
# material matches "PLA". Sets the temperature and fan curves
# that depend on the filament's material.
[[rule]]
when.filament.type = "PLA"
set.fan_cooling_layer_time = "100"
set.fan_max_speed = "100"
set.fan_min_speed = "100"
set.nozzle_temperature = "210"
set.nozzle_temperature_initial_layer = "220"
set.slow_down_layer_time = "10"

# Plate rule — specificity 1, applies when context's plate type
# is "Textured PEI". Carries a logical `bed_temp` which the
# stub adapter expands into libslic3r's per-plate-type vector
# keys (hot_plate_temp, cool_plate_temp, ...).
[[rule]]
when.plate.type = "Textured PEI"
set.bed_temp = "55"
set.curr_bed_type = "Textured PEI Plate"
