.ptpm-machine-action-ico svg { transition: transform 280ms ease; }
.ptpm-machine-action-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
  flex: 1 1 auto;
}
.ptpm-machine-action-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
}
.ptpm-machine-action-sub {
  font-size: 10.5px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ptpm-machine-action-chev {
  flex: 0 0 auto;
  color: var(--text-dim);
}
.ptpm-machine-action:hover .ptpm-machine-action-chev { color: var(--accent-text); }

/* Per-printer cog is now a persistent affordance, not hover-gated. */
.ptpm-cog.ptpm-cog-visible { opacity: 0.5; }
.ptpm-row:hover .ptpm-cog.ptpm-cog-visible,
.ptpm-row.active .ptpm-cog.ptpm-cog-visible,
.ptpm-cog.ptpm-cog-visible:hover { opacity: 1; }

const LAYER_INDEX = Object.fromEntries(CASCADE_LAYERS.map((l, i) => [l.id, i]));

// Resolve the active value of a setting from its cascade.
function resolveValue(setting) {
  for (let i = CASCADE_LAYERS.length - 1; i >= 0; i--) {
    const id = CASCADE_LAYERS[i].id;
    if (setting.cascade[id] !== undefined && setting.cascade[id] !== null) {
      return { value: setting.cascade[id], layer: id };
    }
  }
  return { value: setting.default, layer: "printer" };
}

// Detect a conflict: object overrides project (or any higher layer overrides lower).
// Returns the list of layers that are being overridden.
function getOverriddenLayers(setting) {
  const defined = CASCADE_LAYERS
    .filter(l => setting.cascade[l.id] !== undefined && setting.cascade[l.id] !== null)
    .map(l => l.id);
  if (defined.length <= 1) return [];
  return defined.slice(0, -1); // all but the winning layer

// flatten for global search
const ALL_SETTINGS = CATEGORIES.flatMap(c =>
  c.settings.map(s => ({ ...s, _catId: c.id, _catName: c.name }))
);

// ───────────── Complexity tiers (Simple / Advanced / Expert) ─────────────
// Each setting belongs to a tier. Modes are cumulative: Simple shows only
// simple settings; Advanced shows simple + advanced; Expert shows everything.
// We tag a curated handful as "simple" (the everyday controls), a curated set
// plus two whole categories as "expert" (deep/technical), and let everything
// else fall through to "advanced".
const SETTING_MODES = [
  { id: "simple",   label: "Simple",   rank: 0, desc: "Everyday essentials — the controls most prints need" },
  { id: "advanced", label: "Advanced", rank: 1, desc: "Common tuning controls for dialing in quality" },
  { id: "expert",   label: "Expert",   rank: 2, desc: "Every setting exposed — no guardrails" },
];
const LEVEL_RANK = { simple: 0, advanced: 1, expert: 2 };
const MODE_RANK = Object.fromEntries(SETTING_MODES.map(m => [m.id, m.rank]));

const SIMPLE_SETTING_IDS = new Set([
  "layer_height", "initial_layer_h",
  "wall_count",
  "top_layers", "bottom_layers",
  "infill_density", "infill_pattern",
  "print_temp", "bed_temp", "flow",
  "print_speed",
  "fan_enable", "fan_speed",
  "support_enable", "support_type", "support_density",
  "adhesion_type", "brim_width",
  "spiralize_outer",
]);

// Whole categories that are expert-only by nature.
const EXPERT_CATEGORY_IDS = new Set(["meshfix", "experimental"]);

const EXPERT_SETTING_IDS = new Set([
  // quality
  "init_line_width", "z_seam_x", "z_seam_y", "xy_offset", "xy_offset_hole",
  "z_offset", "slicing_tolerance", "min_feat_size", "min_thick_wall", "res_avoid_cross",
  // walls
  "min_wall_flow", "filter_out_tiny", "compensate_wall", "alt_extra_wall",
  "ext_wall_acc", "ext_wall_jerk", "ironing_inset",
  // top/bottom
  "skin_overlap", "skin_removal", "expand_skins", "top_init_line",
  "extra_skin_walls", "skin_edge_support", "interface_skin", "top_dir_rot",
  // infill
  "infill_acc", "infill_wipe_dist", "infill_z_step", "min_infill_area",
  "connect_infill", "connect_polys", "skin_to_infill", "gradual_infill",
  "gradual_step_h", "infill_support", "lightning_density", "infill_line_dist",
  // material
  "chamber_temp", "retract_count_max", "density", "standby_temp", "purge_volume",
  // speed
  "max_accel", "max_jerk", "classic_jerk", "first_layer_acc", "ext_speed_mult", "z_hop_speed",
  // travel
  "travel_avoid_dist", "coast_at_end", "coast_volume", "retract_extra_at_layer",
  "zhop_during_travel", "ramming_volume", "z_hop_type",
  // cooling
  "fan_lift_at_min_t", "aux_fan_speed", "chamber_fan", "min_speed_cool",
  // support
  "support_xy_dist", "support_z_dist", "tree_branch_dia", "tree_angle",
  "support_floor", "support_brim",
  // adhesion
  "skirt_min_length", "raft_smoothing", "draft_shield", "draft_shield_h", "prime_tower_size",
  // multi-extruder
  "toolchange_temp", "toolchange_retract", "toolchange_zhop", "wipe_tower_rot",
  "ooze_shield", "interface_only_first", "prime_volume",
  // special modes
  "smooth_spiralized", "relative_extrusion", "fuzzy_thickness", "fuzzy_density",
]);

function computeSettingLevel(catId, id) {
  if (SIMPLE_SETTING_IDS.has(id)) return "simple";
  if (EXPERT_CATEGORY_IDS.has(catId) || EXPERT_SETTING_IDS.has(id)) return "expert";
  return "advanced";
}

// Tag every setting object in place with its tier so both CATEGORIES (used by
// the panel) and ALL_SETTINGS (the flattened copy) carry `level`.
CATEGORIES.forEach(c => c.settings.forEach(st => { st.level = computeSettingLevel(c.id, st.id); }));
ALL_SETTINGS.forEach(st => { st.level = computeSettingLevel(st._catId, st.id); });

// Is `setting` visible in `mode`? Cumulative: a mode shows its tier and all
// lower tiers.
function settingVisibleInMode(setting, mode) {
  return (LEVEL_RANK[setting.level] ?? 1) <= (MODE_RANK[mode] ?? 2);
}

// stat: number of settings overridden at object level (used as a quick badge)
function countOverridesAtLayer(layerId) {
  return ALL_SETTINGS.filter(s =>
    s.cascade[layerId] !== undefined && s.cascade[layerId] !== null
  ).length;
}

// ───────────── Slot / material model ─────────────
// Filaments live in physical *slots*. Slots come from the printer's hardware
// configuration:
//   - one or more direct extruders ("ext", "ext:2", …)
//   - zero or more AMS units, each with 4 slots ("AMS-A:1"…"AMS-A:4",
//     "AMS-B:1"…"AMS-B:4", …; letter = unit identity).
//
// Objects on the plate carry a *material id* (M1, M2, …) which the project
// maps to a slot. Resolution goes: object.materialId → slot → filament.

// Compute the ordered slot id list for a given hardware config.
//
// Ordering rule: when an AMS is attached (Bambu Lab style), the AMS slots are
// the primary loadout the user picks from and the direct ext slot is the
// overflow / fallback — so we list AMS first, ext at the end. Without an AMS,
// ext slot(s) lead.
function computeSlotIds({ extruders = 1, amsUnits = 0 } = {}) {
  const extIds = [];
  if (extruders <= 1) {
    extIds.push("ext");
  } else {
    for (let i = 1; i <= extruders; i++) extIds.push(`ext:${i}`);
  }
  const amsIds = [];
  for (let u = 0; u < amsUnits; u++) {
    const letter = String.fromCharCode(65 + u); // A, B, C, D
    for (let s = 1; s <= 4; s++) amsIds.push(`AMS-${letter}:${s}`);
  }
  return amsIds.length > 0 ? [...amsIds, ...extIds] : [...extIds, ...amsIds];
}

// Compact label for a slot — what shows on the slot pill.
// Hides the AMS-unit letter when there's only one AMS unit (no ambiguity).
// Multi-extruder printers label their direct slots by toolhead (T1, T2…) —
// in this build one toolhead = one extruder; richer topologies (a toolhead
// with multiple extruders) are out of scope for now.
function slotShortLabel(slotId, slotIds = []) {
  if (slotId === "ext") return "ext";
  const extMatch = slotId.match(/^ext:(\d+)$/);
  if (extMatch) return `T${extMatch[1]}`;
  const amsMatch = slotId.match(/^AMS-([A-Z]):(\d+)$/);
  if (amsMatch) {
    const [, letter, idx] = amsMatch;
    // If multiple AMS units present, show "A:1", "B:3", etc.
    // If only one, just show the slot number.
    const distinctUnits = new Set();
    slotIds.forEach(id => {
      const m = id.match(/^AMS-([A-Z]):/);
      if (m) distinctUnits.add(m[1]);
    });
    return distinctUnits.size > 1 ? `${letter}:${idx}` : idx;
  }
  return slotId;
}

// Verbose label for dropdowns / tooltips.
function slotLongLabel(slotId) {
  if (slotId === "ext") return "External spool";
  const extMatch = slotId.match(/^ext:(\d+)$/);
  if (extMatch) return `Toolhead ${extMatch[1]}`;
  const amsMatch = slotId.match(/^AMS-([A-Z]):(\d+)$/);
  if (amsMatch) return `AMS ${amsMatch[1]} · slot ${amsMatch[2]}`;
  return slotId;
}

// Resolve an object's filament through the two-step indirection.
// Returns { material, slot, filament } — any leg may be null/undefined if
// the mapping is incomplete; callers should fall back gracefully.
function resolveObjectFilament(obj, materialMap, slotMap, filaments) {
  const materialId = obj && obj.materialId;
  const slotId = materialId ? materialMap[materialId] : null;
  const filamentId = slotId ? slotMap[slotId] : null;
  const filament = filamentId ? filaments.find(f => f.id === filamentId) : null;
  return { materialId, slotId, filamentId, filament };
}

window.SLICER_DATA = {
  CASCADE_LAYERS, LAYER_BY_ID, LAYER_INDEX,
  CATEGORIES, ALL_SETTINGS,
  SETTING_MODES, LEVEL_RANK, MODE_RANK, settingVisibleInMode, computeSettingLevel,
  resolveValue, getOverriddenLayers, countOverridesAtLayer,
  computeSlotIds, slotShortLabel, slotLongLabel,
  resolveObjectFilament,
};

// filament-catalog.jsx — A reasonably realistic catalog of filaments organized
// by brand → product line. Used by the filament picker dialog.
//
// Each product captures sensible default temps (nozzleTemp / bedTemp) so they
// can seed a new filament's `print_temp` etc. Materials are a small enum:
// PLA, PETG, ABS, ASA, TPU, PC, PA, PVB, HIPS.
//
// Color is decoupled from the product — every product can be ordered in any
// color from STANDARD_PALETTE below. Real-world product-specific color
// availability isn't modelled here; pick any color, get any color.

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-source="BuildPlate.jsx">
// BuildPlate.jsx — three.js viewport for the slicer.
// Renders a build plate with grid, drag-arrangeable primitive meshes,
// and orbit controls. Selection syncs with parent via props.

const { useEffect, useRef, useState, useMemo } = React;

// Geometry factory for our object library
function makeGeometry(THREE, kind, params = {}) {
  switch (kind) {
    case "cube":
      return new THREE.BoxGeometry(params.size || 20, params.size || 20, params.size || 20);
    case "cylinder":
      return new THREE.CylinderGeometry(params.r || 12, params.r || 12, params.h || 30, 48);
    case "sphere":
      return new THREE.SphereGeometry(params.r || 14, 32, 24);
    case "cone":
      return new THREE.ConeGeometry(params.r || 14, params.h || 30, 32);
    case "torus":
      return new THREE.TorusGeometry(params.r || 12, params.tube || 4, 16, 48);
    case "benchy": {
      // crude "boat-shaped" placeholder hull (not the copyrighted geometry)
      const shape = new THREE.Shape();
      shape.moveTo(-30, -10);
      shape.lineTo(30, -10);
      shape.lineTo(25, 8);
      shape.lineTo(-25, 8);
      shape.lineTo(-30, -10);
      const geom = new THREE.ExtrudeGeometry(shape, { depth: 18, bevelEnabled: true, bevelSize: 1.5, bevelThickness: 1, bevelSegments: 2 });
      geom.rotateX(-Math.PI / 2);
      geom.translate(0, 0, 0);
      return geom;
    }
    case "calicube": {
      const g = new THREE.BoxGeometry(20, 20, 20);
      return g;
    }
    case "temptower": {
      const merged = new THREE.BufferGeometry();
      // approximate via stacked boxes — we just return a tall box; segments drawn via shader would be fancier
      return new THREE.BoxGeometry(28, 80, 18);
    }
    case "stl_mount":
      return new THREE.BoxGeometry(45, 12, 30);
    case "stl_bracket":
      return new THREE.BoxGeometry(36, 28, 8);
    default:
      return new THREE.BoxGeometry(20, 20, 20);
  }
}

function BuildPlate({
  objects, setObjects,
  selectedId, setSelectedId,
  plateSize, // [x, y]
  filaments,
  slotMap,
  materialMap,
  onCameraReset,
}) {
  const mountRef = useRef(null);
  const stateRef = useRef({});
  const [draggingId, setDraggingId] = useState(null);

  // Setup once
  useEffect(() => {
    if (!window.THREE) return;
    const THREE = window.THREE;
    const mount = mountRef.current;
    if (!mount) return;

    const scene = new THREE.Scene();
    scene.background = null;

    const w = mount.clientWidth || 800;
    const h = mount.clientHeight || 600;

    const camera = new THREE.PerspectiveCamera(40, w / h, 1, 4000);
    camera.position.set(280, 260, 320);
    camera.lookAt(0, 30, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    mount.appendChild(renderer.domElement);

    // Lights
    const hemi = new THREE.HemisphereLight(0xffffff, 0xe6e8ec, 0.6);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(120, 220, 80);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    dir.shadow.camera.left = -200;
    dir.shadow.camera.right = 200;
    dir.shadow.camera.top = 200;
    dir.shadow.camera.bottom = -200;
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0xffffff, 0.25);
    fill.position.set(-200, 100, -120);
    scene.add(fill);

    // Build plate (group)
    const plateGroup = new THREE.Group();
    scene.add(plateGroup);

    const buildPlate = (sizeX, sizeY) => {
      while (plateGroup.children.length) plateGroup.remove(plateGroup.children[0]);

      // Base plate
      const plateGeom = new THREE.BoxGeometry(sizeX, 4, sizeY);
      const plateMat = new THREE.MeshStandardMaterial({
        color: 0x1f2228,
        roughness: 0.85,
        metalness: 0.05,
      });
      const plate = new THREE.Mesh(plateGeom, plateMat);
      plate.position.y = -2;
      plate.receiveShadow = true;
      plateGroup.add(plate);

      // Bevel edge — thin lighter cap
      const capGeom = new THREE.BoxGeometry(sizeX, 0.4, sizeY);
      const capMat = new THREE.MeshStandardMaterial({ color: 0x2a2e36, roughness: 0.7 });
      const cap = new THREE.Mesh(capGeom, capMat);
      cap.position.y = 0.21;
      plateGroup.add(cap);

      // Grid
      const grid = new THREE.GridHelper(Math.max(sizeX, sizeY), Math.max(sizeX, sizeY) / 10, 0x4a505a, 0x35393f);
      grid.material.opacity = 0.5; grid.material.transparent = true;
      grid.position.y = 0.42;
      // crop to plate (we use scale trick — grid is square so we let it overflow, masked by plate edges? skip mask, use second grid)
      plateGroup.add(grid);

      // Plate outline
      const outlineGeom = new THREE.EdgesGeometry(plateGeom);
      const outlineMat = new THREE.LineBasicMaterial({ color: 0x6a727f });
      const outline = new THREE.LineSegments(outlineGeom, outlineMat);
      outline.position.y = -2;
      plateGroup.add(outline);

      // Origin marker
      const originGeom = new THREE.RingGeometry(2, 3, 16);
      const originMat = new THREE.MeshBasicMaterial({ color: 0xff5566, side: THREE.DoubleSide });
      const origin = new THREE.Mesh(originGeom, originMat);
      origin.rotation.x = -Math.PI / 2;
      origin.position.set(-sizeX / 2 + 5, 0.5, sizeY / 2 - 5);
      plateGroup.add(origin);

      // X/Y axis labels (just colored lines)
      const xAxisMat = new THREE.LineBasicMaterial({ color: 0xff5566 });
      const xAxisGeom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-sizeX / 2 + 2, 0.5, sizeY / 2 - 5),
        new THREE.Vector3(-sizeX / 2 + 22, 0.5, sizeY / 2 - 5),
      ]);
      plateGroup.add(new THREE.Line(xAxisGeom, xAxisMat));
      const yAxisMat = new THREE.LineBasicMaterial({ color: 0x66cc88 });
      const yAxisGeom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-sizeX / 2 + 2, 0.5, sizeY / 2 - 5),
        new THREE.Vector3(-sizeX / 2 + 2, 0.5, sizeY / 2 - 25),
      ]);
      plateGroup.add(new THREE.Line(yAxisGeom, yAxisMat));
    };

    buildPlate(plateSize[0], plateSize[1]);

    // Object group
    const objectGroup = new THREE.Group();
    scene.add(objectGroup);

    // Orbit controls (minimal hand-rolled, since we may not have OrbitControls)
    const ctrl = {
      rotating: false, panning: false,
      lastX: 0, lastY: 0,
      theta: Math.atan2(camera.position.x, camera.position.z),
      phi: Math.acos(camera.position.y / camera.position.length()),
      radius: camera.position.length(),
      target: new THREE.Vector3(0, 30, 0),
    };

    const applyCamera = () => {
      const sinPhi = Math.sin(ctrl.phi);
      camera.position.x = ctrl.target.x + ctrl.radius * sinPhi * Math.sin(ctrl.theta);
      camera.position.z = ctrl.target.z + ctrl.radius * sinPhi * Math.cos(ctrl.theta);
      camera.position.y = ctrl.target.y + ctrl.radius * Math.cos(ctrl.phi);
      camera.lookAt(ctrl.target);
    };
    applyCamera();

    // Raycaster for object selection + drag
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const dragOffset = new THREE.Vector3();
    let dragMesh = null;

    const getMouse = (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    };

    const intersectGround = () => {
      const target = new THREE.Vector3();
      raycaster.setFromCamera(mouse, camera);
      raycaster.ray.intersectPlane(dragPlane, target);
      return target;
    };

    const onPointerDown = (e) => {
      getMouse(e);
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objectGroup.children, false);
      if (e.button === 0 && intersects.length > 0) {
        const mesh = intersects[0].object;
        dragMesh = mesh;
        setSelectedId(mesh.userData.id);
        setDraggingId(mesh.userData.id);
        const ground = intersectGround();
        dragOffset.set(mesh.position.x - ground.x, 0, mesh.position.z - ground.z);
        renderer.domElement.style.cursor = "grabbing";
      } else if (e.button === 0) {
        setSelectedId(null);
        ctrl.rotating = true;
        ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
      } else if (e.button === 1 || e.button === 2) {
        ctrl.panning = true;
        ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
      }
    };
    const onPointerMove = (e) => {
      getMouse(e);
      if (dragMesh) {
        const ground = intersectGround();
        const halfX = plateSize[0] / 2;
        const halfY = plateSize[1] / 2;
        const newX = Math.max(-halfX, Math.min(halfX, ground.x + dragOffset.x));
        const newZ = Math.max(-halfY, Math.min(halfY, ground.z + dragOffset.z));
        dragMesh.position.x = newX;
        dragMesh.position.z = newZ;
        // sync to state
        setObjects(prev => prev.map(o =>
          o.id === dragMesh.userData.id ? { ...o, x: newX, y: newZ } : o
        ));
      } else if (ctrl.rotating) {
        const dx = e.clientX - ctrl.lastX;
        const dy = e.clientY - ctrl.lastY;
        ctrl.theta -= dx * 0.006;
        ctrl.phi -= dy * 0.006;
        ctrl.phi = Math.max(0.15, Math.min(Math.PI / 2 - 0.05, ctrl.phi));
        ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
        applyCamera();
      } else if (ctrl.panning) {
        const dx = e.clientX - ctrl.lastX;
        const dy = e.clientY - ctrl.lastY;
        // pan in world space
        const panSpeed = ctrl.radius * 0.0015;
        const right = new THREE.Vector3(Math.cos(ctrl.theta), 0, -Math.sin(ctrl.theta));
        const up = new THREE.Vector3(0, 1, 0);
        ctrl.target.addScaledVector(right, -dx * panSpeed);
        ctrl.target.addScaledVector(up, dy * panSpeed);
        ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
        applyCamera();
      } else {
        // hover: change cursor when over an object
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objectGroup.children, false);
        renderer.domElement.style.cursor = intersects.length > 0 ? "grab" : "default";
      }
    };
    const onPointerUp = (e) => {
      if (dragMesh) {
        dragMesh = null;
        setDraggingId(null);
        renderer.domElement.style.cursor = "default";
      }
      ctrl.rotating = false;
      ctrl.panning = false;
    };
    const onWheel = (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 1.1 : 0.9;
      ctrl.radius = Math.max(80, Math.min(900, ctrl.radius * delta));
      applyCamera();
    };
    const onContext = (e) => e.preventDefault();

    renderer.domElement.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    renderer.domElement.addEventListener("wheel", onWheel, { passive: false });
    renderer.domElement.addEventListener("contextmenu", onContext);

    // Resize
    const onResize = () => {
      const w = mount.clientWidth;
      const h = mount.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    const ro = new ResizeObserver(onResize);
    ro.observe(mount);

    // Animate
    let raf;
    const animate = () => {
      raf = requestAnimationFrame(animate);
      renderer.render(scene, camera);
    };
    animate();

    // expose
    stateRef.current = {
      THREE, scene, camera, renderer, plateGroup, objectGroup, ctrl, applyCamera, buildPlate,
    };

    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      renderer.domElement.removeEventListener("pointerdown", onPointerDown);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("pointerup", onPointerUp);
      renderer.domElement.removeEventListener("wheel", onWheel);
      renderer.domElement.removeEventListener("contextmenu", onContext);
      try { mount.removeChild(renderer.domElement); } catch {}
      renderer.dispose();
    };
  }, []);

  // Rebuild plate if size changes
  useEffect(() => {
    const s = stateRef.current;
    if (s && s.buildPlate) s.buildPlate(plateSize[0], plateSize[1]);
  }, [plateSize[0], plateSize[1]]);

  // Sync objects to scene
  useEffect(() => {
    const s = stateRef.current;
    if (!s || !s.THREE) return;
    const { THREE, objectGroup } = s;

    // Reconcile: remove meshes whose ids vanished
    const idsInState = new Set(objects.map(o => o.id));
    const meshesToRemove = [];
    objectGroup.children.forEach(m => {
      if (!idsInState.has(m.userData.id)) meshesToRemove.push(m);
    });
    meshesToRemove.forEach(m => objectGroup.remove(m));

    // Add or update
    objects.forEach(obj => {
      let mesh = objectGroup.children.find(m => m.userData.id === obj.id);
      const { filament: fil } = window.SLICER_DATA.resolveObjectFilament(
        obj, materialMap, slotMap, filaments
      );
      const color = new THREE.Color((fil && fil.color) || "#7AA2D9");
      const isSelected = obj.id === selectedId;
      const emissive = isSelected ? new THREE.Color("#FFFFFF").multiplyScalar(0.08) : new THREE.Color(0,0,0);

      if (!mesh) {
        const geom = makeGeometry(THREE, obj.kind);
        // size it so it sits on the plate
        geom.computeBoundingBox();
        const bb = geom.boundingBox;
        const minY = bb.min.y;
        geom.translate(0, -minY, 0);
        const mat = new THREE.MeshStandardMaterial({
          color, roughness: 0.55, metalness: 0.05, emissive,
        });
        mesh = new THREE.Mesh(geom, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData.id = obj.id;
        mesh.userData.kind = obj.kind;
        // Add outline (using EdgesGeometry as child)
        const edges = new THREE.EdgesGeometry(geom, 30);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.0 });
        const wire = new THREE.LineSegments(edges, lineMat);
        wire.userData.isOutline = true;
        mesh.add(wire);
        objectGroup.add(mesh);
      }
      mesh.position.set(obj.x, 0, obj.y);
      if (obj.rotZ !== undefined) mesh.rotation.y = obj.rotZ;
      if (mesh.material) {
        mesh.material.color.copy(color);
        mesh.material.emissive.copy(emissive);
        if (isSelected) {
          mesh.material.emissiveIntensity = 1;
        } else {
          mesh.material.emissiveIntensity = 0;
        }
      }
      // outline
      const wire = mesh.children.find(c => c.userData.isOutline);
      if (wire) {
        wire.material.opacity = isSelected ? 0.9 : 0.0;
        wire.material.color.set(isSelected ? 0xffffff : 0xffffff);
      }
    });
  }, [objects, selectedId, filaments, slotMap, materialMap, plateSize[0], plateSize[1]]);

  // Drop handling (from object library drag)
  const onDragOver = (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    mountRef.current?.parentElement?.classList.add("drop-target");
  };
  const onDragLeave = () => {
    mountRef.current?.parentElement?.classList.remove("drop-target");
  };
  const onDrop = (e) => {
    e.preventDefault();
    mountRef.current?.parentElement?.classList.remove("drop-target");
    try {
      const payload = JSON.parse(e.dataTransfer.getData("application/json"));
      const s = stateRef.current;
      if (!s) return;
      // compute drop world position on the ground plane
      const rect = s.renderer.domElement.getBoundingClientRect();
      const mouse = new s.THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      const ray = new s.THREE.Raycaster();
      ray.setFromCamera(mouse, s.camera);
      const target = new s.THREE.Vector3();
      ray.ray.intersectPlane(new s.THREE.Plane(new s.THREE.Vector3(0, 1, 0), 0), target);
      const halfX = plateSize[0] / 2;
      const halfY = plateSize[1] / 2;
      const x = Math.max(-halfX, Math.min(halfX, target.x));
      const y = Math.max(-halfY, Math.min(halfY, target.z));

      const id = `obj_${Date.now()}_${Math.floor(Math.random() * 999)}`;
      setObjects(prev => [...prev, {
        id,
        name: payload.name,
        kind: payload.kind,
        x, y, rotZ: 0,
        materialId: payload.materialId || "M1",
        overrides: {},
      }]);
      setSelectedId(id);
    } catch (err) {
      console.warn("drop failed", err);
    }
  };

  // Camera reset
  useEffect(() => {
    if (!onCameraReset) return;
    onCameraReset.current = () => {
      const s = stateRef.current;
      if (!s) return;
      s.ctrl.theta = Math.atan2(280, 320);
      s.ctrl.phi = Math.PI / 2.6;
      s.ctrl.radius = 480;
      s.ctrl.target.set(0, 30, 0);
      s.applyCamera();
    };
  }, [onCameraReset]);

  return (
    <div
      ref={mountRef}
      style={{ position: "absolute", inset: 0 }}
      onDragOver={onDragOver}
      onDragLeave={onDragLeave}
      onDrop={onDrop}
    />
  );
}

window.BuildPlate = BuildPlate;

</script>
<script type="text/babel" data-source="ObjectsPanel.jsx">
// ObjectsPanel.jsx — left panel: object library + plate object list.

const { useState: useStateOP, useRef: useRefOP, useEffect: useEffectOP } = React;
const {
  resolveObjectFilament: resolveOP,
  slotShortLabel: slotShortOP,
  slotLongLabel: slotLongOP,
} = window.SLICER_DATA;

const OBJECT_LIBRARY = [
  { section: "Primitives", items: [
    { kind: "cube",     name: "Cube",     meta: "20 mm" },
    { kind: "cylinder", name: "Cylinder", meta: "Ø24 × 30" },
    { kind: "sphere",   name: "Sphere",   meta: "Ø28" },
    { kind: "cone",     name: "Cone",     meta: "Ø28 × 30" },
    { kind: "torus",    name: "Torus",    meta: "Ø28 / 4" },
  ]},
  { section: "Calibration", items: [
    { kind: "calicube",  name: "calibration_cube.stl",   meta: "20×20×20" },
    { kind: "temptower", name: "temp_tower.stl",         meta: "28×80×18" },
    { kind: "benchy",    name: "boat_test.stl",          meta: "60×18×20" },
  ]},
  { section: "Imported", items: [
    { kind: "stl_mount",   name: "front_mount_v3.stl",    meta: "45×30×12" },
    { kind: "stl_bracket", name: "fan_bracket_r2.stl",    meta: "36×8×28"  },
  ]},
];

// Natural-sort material ids so M2 precedes M10.
function sortMaterialIds(ids) {
  return [...ids].sort((a, b) => {
    const na = parseInt((a.match(/\d+/) || [0])[0], 10);
    const nb = parseInt((b.match(/\d+/) || [0])[0], 10);
    return na - nb || a.localeCompare(b);
  });
}

// Floating picker anchored (fixed-position, so it escapes the object list's
// scroll clip) under an object's material badge. Two views:
//   1. "Assign" — pick any existing project material (M1, M2…); each row shows
//      where that material is routed and the filament colour/label.
//   2. "Create" — mint a new material and route it to any loaded slot.
function MaterialPicker({
  obj, materialMap, slotMap, filaments, slotIds,
  anchorRect, onAssign, onCreate, onClose,
}) {
  const [creating, setCreating] = useStateOP(false);
  const menuRef = useRefOP(null);

  useEffectOP(() => {
    const onDoc = (e) => {
      if (menuRef.current && !menuRef.current.contains(e.target)) onClose();
    };
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDoc);
      document.removeEventListener("keydown", onKey);
    };
  }, []);

  const materials = sortMaterialIds(Object.keys(materialMap || {}));

  // Clamp the menu within the viewport. Width is fixed by CSS (220px).
  const MENU_W = 224;
  const style = { position: "fixed" };
  if (anchorRect) {
    const left = Math.min(anchorRect.left, window.innerWidth - MENU_W - 8);
    style.left = Math.max(8, left);
    // Prefer below the badge; flip above if it would overflow the viewport.
    const estH = creating ? 40 + slotIds.length * 34 : 64 + materials.length * 34;
    style.top = (anchorRect.bottom + estH > window.innerHeight - 8)
      ? Math.max(8, anchorRect.top - estH - 4)
      : anchorRect.bottom + 4;
  }

  const swatchOf = (slotId) => {
    const fid = slotId ? (slotMap || {})[slotId] : null;
    return fid ? filaments.find(x => x.id === fid) : null;
  };

  return (
    <div
      ref={menuRef}
      className="printer-picker-menu material-picker-menu"
      style={style}
      onClick={(e) => e.stopPropagation()}
    >
      {!creating ? (
        <React.Fragment>
          <div className="ptpm-title">Material · {obj.name}</div>
          {materials.map(mid => {
            const slotId = (materialMap || {})[mid];
            const f = swatchOf(slotId);
            const active = obj.materialId === mid;
            return (
              <button
                key={mid}
                className={`ptpm-item ptpm-row mp-item ${active ? "active" : ""}`}
                onClick={() => { onAssign(mid); onClose(); }}
              >
                <span className="ptpm-name">
                  <span className="ptpm-swatch" style={{ background: f?.color || "transparent", border: f ? "none" : "1px dashed currentColor" }}/>
                  <span className="mp-mid">{mid}</span>
                  <span className="mp-arrow">→</span>
                  <span className="mp-slot">{slotId ? slotShortOP(slotId, slotIds) : "—"}</span>
                </span>
                <span className="ptpm-detail">{f ? f.label : "unmapped"}</span>
              </button>
            );
          })}
          <div className="ptpm-sep"/>
          <button className="ptpm-item ptpm-add" onClick={() => setCreating(true)}>
            <span className="ptpm-name">+ New material</span>
            <span className="ptpm-detail">from slot…</span>
          </button>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <button className="ptpm-title mp-back" onClick={() => setCreating(false)}>
            <svg width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">
              <path d="M6.5 1.5l-3.5 3.5 3.5 3.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            New material — route to slot
          </button>
          {slotIds.map(sid => {
            const f = swatchOf(sid);
            return (
              <button
                key={sid}
                className="ptpm-item ptpm-row mp-item"
                onClick={() => { onCreate(sid); onClose(); }}
              >
                <span className="ptpm-name">
                  <span className="ptpm-swatch" style={{ background: f?.color || "transparent", border: f ? "none" : "1px dashed currentColor" }}/>
                  {slotLongOP(sid)}
                </span>
                <span className="ptpm-detail">{f ? f.label : "empty"}</span>
              </button>
            );
          })}
        </React.Fragment>
      )}
    </div>
  );
}

function ObjectsPanel({
  objects, setObjects,
  selectedId, setSelectedId,
  filaments,
  slotMap,
  materialMap,
  slotIds = [],
  setObjectMaterial,
  createMaterialForObject,
  printerName,
  countObjectOverrides,
  plateSize,
  // Read-only mode (Preview): hides the add button, remove buttons, and
  // library popover. Objects can still be clicked to select for visual
  // cross-reference with the sliced canvas.
  readOnly = false,
}) {
  const [showLibrary, setShowLibrary] = useStateOP(false);
  // Multi-selection used purely for grouping operations. The single-select
  // (`selectedId`, owned by the app) still drives the 3D highlight + settings
  // "object" context; this set rides alongside it for batch actions.
  const [multiSel, setMultiSel] = useStateOP(() => new Set());
  // Which groups are collapsed in the list (local view state).
  const [collapsed, setCollapsed] = useStateOP(() => new Set());
  // Group whose name is currently being edited inline.
  const [editingGroup, setEditingGroup] = useStateOP(null);
  // Which object's material picker is open: { objId, rect } or null.
  const [materialPicker, setMaterialPicker] = useStateOP(null);
  const draggingRef = useRefOP(null);

  const handleDragStart = (e, item) => {
    const payload = {
      kind: item.kind,
      name: item.name,
      materialId: "M1",
    };
    e.dataTransfer.setData("application/json", JSON.stringify(payload));
    e.dataTransfer.effectAllowed = "copy";
    // ghost
    const ghost = document.createElement("div");
    ghost.className = "drag-preview";
    ghost.textContent = item.name;
    ghost.style.left = "-9999px";
    document.body.appendChild(ghost);
    e.dataTransfer.setDragImage(ghost, 0, 0);
    setTimeout(() => ghost.remove(), 0);
  };

  const addItem = (item) => {
    // Place it at a tidy grid slot
    const id = `obj_${Date.now()}_${Math.floor(Math.random() * 999)}`;
    const n = objects.length;
    const cols = 3;
    const spacing = 50;
    const x = ((n % cols) - 1) * spacing;
    const y = (Math.floor(n / cols) - 1) * spacing;
    setObjects(prev => [...prev, {
      id, name: item.name, kind: item.kind,
      x, y, rotZ: 0,
      materialId: "M1",
      groupId: null,
      overrides: {},
    }]);
    setSelectedId(id);
    setShowLibrary(false);
  };

  // After any removal, dissolve groups that would be left with fewer than two
  // members — a "group of one" isn't a group.
  const dissolveOrphanGroups = (list) => {
    const counts = {};
    list.forEach(o => { if (o.groupId) counts[o.groupId] = (counts[o.groupId] || 0) + 1; });
    return list.map(o => (o.groupId && counts[o.groupId] < 2)
      ? { ...o, groupId: null, groupName: undefined }
      : o);
  };

  const removeObject = (id, e) => {
    e?.stopPropagation();
    setObjects(prev => dissolveOrphanGroups(prev.filter(o => o.id !== id)));
    if (selectedId === id) setSelectedId(null);
    setMultiSel(prev => { const n = new Set(prev); n.delete(id); return n; });
  };

  // ── Selection ────────────────────────────────────────────────────────────
  const handleRowClick = (e, id) => {
    if (readOnly) { setSelectedId(id); return; }
    if (e.metaKey || e.ctrlKey || e.shiftKey) {
      // Toggle multi-selection without disturbing the primary selection.
      e.preventDefault();
      setMultiSel(prev => {
        const n = new Set(prev);
        n.has(id) ? n.delete(id) : n.add(id);
        return n;
      });
    } else {
      setMultiSel(new Set());
      setSelectedId(id);
    }
  };

  // Clicking a group header selects all its members (multi-select).
  const selectGroup = (members) => {
    if (readOnly) return;
    setMultiSel(new Set(members.map(m => m.id)));
    setSelectedId(members[0].id);
  };

  // ── Grouping actions ───────────────────────────────────────────────────────
  const existingGroupCount = new Set(objects.filter(o => o.groupId).map(o => o.groupId)).size;

  const groupSelected = () => {
    if (multiSel.size < 2) return;
    const gid = `grp_${Date.now().toString(36)}`;
    const name = `Group ${existingGroupCount + 1}`;
    setObjects(prev => prev.map(o => multiSel.has(o.id)
      ? { ...o, groupId: gid, groupName: name }
      : o));
    setMultiSel(new Set());
  };

  const ungroup = (gid, e) => {
    e?.stopPropagation();
    setObjects(prev => prev.map(o => o.groupId === gid
      ? { ...o, groupId: null, groupName: undefined }
      : o));
  };

  const renameGroup = (gid, name) => {
    setObjects(prev => prev.map(o => o.groupId === gid ? { ...o, groupName: name } : o));
  };

  const toggleCollapse = (gid) => {
    setCollapsed(prev => { const n = new Set(prev); n.has(gid) ? n.delete(gid) : n.add(gid); return n; });
  };

  // ── Build the grouped render order ─────────────────────────────────────────
  // Walk objects in their natural order; the first time a grouped object is
  // seen, emit the whole group (all members, in order) at that position.
  const renderList = [];
  const seenGroups = new Set();
  for (const obj of objects) {
    if (obj.groupId) {
      if (seenGroups.has(obj.groupId)) continue;
      seenGroups.add(obj.groupId);
      const members = objects.filter(o => o.groupId === obj.groupId);
      renderList.push({ type: "group", groupId: obj.groupId, name: members[0].groupName || "Group", members });
    } else {
      renderList.push({ type: "single", obj });
    }
  }

  // Render a single object row (used both standalone and inside a group).
  const renderRow = (obj, { inGroup = false } = {}) => {
    const { materialId, filament } = resolveOP(obj, materialMap, slotMap, filaments);
    const color = (filament && filament.color) || "#888";
    const filLabel = (filament && filament.label) || "unassigned";
    const overrideCount = countObjectOverrides(obj.id);
    const isPrimary = selectedId === obj.id;
    const isMulti = multiSel.has(obj.id);
    return (
      <div
        key={obj.id}
        className={`object-item ${isPrimary ? "selected" : ""} ${isMulti ? "multi" : ""} ${inGroup ? "in-group" : ""}`}
        onClick={(e) => handleRowClick(e, obj.id)}
      >
        <div className="object-thumb">{obj.kind.slice(0, 2).toUpperCase()}</div>
        <div style={{ minWidth: 0 }}>
          <div className="object-name">
            <span className="object-color-tag" style={{ background: color }}/>
            {obj.name}
          </div>
          <div className="object-meta">
            {readOnly ? (
              <span className="object-material-badge" title={`Material ${materialId} → ${filLabel}`}>{materialId || "M?"}</span>
            ) : (
              <button
                className={`object-material-badge object-material-badge-btn ${materialPicker && materialPicker.objId === obj.id ? "open" : ""}`}
                title={`Material ${materialId || "—"} → ${filLabel}\nClick to assign or create a material`}
                onClick={(e) => {
                  e.stopPropagation();
                  const rect = e.currentTarget.getBoundingClientRect();
                  setMaterialPicker(prev => prev && prev.objId === obj.id ? null : { objId: obj.id, rect });
                }}
              >
                {materialId || "M?"}
                <svg className="mp-badge-chev" width="7" height="7" viewBox="0 0 10 10" fill="none" aria-hidden="true">
                  <path d="M2 3.5L5 6.5l3-3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </button>
            )}
            <span>{Math.round(obj.x)}, {Math.round(obj.y)} mm</span>
            <span className="dim">· {filLabel}</span>
          </div>
        </div>
        <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
          {overrideCount > 0 && (
            <span className="object-overrides" title={`${overrideCount} per-object overrides`}>
              {overrideCount}
            </span>
          )}
          {!readOnly && (
            <button
              className="icon-btn"
              title="Remove"
              onClick={(e) => removeObject(obj.id, e)}
            >
              <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
              </svg>
            </button>
          )}
        </div>
      </div>
    );
  };

  return (
    <aside className={`objects-panel ${readOnly ? "readonly" : ""}`}>
      <div className="panel-head">
        <h3>Plate · {printerName}</h3>
        {readOnly ? (
          <span className="panel-head-readonly-tag" title="Preview mode — switch to Prepare to edit">
            <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
              <rect x="2" y="5" width="8" height="6" rx="1" stroke="currentColor" strokeWidth="1.2"/>
              <path d="M4 5V3.5a2 2 0 0 1 4 0V5" stroke="currentColor" strokeWidth="1.2"/>
            </svg>
            Read-only
          </span>
        ) : (
          <button className="icon-btn" title="Add object" onClick={() => setShowLibrary(s => !s)}>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M6 1.5v9M1.5 6h9" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
            </svg>
          </button>
        )}
      </div>

      {/* Multi-select action bar — appears when 2+ objects are picked via
          ⌘/Ctrl/Shift-click, offering to combine them into a group. */}
      {!readOnly && multiSel.size > 0 && (
        <div className="object-selbar">
          <span className="object-selbar-count">{multiSel.size} selected</span>
          <div className="object-selbar-actions">
            <button
              className="object-selbar-btn primary"
              disabled={multiSel.size < 2}
              title={multiSel.size < 2 ? "Select at least two objects" : "Group selected objects"}
              onClick={groupSelected}
            >
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
                <rect x="1.5" y="1.5" width="5" height="5" rx="1" stroke="currentColor" strokeWidth="1.2"/>
                <rect x="5.5" y="5.5" width="5" height="5" rx="1" stroke="currentColor" strokeWidth="1.2" fill="var(--surface)"/>
              </svg>
              Group
            </button>
            <button className="object-selbar-btn" title="Clear selection" onClick={() => setMultiSel(new Set())}>
              Clear
            </button>
          </div>
        </div>
      )}

      <div className="object-list">
        {objects.length === 0 && !readOnly && (
          <div className="empty-state">
            Drag an object from the library<br/>or click <span className="kbd-inline">+</span> to add one.
          </div>
        )}
        {objects.length === 0 && readOnly && (
          <div className="empty-state">
            No objects on this plate.
          </div>
        )}
        {renderList.map(entry => {
          if (entry.type === "single") return renderRow(entry.obj);

          // ── Group block ──
          const { groupId, name, members } = entry;
          const isCollapsed = collapsed.has(groupId);
          const allSelected = members.every(m => multiSel.has(m.id));
          // Distinct member colors for the header swatch stack.
          const swatches = [];
          members.forEach(m => {
            const { filament } = resolveOP(m, materialMap, slotMap, filaments);
            const c = (filament && filament.color) || "#888";
            if (!swatches.includes(c)) swatches.push(c);
          });
          return (
            <div key={groupId} className={`object-group ${allSelected ? "selected" : ""}`}>
              <div
                className="object-group-head"
                onClick={() => selectGroup(members)}
                title="Click to select the whole group"
              >
                <button
                  className={`object-group-caret ${isCollapsed ? "collapsed" : ""}`}
                  onClick={(e) => { e.stopPropagation(); toggleCollapse(groupId); }}
                  title={isCollapsed ? "Expand group" : "Collapse group"}
                >
                  <svg width="9" height="9" viewBox="0 0 10 10" fill="none">
                    <path d="M3 1.5l4 3.5-4 3.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </button>
                <svg className="object-group-icon" width="12" height="12" viewBox="0 0 14 14" fill="none">
                  <rect x="1.5" y="1.5" width="6" height="6" rx="1.2" stroke="currentColor" strokeWidth="1.2"/>
                  <rect x="6.5" y="6.5" width="6" height="6" rx="1.2" stroke="currentColor" strokeWidth="1.2" fill="var(--surface)"/>
                </svg>
                {editingGroup === groupId && !readOnly ? (
                  <input
                    className="object-group-name-input"
                    defaultValue={name}
                    autoFocus
                    onClick={(e) => e.stopPropagation()}
                    onBlur={(e) => { renameGroup(groupId, e.target.value.trim() || name); setEditingGroup(null); }}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") { renameGroup(groupId, e.target.value.trim() || name); setEditingGroup(null); }
                      if (e.key === "Escape") setEditingGroup(null);
                    }}
                  />
                ) : (
                  <span
                    className="object-group-name"
                    onClick={readOnly ? undefined : (e) => { e.stopPropagation(); setEditingGroup(groupId); }}
                    title={readOnly ? name : "Click to rename group"}
                  >
                    {name}
                  </span>
                )}
                <span className="object-group-count">{members.length}</span>
                <span className="object-group-swatches">
                  {swatches.slice(0, 4).map((c, i) => (
                    <span key={i} className="object-group-swatch" style={{ background: c }}/>
                  ))}
                </span>
                {!readOnly && (
                  <button
                    className="object-group-ungroup icon-btn"
                    title="Ungroup"
                    onClick={(e) => ungroup(groupId, e)}
                  >
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
                      <rect x="1.5" y="1.5" width="4" height="4" rx="0.8" stroke="currentColor" strokeWidth="1.1"/>
                      <rect x="6.5" y="6.5" width="4" height="4" rx="0.8" stroke="currentColor" strokeWidth="1.1"/>
                      <path d="M10.5 1.5l-9 9" stroke="currentColor" strokeWidth="1.1" strokeLinecap="round"/>
                    </svg>
                  </button>
                )}
              </div>
              {!isCollapsed && (
                <div className="object-group-members">
                  {members.map(m => renderRow(m, { inGroup: true }))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {showLibrary && !readOnly && (
        <div className="add-menu" style={{ maxHeight: 320, overflowY: "auto" }}>
          {OBJECT_LIBRARY.map(group => (
            <React.Fragment key={group.section}>
              <div className="add-section-label">{group.section}</div>
              {group.items.map(item => (
                <button
                  key={item.kind + item.name}
                  className="add-menu-item"
                  draggable
                  onDragStart={(e) => handleDragStart(e, item)}
                  onClick={() => addItem(item)}
                >
                  <span>{item.name}</span>
                  <span className="meta">{item.meta}</span>
                </button>
              ))}
            </React.Fragment>
          ))}
        </div>
      )}

      <div className="plate-stats">
        <div className="plate-stat-row">
          <span className="k">Build plate</span>
          <span className="v">{plateSize[0]} × {plateSize[1]} mm</span>
        </div>
        <div className="plate-stat-row">
          <span className="k">Objects</span>
          <span className="v">{objects.length}</span>
        </div>
      </div>

      {materialPicker && !readOnly && (() => {
        const obj = objects.find(o => o.id === materialPicker.objId);
        if (!obj) return null;
        return (
          <MaterialPicker
            obj={obj}
            materialMap={materialMap}
            slotMap={slotMap}
            filaments={filaments}
            slotIds={slotIds}
            anchorRect={materialPicker.rect}
            onAssign={(mid) => setObjectMaterial && setObjectMaterial(obj.id, mid)}
            onCreate={(sid) => createMaterialForObject && createMaterialForObject(obj.id, sid)}
            onClose={() => setMaterialPicker(null)}
          />
        );
      })()}
    </aside>
  );
}

window.OBJECT_LIBRARY = OBJECT_LIBRARY;
window.ObjectsPanel = ObjectsPanel;

</script>
<script type="text/babel" data-source="SettingsPanel.jsx">
// SettingsPanel.jsx — categorized scrolling settings list with
// instant search, category jump-rail, and value-cascade accountability.

const { useState: useSPS, useMemo: useSPM, useRef: useSPR, useEffect: useSPE, useCallback: useSPC } = React;

const {
  CASCADE_LAYERS, LAYER_BY_ID,
  CATEGORIES, ALL_SETTINGS,
  resolveValue, getOverriddenLayers,
  computeSlotIds, slotShortLabel, slotLongLabel,
  SETTING_MODES, settingVisibleInMode,
} = window.SLICER_DATA;

// Connection-indicator tooltip copy, keyed by status.
const CONN_LABELS = {
  none:       "No connection configured",
  connecting: "Connecting…",
  connected:  "Connected",
  failed:     "Connection failed",
};

// tiny chevron used on dropdown chips
const ChevronChip = () => (
  <svg width="9" height="9" viewBox="0 0 10 10" fill="none" style={{ opacity: 0.55, flexShrink: 0 }}>
    <path d="M2 4l3 3 3-3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);

// Print-quality presets. Each maps to a base layer height; selecting one is
// the coarse "how fine do you want this print" control that sits above the
// 800+ granular settings below. Ordered fastest → finest.
const QUALITY_PROFILES = [
  { id: "draft",     name: "Draft",      layer: "0.28", note: "Fast" },
  { id: "standard",  name: "Standard",   layer: "0.20", note: "Balanced" },
  { id: "fine",      name: "Fine",       layer: "0.12", note: "Detailed" },
  { id: "superfine", name: "Extra Fine", layer: "0.08", note: "Slowest" },
];

// ───────── fuzzy match (very small implementation) ─────────
function fuzzyScore(needle, hay) {
  if (!needle) return 1;
  needle = needle.toLowerCase();
  hay = hay.toLowerCase();
  if (hay.includes(needle)) return 1 - (hay.indexOf(needle) / hay.length) * 0.3;
  let ni = 0; let score = 0; let lastIdx = -1;
  for (let i = 0; i < hay.length && ni < needle.length; i++) {
    if (hay[i] === needle[ni]) {
      score += 1 - (lastIdx === -1 ? 0 : (i - lastIdx - 1) * 0.05);
      lastIdx = i;
      ni++;
    }
  }
  return ni === needle.length ? Math.max(0, score / needle.length * 0.6) : 0;
}

// ───────── Cascade Ladder (hover) ─────────
// Rendered via a portal at body level (with fixed positioning) so the scroll
// container clipping inside .settings-scroll can't swallow it.
function CascadeLadder({ rowRect, onLadderEnter, onLadderLeave, setting, layerOverrides, winner, onPromote, onReset, contextLayer, objectOverrides }) {
  if (!rowRect) return null;
  const allDefinedIds = new Set(
    CASCADE_LAYERS
      .filter(l => layerOverrides[l.id] !== undefined && layerOverrides[l.id] !== null)
      .map(l => l.id)
  );

  const LADDER_W = 250;
  const pad = 8;
  // Default position: to the left of the row, vertically centered.
  let left = rowRect.left - LADDER_W - 10;
  if (left < pad) {
    // not enough room on the left — fall back to the right of the row
    left = Math.min(window.innerWidth - LADDER_W - pad, rowRect.right + 10);
  }
  const top = Math.max(pad, Math.min(rowRect.top + rowRect.height / 2, window.innerHeight - pad));

  return ReactDOM.createPortal(
    <div
      className="cascade-ladder"
      style={{ position: "fixed", top, left, transform: "translateY(-50%)" }}
      onMouseEnter={onLadderEnter}
      onMouseLeave={onLadderLeave}
    >
      <div className="ladder-title">Value cascade · {setting.name}</div>
      {CASCADE_LAYERS.filter(l => l.id !== "object").map(layer => {
        const has = allDefinedIds.has(layer.id);
        const v = layerOverrides[layer.id];
        const isWinner = layer.id === winner;
        const isOverridden = has && !isWinner;
        return (
          <div
            key={layer.id}
            className={`ladder-row ${has ? "" : "empty"} ${isWinner ? "winner" : ""} ${isOverridden ? "overridden" : ""}`}
            style={{ "--row-hue": layer.hue }}
          >
            <span className={`l-dot ${has ? "" : "empty"}`}/>
            <span className="l-name">{layer.label}</span>
            <span className={`l-val ${has ? "" : "muted"}`}>
              {has ? formatVal(v, setting.unit) : "—"}
            </span>
          </div>
        );
      })}

      {objectOverrides && objectOverrides.length > 0 && (
        <>
          <div className="ladder-section-title">
            <span className="ladder-section-dot" style={{ background: `hsl(${LAYER_BY_ID.object.hue} 70% 55%)` }}/>
            {objectOverrides.length} object{objectOverrides.length > 1 ? "s" : ""} override
          </div>
          {objectOverrides.map(({ obj, value, filament, isSelected }) => (
            <div
              key={obj.id}
              className={`ladder-row obj-row ${isSelected ? "winner" : ""}`}
              style={{ "--row-hue": LAYER_BY_ID.object.hue }}
            >
              <span className="l-dot" style={{ background: filament?.color || "#888" }}/>
              <span className="l-name" title={obj.name}>{obj.name}</span>
              <span className="l-val">{formatVal(value, setting.unit)}</span>
            </div>
          ))}
        </>
      )}
    </div>,
    document.body
  );
}

function formatVal(v, unit) {
  if (typeof v === "boolean") return v ? "on" : "off";
  if (typeof v === "number") {
    const s = (Math.round(v * 1000) / 1000).toString();
    return unit ? `${s} ${unit}` : s;
  }
  return String(v);
}

// ───────── Setting Row ─────────
function SettingRow({
  readOnly = false,
  setting,
  outOfMode = false,      // tier is above the active mode — shown only because modified
  contextLayer,
  selectedObject,         // present when contextLayer === "object"
  objects,                // ALL objects on the plate, so we can show which override this setting
  filaments,              // for color swatches in the per-object section
  slotMap,                // slot → filamentId
  materialMap,            // materialId → slot
  accountabilityMode,
  userOverrides,          // project-level user edits only
  onSetProjectOverride,
  onResetProjectOverride,
  onSetObjectOverride,
  onResetObjectOverride,
}) {
  // Which objects on the plate override this specific setting? Used for the
  // "objects-override" badge + the per-object section in the hover ladder.
  const objectOverrides = useSPM(() => {
    if (!objects) return [];
    return objects
      .filter(o => o.overrides && o.overrides[setting.id] !== undefined && o.overrides[setting.id] !== null)
      .map(o => {
        const { filament } = window.SLICER_DATA.resolveObjectFilament(o, materialMap, slotMap, filaments);
        return {
          obj: o,
          value: o.overrides[setting.id],
          filament,
          isSelected: selectedObject && o.id === selectedObject.id,
        };
      });
  }, [objects, filaments, materialMap, slotMap, setting.id, selectedObject]);
  // Effective cascade:
  //   - Base: setting.cascade (printer..project, set by profile data)
  //   - + user project overrides
  //   - + selected object's overrides (only on Object tab)
  const layerOverrides = useSPM(() => {
    const out = { ...setting.cascade };
    const user = userOverrides[setting.id] || {};
    Object.entries(user).forEach(([k, v]) => {
      if (v === undefined || v === null) delete out[k]; else out[k] = v;
    });
    if (contextLayer === "object" && selectedObject) {
      const objVal = (selectedObject.overrides || {})[setting.id];
      if (objVal !== undefined && objVal !== null) {
        out.object = objVal;
      }
    }
    return out;
  }, [setting, userOverrides, contextLayer, selectedObject]);

  const { value, layer } = useSPM(() => {
    for (let i = CASCADE_LAYERS.length - 1; i >= 0; i--) {
      const id = CASCADE_LAYERS[i].id;
      if (layerOverrides[id] !== undefined && layerOverrides[id] !== null) {
        return { value: layerOverrides[id], layer: id };
      }
    }
    return { value: setting.default, layer: "printer" };
  }, [layerOverrides]);

  const layerMeta = LAYER_BY_ID[layer];
  const definedLayers = CASCADE_LAYERS.filter(l => layerOverrides[l.id] !== undefined);
  const isOverridden = definedLayers.length > 1;
  const hasProjectAuthored = layerOverrides.project !== undefined;
  const hasObjectAuthored  = layerOverrides.object  !== undefined;
  const conflict = isOverridden && definedLayers[definedLayers.length - 1].id === "object"
    && definedLayers.some(l => l.id === "project" && layerOverrides.project !== layerOverrides.object);

  // Writes go to the layer matching the current tab.
  const handleChange = (newVal) => {
    if (readOnly) return;
    if (contextLayer === "object" && selectedObject) {
      onSetObjectOverride(setting.id, newVal);
    } else {
      onSetProjectOverride(setting.id, newVal);
    }
  };
  const handleReset = () => {
    if (readOnly) return;
    if (contextLayer === "object" && selectedObject) {
      onResetObjectOverride(setting.id);
    } else {
      onResetProjectOverride(setting.id);
    }
  };

  // Reset is available whenever the ACTIVE editing layer has any value for this
  // setting — pre-seeded from profile data or added by the user.
  const hasValueAtContext = layerOverrides[contextLayer] !== undefined;

  // ─── Hover handling for the cascade ladder ───
  // Ladder is rendered via portal at body level so it isn't clipped by the
  // scroll container. We open on row hover, close on a short delay so the user
  // can move from the row to the ladder without losing it.
  const [ladderOpen, setLadderOpen] = useSPS(false);
  const [rowRect, setRowRect] = useSPS(null);
  const rowRef = useSPR(null);
  const closeT = useSPR(null);
  const openLadder = () => {
    if (closeT.current) { clearTimeout(closeT.current); closeT.current = null; }
    if (rowRef.current) setRowRect(rowRef.current.getBoundingClientRect());
    setLadderOpen(true);
  };
  const scheduleClose = () => {
    if (closeT.current) clearTimeout(closeT.current);
    closeT.current = setTimeout(() => setLadderOpen(false), 120);
  };
  useSPE(() => () => { if (closeT.current) clearTimeout(closeT.current); }, []);

  const renderControl = () => {
    if (setting.type === "toggle") {
      return (
        <div className="val-toggle-wrap">
          <div className={`val-toggle ${value ? "on" : ""} ${readOnly ? "disabled" : ""}`} onClick={() => handleChange(!value)}/>
        </div>
      );
    }
    if (setting.type === "select") {
      return (
        <select className="val-select" value={value} disabled={readOnly} onChange={(e) => handleChange(e.target.value)}>
          {(setting.options || []).map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      );
    }
    return (
      <div className="val-wrap">
        <input
          className="val-input"
          type="number"
          value={value}
          step={setting.step || 1}
          min={setting.min}
          max={setting.max}
          disabled={readOnly}
          onChange={(e) => handleChange(parseFloat(e.target.value))}
        />
        {setting.unit && <span className="val-unit">{setting.unit}</span>}
      </div>
    );
  };

  return (
    <div
      ref={rowRef}
      className={`set-row ${isOverridden ? "overridden" : ""} ${conflict ? "has-conflict" : ""} ${hasObjectAuthored ? "authored-object" : hasProjectAuthored ? "authored-project" : ""}`}
      style={{
        "--row-hue": layerMeta.hue,
        "--proj-hue": LAYER_BY_ID.project.hue,
        "--obj-hue":  LAYER_BY_ID.object.hue,
      }}
      data-setting-id={setting.id}
      onMouseEnter={openLadder}
      onMouseLeave={scheduleClose}
    >
      <div className="set-meta">
        <span className="set-name" title={setting.name}>{setting.name}</span>
        {outOfMode && (
          <span
            className={`tier-tag tier-${setting.level}`}
            title={`This is ${setting.level === "expert" ? "an Expert" : "an Advanced"} setting, shown because it's been changed`}
          >{setting.level === "expert" ? "EXP" : "ADV"}</span>
        )}
        {accountabilityMode === "breadcrumb" && (
          <span className="set-breadcrumb">
            {definedLayers.map((l, i) => (
              <React.Fragment key={l.id}>
                <span
                  className={`crumb ${l.id === layer ? "" : "muted"}`}
                  style={{ "--crumb-hue": l.hue }}
                >{l.short}</span>
                {i < definedLayers.length - 1 && <span className="arrow">›</span>}
              </React.Fragment>
            ))}
          </span>
        )}
        {objectOverrides.length > 0 && contextLayer !== "object" && (
          <span
            className="objs-badge"
            style={{ "--obj-hue": LAYER_BY_ID.object.hue }}
            title={`${objectOverrides.length} object${objectOverrides.length > 1 ? "s" : ""} override this — hover row for details`}
          >
            <svg width="9" height="9" viewBox="0 0 12 12" fill="none" aria-hidden>
              <path d="M2.5 3v3a2 2 0 0 0 2 2H10M10 8L7.5 5.5M10 8L7.5 10.5"
                stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            <span className="objs-badge-dots">
              {objectOverrides.slice(0, 3).map((o, i) => (
                <span key={o.obj.id} className="objs-badge-dot" style={{ background: o.filament?.color || "#888" }}/>
              ))}
              {objectOverrides.length > 3 && <span className="objs-badge-more">+{objectOverrides.length - 3}</span>}
            </span>
          </span>
        )}
      </div>

      {hasValueAtContext && !readOnly && (
        <button
          className="reset-btn show"
          title={`Reset ${LAYER_BY_ID[contextLayer].label} override (falls back to inherited value)`}
          onClick={(e) => { e.stopPropagation(); handleReset(); }}
        >
          <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 5a3.5 3.5 0 1 0 1-2.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
            <path d="M2 2v3h3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
      )}

      <div className="set-value">{renderControl()}</div>

      {ladderOpen && (
        <CascadeLadder
          setting={setting}
          layerOverrides={layerOverrides}
          winner={layer}
          contextLayer={contextLayer}
          objectOverrides={objectOverrides}
          onPromote={() => handleChange(value)}
          onReset={handleReset}
          rowRect={rowRect}
          onLadderEnter={openLadder}
          onLadderLeave={scheduleClose}
        />
      )}
    </div>
  );
}

// ───────── Slot / Material chips ─────────
// Two small dropdown chips used in the config strip.
//
// SlotChip — represents a physical slot in the printer (ext or AMS:1..4) and
// lets the user re-bind it to any filament in the library.
//
// MaterialChip — represents a logical project material (M1, M2…) and lets the
// user choose which slot it should be printed from.
function SlotChip({ slotId, slotIds, filament, onOpenPicker }) {
