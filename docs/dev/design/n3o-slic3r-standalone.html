<style data-source="styles.css">
/* Lattice slicer — design tokens & global styles */

:root {
  --bg:           #FBFBFC;
  --surface:      #FFFFFF;
  --surface-2:    #F5F6F8;
  --surface-3:    #EEF0F3;
  --border:       rgba(15, 17, 21, 0.08);
  --border-strong:rgba(15, 17, 21, 0.14);
  --hairline:     rgba(15, 17, 21, 0.05);
  --text:         #0F1115;
  --text-muted:   #5A6270;
  --text-dim:     #9AA0AA;
  --accent:       oklch(0.62 0.19 235);
  --accent-soft:  oklch(0.96 0.04 235);
  --accent-text:  oklch(0.42 0.18 235);
  --warn:         oklch(0.68 0.16 60);
  --warn-soft:    oklch(0.97 0.05 70);
  --danger:       oklch(0.62 0.21 25);
  --danger-soft:  oklch(0.97 0.04 25);
  --ok:           oklch(0.62 0.14 155);
  --shadow-sm:    0 1px 0 rgba(15,17,21,0.04), 0 1px 2px rgba(15,17,21,0.04);
  --shadow-md:    0 1px 0 rgba(15,17,21,0.04), 0 4px 12px rgba(15,17,21,0.06);
  --shadow-lg:    0 12px 32px rgba(15,17,21,0.10), 0 1px 0 rgba(15,17,21,0.04);
  --radius-sm:    4px;
  --radius:       6px;
  --radius-lg:    10px;
  --radius-xl:    14px;
  --font-sans:    "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-mono:    "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

[data-theme="dark"] {
  --bg:           #0E1014;
  --surface:      #15181D;
  --surface-2:    #1B1F25;
  --surface-3:    #232830;
  --border:       rgba(255, 255, 255, 0.08);
  --border-strong:rgba(255, 255, 255, 0.16);
  --hairline:     rgba(255, 255, 255, 0.05);
  --text:         #E6E9EE;
  --text-muted:   #9AA1AE;
  --text-dim:     #5C6471;
  --accent:       oklch(0.72 0.17 235);
  --accent-soft:  oklch(0.30 0.10 235);
  --accent-text:  oklch(0.82 0.12 235);
  --warn-soft:    oklch(0.30 0.10 60);
  --danger-soft:  oklch(0.30 0.10 25);
}

/* Accent themes */
[data-accent="ember"]  { --accent: oklch(0.65 0.19 35);  --accent-soft: oklch(0.96 0.04 35);  --accent-text: oklch(0.46 0.18 35); }
[data-accent="violet"] { --accent: oklch(0.60 0.21 295); --accent-soft: oklch(0.96 0.04 295); --accent-text: oklch(0.42 0.20 295); }
[data-accent="mint"]   { --accent: oklch(0.62 0.15 165); --accent-soft: oklch(0.96 0.04 165); --accent-text: oklch(0.42 0.15 165); }

* { box-sizing: border-box; }
html, body, #app { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button { font-family: inherit; }
input, select, textarea { font-family: inherit; }

::selection { background: var(--accent-soft); color: var(--accent-text); }

/* ───────── Layout ───────── */
.app {
  display: grid;
  grid-template-rows: 48px 38px 1fr 24px;
  height: 100vh;
}
.workspace {
  display: grid;
  grid-template-columns: 280px 1fr var(--sp-w, 420px);
  min-height: 0;
  overflow: hidden;
}
@media (max-width: 1400px) {
  .workspace { grid-template-columns: 260px 1fr var(--sp-w, 380px); }
}
/* Settings-panel width is driven by a root var so the collapsible category
   rail can narrow the whole panel. Defaults track the breakpoints. */
:root { --sp-w: 420px; }
:root.sp-collapsed { --sp-w: 322px; }
@media (max-width: 1400px) {
  :root { --sp-w: 380px; }
  :root.sp-collapsed { --sp-w: 290px; }
}

/* ───────── Plate Tabs ───────── */
.plate-tabs {
  display: flex; align-items: stretch;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  padding: 0 8px;
  gap: 0;
  overflow: hidden;
}
.plate-tabs-scroll {
  display: flex; align-items: stretch;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  gap: 1px;
  scrollbar-width: none;
  /* Edge fades live as masks so they don't capture pointer events. The
     `fade-left` / `fade-right` modifier classes light up the corresponding
     mask gradient when there's content scrolled offscreen on that side. */
  -webkit-mask-image: linear-gradient(to right, black, black);
  mask-image: linear-gradient(to right, black, black);
  transition: mask-image 0.15s ease;
}
.plate-tabs-scroll.fade-left.fade-right {
  -webkit-mask-image: linear-gradient(to right, transparent 0, black 18px, black calc(100% - 18px), transparent 100%);
  mask-image:         linear-gradient(to right, transparent 0, black 18px, black calc(100% - 18px), transparent 100%);
}
.plate-tabs-scroll.fade-left:not(.fade-right) {
  -webkit-mask-image: linear-gradient(to right, transparent 0, black 18px, black 100%);
  mask-image:         linear-gradient(to right, transparent 0, black 18px, black 100%);
}
.plate-tabs-scroll.fade-right:not(.fade-left) {
  -webkit-mask-image: linear-gradient(to right, black 0, black calc(100% - 18px), transparent 100%);
  mask-image:         linear-gradient(to right, black 0, black calc(100% - 18px), transparent 100%);
}
.plate-tabs-scroll::-webkit-scrollbar { display: none; }

/* Devices tab: right-aligned via margin-left:auto. Visually styled like a
   plate tab but with a subtle separation (left hairline) so it reads as a
   distinct destination, not just one more plate. */
.plate-tab-devices {
  margin-left: auto;
  border-left: 1px solid var(--hairline);
  position: relative;
}
.plate-tab-devices .plate-tab-icon { color: var(--text-muted); }
.plate-tab-devices.active .plate-tab-icon { color: var(--accent-text); }
.plate-tab-devices .plate-tab-meta {
  background: var(--surface-2);
  border-radius: 999px;
  padding: 1px 7px;
}
.plate-tab.active.plate-tab-devices .plate-tab-meta {
  background: var(--surface);
}

.plate-tab-badge {
  display: inline-flex;
  align-items: center; justify-content: center;
  min-width: 16px; height: 16px;
  padding: 0 5px;
  border-radius: 8px;
  font-size: 10.5px;
  font-weight: 600;
  font-family: var(--font-mono);
  line-height: 1;
  background: oklch(0.62 0.16 145);
  color: white;
}
.plate-tab-badge.printing {
  animation: tb-pulse 2s ease-in-out infinite;
}
.plate-tab-badge.error { background: var(--danger); }

.plate-tab {
  position: relative;
  display: inline-flex; align-items: center;
  gap: 8px;
  padding: 0 8px 0 10px;
  height: 100%;
  min-width: 0;
  background: transparent;
  border: 0;
  border-right: 1px solid var(--hairline);
  color: var(--text-muted);
  font-size: 12px;
  cursor: default;
  flex-shrink: 0;
}
.plate-tab:first-child { border-left: 1px solid var(--hairline); }
.plate-tab:hover {
  background: var(--surface);
  color: var(--text);
}
.plate-tab.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 0 var(--surface);
  z-index: 1;
}
.plate-tab.active::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--accent);
}
.plate-tab-icon {
  display: inline-flex;
  color: var(--text-dim);
  flex-shrink: 0;
}
.plate-tab.active .plate-tab-icon { color: var(--accent-text); }
.plate-tab-name {
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  user-select: none;
}
.plate-tab-rename-input {
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 3px;
  font: inherit;
  color: var(--text);
  padding: 1px 4px;
  width: 130px;
  outline: 0;
}
.plate-tab-divider {
  width: 1px; height: 16px;
  background: var(--hairline);
  flex-shrink: 0;
}
.plate-tab-printer-display {
  display: inline-flex; align-items: center;
  padding: 3px 6px;
  color: var(--text-muted);
  font-size: 11.5px;
  font-family: var(--font-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
  flex-shrink: 0;
}
.plate-tab.active .plate-tab-printer-display { color: var(--text); }
.plate-tab-meta {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.plate-tab-close {
  width: 18px; height: 18px;
  border: 0; background: transparent;
  border-radius: 3px;
  color: var(--text-dim);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: default;
  opacity: 0;
  transition: opacity 100ms;
  flex-shrink: 0;
}
.plate-tab:hover .plate-tab-close,
.plate-tab.active .plate-tab-close { opacity: 1; }
.plate-tab-close:hover { background: var(--surface-3); color: var(--text); }

.plate-tab-add {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px;
  height: 100%;
  background: transparent;
  border: 0;
  border-right: 1px solid var(--hairline);
  color: var(--text-dim);
  font-size: 12.5px;
  cursor: default;
  flex-shrink: 0;
}
.plate-tab-add:hover {
  background: var(--surface);
  color: var(--text);
}

/* Printer assign menu (popover) */
.plate-tab-printer-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  padding: 4px;
  z-index: 50;
  min-width: 260px;
  display: flex; flex-direction: column;
  gap: 1px;
}
.ptpm-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 6px 8px 4px;
}
.ptpm-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 8px;
  background: transparent;
  border: 0;
  border-radius: 5px;
  color: var(--text);
  cursor: default;
  text-align: left;
  gap: 8px;
}
.ptpm-item:hover { background: var(--surface-2); }
.ptpm-item.active {
  background: var(--accent-soft);
  color: var(--accent-text);
}
.ptpm-name { font-size: 12.5px; font-weight: 500; }
.ptpm-detail {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
}
.ptpm-item.active .ptpm-detail { color: var(--accent-text); opacity: 0.85; }

/* ───────── Top Bar ───────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-right: 6px;
  font-size: 14px;
}
.brand-mark {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--text);
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.brand-mark::after {
  content: ""; position: absolute;
  inset: 4px;
  background:
    repeating-linear-gradient(45deg, transparent 0 2px, var(--bg) 2px 3px);
  border-radius: 2px;
}
.brand-divider { width: 1px; height: 22px; background: var(--border); margin: 0 6px; }

/* Brand wordmark is an app-menu trigger */
.brand-btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 8px 0 6px;
  background: transparent; border: 1px solid transparent; border-radius: 7px;
  font: inherit; color: var(--text);
  font-weight: 600; letter-spacing: -0.01em; font-size: 14px;
  margin-right: 6px; cursor: default;
  transition: background 100ms, border-color 100ms;
}
.brand-btn:hover { background: var(--surface-2); }
.brand-btn.open { background: var(--surface-2); border-color: var(--border); }
.brand-btn .brand-caret { opacity: 0.5; margin-left: -1px; }
.brand-menu-wrap { position: relative; display: inline-flex; }
.brand-menu {
  position: absolute; top: calc(100% + 6px); left: 0;
  min-width: 220px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  padding: 5px;
  z-index: 200;
  animation: apmPopIn 140ms cubic-bezier(0.2, 0.9, 0.3, 1);
}
.brand-menu-app {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 9px 9px;
  border-bottom: 1px solid var(--hairline);
  margin-bottom: 4px;
}
.brand-menu-app .brand-mark { width: 20px; height: 20px; }
.brand-menu-app-name { font-size: 12.5px; font-weight: 600; color: var(--text); }
.brand-menu-app-ver { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-left: auto; }

/* count tag on "Plugins…" menu items */
.tb-menu-item .tb-menu-count {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  color: var(--accent-text);
  background: var(--accent-soft);
  border-radius: 8px;
  padding: 1px 7px;
}

.layer-chips {
  display: flex; gap: 4px; align-items: center;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
}
.layer-chips.profile-chips {
  background: transparent;
  border: 0;
  padding: 0;
  gap: 2px;
}
.profile-chip {
  cursor: default;
}
.profile-chip:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border);
}
.profile-chevron {
  color: var(--text-dim);
  font-size: 13px;
  margin: 0 1px;
  user-select: none;
}
.layer-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px 4px 8px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: default;
  white-space: nowrap;
}
.layer-chip:hover { background: var(--surface); color: var(--text); }
.layer-chip.active {
  background: var(--surface);
  border-color: var(--border);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.layer-chip-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: hsl(var(--layer-hue) 70% 55%);
  box-shadow: 0 0 0 2px hsl(var(--layer-hue) 85% 90% / 0.7);
}
[data-theme="dark"] .layer-chip-dot {
  box-shadow: 0 0 0 2px hsl(var(--layer-hue) 40% 25% / 0.7);
}
.layer-chip-name { font-weight: 500; }
.layer-chip-detail { color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; }

.tb-spacer { flex: 1; }
.tb-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--text);
  cursor: default;
}
.tb-btn:hover { background: var(--surface-2); }
.tb-btn.primary {
  background: var(--text); color: var(--bg);
  border-color: var(--text);
  font-weight: 500;
  padding: 0 14px 0 12px;
}
.tb-btn.primary:hover { background: oklch(from var(--text) calc(l + 0.08) c h); }
.tb-btn .kbd {
  font-family: var(--font-mono);
  font-size: 10.5px;
  opacity: 0.6;
  margin-left: 4px;
}

/* ───────── Objects Panel ───────── */
.objects-panel {
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex; flex-direction: column;
  min-height: 0;
}
.panel-head {
  padding: 12px 14px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.panel-head h3 {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.icon-btn {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 4px;
  color: var(--text-muted);
  cursor: default;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }

.object-list { padding: 4px 6px; flex: 1; overflow-y: auto; min-height: 0; }
.object-item {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 6px;
  cursor: default;
  position: relative;
}
.object-item:hover { background: var(--surface-2); }
.object-item.selected {
  background: var(--accent-soft);
  outline: 1px solid color-mix(in oklch, var(--accent) 25%, transparent);
}
.object-thumb {
  width: 28px; height: 28px;
  border-radius: 5px;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
}
.object-name {
  font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.object-meta {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.object-color-tag {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
  vertical-align: middle;
}
.object-overrides {
  background: oklch(from var(--accent) 0.95 0.04 h);
  color: var(--accent-text);
  font-family: var(--font-mono);
  font-size: 9.5px;
  padding: 1px 5px;
  border-radius: 8px;
  border: 1px solid color-mix(in oklch, var(--accent) 20%, transparent);
}
[data-theme="dark"] .object-overrides {
  background: oklch(from var(--accent) 0.30 0.10 h);
}

/* ── Multi-select & grouping ───────────────────────────────────────────── */

/* Row included in the (grouping) multi-selection — distinct from the primary
   single-selection so both can be visible at once. */
.object-item.multi {
  background: color-mix(in oklch, var(--accent) 9%, transparent);
  box-shadow: inset 2px 0 0 var(--accent);
}
.object-item.multi.selected {
  background: var(--accent-soft);
}

/* Contextual action bar above the list when 2+ objects are picked. */
.object-selbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  margin: 2px 8px 0;
  padding: 6px 8px;
  background: var(--accent-soft);
  border: 1px solid color-mix(in oklch, var(--accent) 22%, transparent);
  border-radius: 7px;
}
.object-selbar-count {
  font-size: 11px; font-weight: 600;
  color: var(--accent-text);
}
.object-selbar-actions { display: flex; gap: 6px; }
.object-selbar-btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px;
  font-size: 11px; font-weight: 500;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}
.object-selbar-btn:hover { background: var(--surface-2); }
.object-selbar-btn.primary {
  background: var(--accent); color: #fff; border-color: transparent;
}
.object-selbar-btn.primary:hover { filter: brightness(1.05); }
.object-selbar-btn.primary:disabled {
  opacity: 0.45; cursor: not-allowed; filter: none;
}

/* Group container — a labelled, collapsible cluster of object rows. */
.object-group {
  margin: 3px 2px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: color-mix(in oklch, var(--surface-2) 55%, transparent);
  overflow: hidden;
}
.object-group.selected {
  border-color: color-mix(in oklch, var(--accent) 40%, transparent);
  box-shadow: 0 0 0 1px color-mix(in oklch, var(--accent) 25%, transparent);
}
.object-group-head {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 8px;
  cursor: pointer;
  user-select: none;
}
.object-group-head:hover { background: var(--surface-2); }
.object-group-caret {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px;
  border: 0; background: transparent; padding: 0;
  color: var(--text-muted); cursor: pointer;
  border-radius: 3px;
  transition: transform 0.12s ease;
  transform: rotate(90deg);
}
.object-group-caret.collapsed { transform: rotate(0deg); }
.object-group-caret:hover { background: var(--surface); color: var(--text); }
.object-group-icon { color: var(--accent); flex-shrink: 0; }
.object-group-name {
  font-size: 12px; font-weight: 600;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0;
  border-radius: 3px;
}
.objects-panel:not(.readonly) .object-group-name:hover {
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--surface);
}
.object-group-name-input {
  flex: 1; min-width: 0;
  font-size: 12px; font-weight: 600;
  font-family: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 1px 5px;
  outline: none;
}
.object-group-count {
  flex-shrink: 0;
  min-width: 16px; height: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 4px;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 8px;
}
.object-group-swatches { display: inline-flex; flex-shrink: 0; }
.object-group-swatch {
  width: 9px; height: 9px;
  border-radius: 50%;
  border: 1.5px solid var(--surface);
  margin-left: -3px;
}
.object-group-swatch:first-child { margin-left: 0; }
.object-group-ungroup {
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.12s ease;
}
.object-group-head:hover .object-group-ungroup { opacity: 1; }

/* Members nest under the header with a vertical guide line tying them
   together. */
.object-group-members {
  position: relative;
  padding: 2px 4px 5px 14px;
}
.object-group-members::before {
  content: "";
  position: absolute;
  left: 13px; top: 0; bottom: 7px;
  width: 1.5px;
  background: color-mix(in oklch, var(--accent) 30%, var(--border));
  border-radius: 1px;
}
.object-group-members .object-item.in-group {
  position: relative;
}
.object-group-members .object-item.in-group::before {
  content: "";
  position: absolute;
  left: -7px; top: 50%;
  width: 7px; height: 1.5px;
  background: color-mix(in oklch, var(--accent) 30%, var(--border));
}

.add-menu {
  border-top: 1px solid var(--hairline);
  padding: 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.add-menu-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 8px;
  border-radius: 5px;
  cursor: default;
  font-size: 12.5px;
  color: var(--text);
  background: transparent;
  border: 0;
  text-align: left;
}
.add-menu-item:hover { background: var(--surface-2); }
.add-menu-item .meta { color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; }
.add-section-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-dim);
  padding: 8px 8px 4px;
}

/* Plate stats footer */
.plate-stats {
  border-top: 1px solid var(--hairline);
  padding: 10px 14px 12px;
  display: grid; gap: 6px;
}
.plate-stat-row {
  display: flex; justify-content: space-between; font-size: 11.5px;
}
.plate-stat-row .k { color: var(--text-dim); }
.plate-stat-row .v { font-family: var(--font-mono); color: var(--text); }

/* ───────── Viewport ───────── */
.viewport {
  position: relative;
  background:
    radial-gradient(circle at 50% 35%, oklch(0.99 0.005 235) 0%, var(--bg) 60%);
  overflow: hidden;
}
[data-theme="dark"] .viewport {
  background:
    radial-gradient(circle at 50% 35%, oklch(0.20 0.02 235) 0%, var(--bg) 60%);
}
.viewport canvas { display: block; }

.viewport-toolbar {
  position: absolute;
  top: 12px; left: 12px;
  display: flex; gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 3px;
  box-shadow: var(--shadow-sm);
}
.vp-tool {
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: transparent;
  border-radius: 4px;
  color: var(--text-muted);
  cursor: default;
}
.vp-tool:hover { background: var(--surface-2); color: var(--text); }
.vp-tool.active { background: var(--accent-soft); color: var(--accent-text); }
.vp-tool svg { width: 14px; height: 14px; }
.vp-sep { width: 1px; background: var(--border); margin: 4px 2px; }

.viewport-axes {
  display: flex; gap: 8px;
}
.axis { display: flex; align-items: center; gap: 4px; }
.axis-x { color: oklch(0.62 0.21 25); }
.axis-y { color: oklch(0.62 0.18 145); }
.axis-z { color: oklch(0.62 0.18 235); }

.gizmo-hint {
  position: absolute;
  bottom: 12px; left: 12px;
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
  padding: 4px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: var(--shadow-sm);
}
.gizmo-hint .axes { display: inline-flex; gap: 8px; }
.gizmo-hint .axis { font-weight: 600; }
.gizmo-hint-sep { opacity: 0.45; }

/* ───────── Slicing progress — non-blocking corner window ───────── */
.slicing-window {
  position: absolute;
  left: 12px; bottom: 50px;
  z-index: 12;
  width: 248px;
  padding: 11px 13px 12px;
  background: color-mix(in oklch, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(10px) saturate(1.3);
  backdrop-filter: blur(10px) saturate(1.3);
  border: 1px solid var(--border-strong);
  border-radius: 9px;
  box-shadow: var(--shadow-lg);
  animation: slicing-window-in 0.22s cubic-bezier(0.2, 0.7, 0.2, 1);
  pointer-events: none; /* never traps canvas interaction */
}
@keyframes slicing-window-in {
  from { opacity: 0; transform: translateY(6px) scale(0.98); }
  to   { opacity: 1; transform: none; }
}
.slicing-window-head {
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 9px;
}
.slicing-window-spinner {
  width: 11px; height: 11px; flex-shrink: 0;
  border: 1.6px solid color-mix(in oklch, var(--accent) 28%, transparent);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: slicing-window-spin 0.7s linear infinite;
}
@keyframes slicing-window-spin { to { transform: rotate(360deg); } }
.slicing-window-title {
  font-size: 12px; font-weight: 600; letter-spacing: -0.005em;
  color: var(--text);
}
.slicing-window-count {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
}
.slicing-window-pct {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11.5px; font-weight: 600;
  color: var(--accent-text);
  font-variant-numeric: tabular-nums;
}
.slicing-window-track {
  height: 4px;
  background: var(--surface-3);
  border-radius: 3px;
  overflow: hidden;
}
.slicing-window-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.12s linear;
}
.slicing-window-stages {
  display: flex; flex-wrap: wrap; gap: 4px 6px;
  margin-top: 9px;
}
.slicing-window-stage {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--text-dim);
  opacity: 0.5;
  transition: color 0.2s, opacity 0.2s;
}
.slicing-window-stage.done { color: var(--text-muted); opacity: 0.85; }
.slicing-window-stage.active {
  color: var(--accent-text);
  opacity: 1;
  font-weight: 600;
}

/* ───────── Console toggle + pane ───────── */
.console-toggle {
  position: absolute;
  bottom: 12px; right: 12px;
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px 0 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: var(--shadow-sm);
  cursor: default;
  z-index: 11;
}
.console-toggle:hover { background: var(--surface-2); color: var(--text); }
.console-toggle.open {
  background: var(--surface-3);
  color: var(--text);
  border-color: var(--border-strong);
}
.console-toggle svg { width: 13px; height: 13px; flex-shrink: 0; }
.console-toggle-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 14px; padding: 0 4px;
  margin-left: 2px;
  border-radius: 7px;
  font-size: 9.5px; font-weight: 600;
  color: #fff;
  line-height: 1;
}
.console-toggle-badge.error { background: var(--danger); }
.console-toggle-badge.warn  { background: var(--warn); color: #2a1f00; }

.console-pane {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 33vh;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-top: 1px solid var(--border-strong);
  box-shadow: 0 -8px 24px rgba(15,17,21,0.08);
  z-index: 10;
}
.console-pane-head {
  display: flex; align-items: center; gap: 10px;
  height: 28px; padding: 0 8px 0 12px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
}
.console-pane-title {
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}
.console-pane-count { color: var(--text-dim); }
.console-pane-btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 20px; padding: 0 8px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  cursor: default;
}
.console-pane-btn:hover {
  background: var(--surface);
  border-color: var(--border);
  color: var(--text);
}
.console-pane-body {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0 6px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.5;
  background: var(--surface);
}
.console-empty {
  padding: 12px;
  color: var(--text-dim);
  text-align: center;
}
.console-line {
  display: grid;
  grid-template-columns: 70px 54px 1fr;
  gap: 10px;
  padding: 2px 12px;
  color: var(--text);
}
.console-line:hover { background: var(--surface-2); }
.console-line-time { color: var(--text-dim); }
.console-line-level {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  align-self: center;
}
.console-line-msg { white-space: pre-wrap; word-break: break-word; }
.console-line-info  .console-line-level { color: var(--text-dim); }
.console-line-warn  .console-line-level { color: var(--warn); }
.console-line-warn  .console-line-msg   { color: var(--warn); }
.console-line-error .console-line-level { color: var(--danger); }
.console-line-error .console-line-msg   { color: var(--danger); }

/* Drag-target highlight when dragging from object library */
.viewport.drop-target::before {
  content: "Drop to add to plate";
  position: absolute;
  inset: 16px;
  border: 2px dashed color-mix(in oklch, var(--accent) 70%, transparent);
  border-radius: 12px;
  background: color-mix(in oklch, var(--accent) 8%, transparent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 500;
  color: var(--accent-text);
  z-index: 5;
  pointer-events: none;
}

/* ───────── Settings Panel ───────── */
.settings-panel {
  border-left: 1px solid var(--border);
  background: var(--surface);
  display: grid;
  grid-template-rows: auto auto auto auto 1fr;
  min-height: 0;
  min-width: 0;
}

/* Read-only mode (shown in Preview). Keep navigation — category rail, tabs,
   search, scrolling — but lock every value-mutating control. The banner is an
   extra leading grid row, so prepend an auto track to keep the layout aligned. */
.settings-panel.readonly {
  grid-template-rows: auto auto auto auto auto 1fr;
}
.sp-readonly-banner {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--hairline);
  color: var(--text-muted);
  font-size: 11.5px;
}
.sp-readonly-banner svg { flex-shrink: 0; color: var(--text-dim); }
.sp-readonly-banner b { color: var(--text); font-weight: 600; }
/* The config strip and per-setting controls are non-interactive; navigation
   (tabs, search, category rail, scroll) stays live. */
.settings-panel.readonly .sp-config { pointer-events: none; }
.settings-panel.readonly .sp-config,
.settings-panel.readonly .set-value,
.settings-panel.readonly .config-chip,
.settings-panel.readonly .slot-pill,
.settings-panel.readonly .material-chip { opacity: 0.72; }
.settings-panel.readonly .set-value { pointer-events: none; }
.settings-panel.readonly .val-toggle.disabled,
.settings-panel.readonly .val-select:disabled,
.settings-panel.readonly .val-input:disabled {
  cursor: default;
  opacity: 1;
}
.settings-panel.readonly .val-select:disabled,
.settings-panel.readonly .val-input:disabled {
  color: var(--text-muted);
  -webkit-text-fill-color: var(--text-muted);
  background: var(--surface-2);
}

.sp-config {
  display: flex; flex-direction: column;
  gap: 6px;
  padding: 10px 12px 8px;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
}
.sp-config-row {
  display: flex; flex-wrap: wrap;
  gap: 4px;
  align-items: center;
}
.sp-config-filaments {
  padding-top: 4px;
  border-top: 1px dashed var(--hairline);
  margin-top: 2px;
}
.config-row-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-right: 4px;
  align-self: center;
}
.config-chip {
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  padding: 6px 8px 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-size: 12px;
  cursor: default;
  flex: 1 1 0;
  min-width: 0;
  text-align: left;
}
.config-chip-wrap {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  display: flex;
}
.config-chip-wrap > .config-chip { width: 100%; flex: 1 1 0; }

/* Multi-toolhead nozzle row: when a printer has 3+ extruders the nozzle
   chips drop out of the top row and lay out as a labeled 4-column grid
   below. Up to 2 nozzles stay inline with Printer/Bed. */
.sp-config-nozzles {
  padding-top: 6px;
  border-top: 1px dashed var(--hairline);
  margin-top: 2px;
  flex-direction: column;
  align-items: stretch;
  gap: 5px;
}
.sp-config-nozzles .config-row-label {
  display: block;
  margin-right: 0;
}
.nozzle-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4px;
  width: 100%;
}
.nozzle-grid .config-chip {
  flex: none;
  width: 100%;
}

.printer-picker-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  padding: 4px;
  z-index: 60;
  min-width: 280px;
  display: flex; flex-direction: column;
  gap: 1px;
}
.config-chip:hover {
  background: var(--surface-2);
  border-color: var(--border-strong);
}
.config-chip-top {
  display: flex; align-items: center; gap: 5px;
  width: 100%;
}
.config-chip-top .chev {
  margin-left: auto;
}
.config-chip .chip-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: hsl(var(--chip-hue) 70% 55%);
  flex-shrink: 0;
}
.config-chip .chip-label {
  font-size: 9.5px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  flex-shrink: 0;
}

/* Connection indicator — right-aligned dot on the printer-name row */
.chip-value-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
}
.conn-indicator {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-left: auto;
  background: #9AA0AA;
  box-shadow: 0 0 0 2px color-mix(in srgb, #9AA0AA 20%, transparent);
}
.conn-indicator.conn-connecting {
  background: var(--warn);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--warn) 24%, transparent);
  animation: connPulse 1s ease-in-out infinite;
}
.conn-indicator.conn-connected {
  background: oklch(0.62 0.15 150);
  box-shadow: 0 0 0 2px oklch(0.62 0.15 150 / 0.22);
}
.conn-indicator.conn-failed {
  background: var(--danger);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--danger) 24%, transparent);
}
@keyframes connPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.config-chip .chip-value {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
  display: block;
}

.filament-chip {
  display: inline-flex; align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 6px 0 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 11.5px;
  cursor: default;
}
.filament-chip:hover {
  background: var(--surface-2);
  border-color: var(--border-strong);
}
.fil-swatch {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.15);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4);
  flex-shrink: 0;
}
[data-theme="dark"] .fil-swatch {
  border-color: rgba(255,255,255,0.2);
}
.fil-label {
  font-size: 11.5px;
  color: var(--text);
  white-space: nowrap;
}
.fil-count {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
}

/* Filaments block — slot loadout above, per-material routing below.
   Both rows live under one labeled header that reads top-to-bottom:
   "what's loaded" → "where each material goes". */
.sp-config-slots {
  padding-top: 6px;
  border-top: 1px dashed var(--hairline);
  margin-top: 2px;
  gap: 5px;
  flex-wrap: wrap;
  row-gap: 5px;
}
.sp-config-slots .config-row-label { flex-shrink: 0; }

.slot-chip-wrap { position: relative; display: inline-flex; }
.slot-pill {
  display: inline-flex; align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 6px 0 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  color: var(--text);
  font-size: 11px;
  cursor: default;
  flex-shrink: 0;
}
.slot-pill:hover { background: var(--surface-2); border-color: var(--border-strong); }
.slot-pill.empty .slot-pill-swatch {
  background: transparent !important;
  border: 1px dashed var(--text-dim);
  box-shadow: none;
}
.slot-pill-swatch {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.15);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35);
  flex-shrink: 0;
}
[data-theme="dark"] .slot-pill-swatch {
  border-color: rgba(255,255,255,0.18);
}
.slot-pill-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.02em;
}
.slot-pill-material {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--surface-2);
  color: var(--text);
}
.slot-pill.empty .slot-pill-material {
  color: var(--text-dim);
  background: transparent;
}
[data-theme="dark"] .slot-pill-material {
  background: var(--surface-3);
}

/* Slots row label doubles as the sync-from-printer button — same visual rhythm
   as the other row labels, but with a small refresh glyph on the left, a hover
   affordance, and three states that animate in place:
     idle    → "Slots" with static refresh glyph
     syncing → "Syncing…" with glyph spinning
     synced  → "Synced" with check glyph (accent-tinted, auto-reverts) */
.slots-sync-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  /* match the .config-row-label typography exactly */
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 2px 6px 2px 5px;
  margin: 0 -6px 0 -5px; /* keep the visual baseline aligned with other row labels */
  cursor: pointer;
  flex-shrink: 0;
  transition: color 120ms ease, background 120ms ease, border-color 120ms ease;
}
.slots-sync-label:hover {
  color: var(--text);
  background: var(--surface-2);
  border-color: var(--hairline);
}
.slots-sync-label:active { transform: translateY(0.5px); }
.slots-sync-label:focus-visible {
  outline: none;
  border-color: var(--accent, currentColor);
}
.slots-sync-ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 11px; height: 11px;
  color: var(--text-dim);
  opacity: 0.85;
  transition: color 120ms ease, opacity 120ms ease;
}
.slots-sync-label:hover .slots-sync-ico { color: var(--text); opacity: 1; }

.slots-sync-label.state-syncing,
.slots-sync-label.state-synced {
  cursor: default;
  color: var(--text-dim);
  background: transparent;
  border-color: transparent;
}
.slots-sync-label.state-syncing .slots-sync-ico,
.slots-sync-label.state-synced .slots-sync-ico {
  opacity: 1;
}
.slots-sync-label.state-syncing .slots-sync-ico {
  color: var(--text);
  animation: slots-sync-spin 0.9s linear infinite;
}
.slots-sync-label.state-synced .slots-sync-ico {
  color: var(--accent-text, var(--text));
}
@keyframes slots-sync-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.slots-sync-label:disabled { pointer-events: none; }

/* Materials column — full-width rows. Each row is a clickable chip showing
   the full material → slot → filament chain. */
.sp-config-materials {
  margin-top: 6px;
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
}
.sp-config-materials .config-row-label { margin-bottom: 2px; }
.material-chip {
  display: grid;
  grid-template-columns: auto auto auto 14px 1fr auto 12px;
  align-items: center;
  gap: 7px;
  width: 100%;
  height: 30px;
  padding: 0 8px 0 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-size: 11.5px;
  cursor: default;
  text-align: left;
}
.material-chip:hover { background: var(--surface-2); border-color: var(--border-strong); }
.material-id {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 10.5px;
  letter-spacing: 0.02em;
  padding: 2px 6px;
  border-radius: 4px;
  background: hsl(var(--accent-hue, 175) 30% 92%);
  color: hsl(var(--accent-hue, 175) 40% 30%);
}
[data-theme="dark"] .material-id {
  background: hsl(var(--accent-hue, 175) 30% 22%);
  color: hsl(var(--accent-hue, 175) 50% 80%);
}
.material-arrow {
  color: var(--text-dim);
  font-size: 11px;
  font-family: var(--font-mono);
}
.material-slot {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}
.material-chip .fil-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.material-chip .fil-count {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  background: var(--surface-2);
  padding: 1px 5px;
  border-radius: 8px;
}

/* Filament swatch inside the slot-picker / material-picker dropdown */
.ptpm-swatch {
  display: inline-block;
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.15);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4);
  margin-right: 8px;
  vertical-align: -2px;
}
[data-theme="dark"] .ptpm-swatch {
  border-color: rgba(255,255,255,0.2);
}
.ptpm-item.ptpm-row.active {
  background: var(--surface-2);
}

/* Material badge shown in the ObjectsPanel meta line */
.object-material-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 1px 4px;
  border-radius: 3px;
  background: hsl(var(--accent-hue, 175) 30% 92%);
  color: hsl(var(--accent-hue, 175) 40% 30%);
  margin-right: 4px;
}
[data-theme="dark"] .object-material-badge {
  background: hsl(var(--accent-hue, 175) 30% 22%);
  color: hsl(var(--accent-hue, 175) 50% 80%);
}

/* Interactive variant of the badge — opens the material picker. */
.object-material-badge-btn {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  border: none;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.object-material-badge-btn .mp-badge-chev { opacity: 0.55; margin-top: 0.5px; }
.object-material-badge-btn:hover,
.object-material-badge-btn.open {
  background: hsl(var(--accent-hue, 175) 45% 84%);
  color: hsl(var(--accent-hue, 175) 45% 24%);
}
[data-theme="dark"] .object-material-badge-btn:hover,
[data-theme="dark"] .object-material-badge-btn.open {
  background: hsl(var(--accent-hue, 175) 35% 32%);
  color: hsl(var(--accent-hue, 175) 55% 88%);
}

/* Material picker dropdown (object list). Reuses .printer-picker-menu chrome
   but is fixed-positioned so it escapes the scrolling object list. */
.material-picker-menu {
  width: 224px;
  max-height: min(380px, 70vh);
  overflow-y: auto;
  z-index: 200;
}
.material-picker-menu .ptpm-row.mp-item .ptpm-name {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}
.material-picker-menu .mp-mid {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 11.5px;
}
.material-picker-menu .mp-arrow { color: var(--text-dim); font-size: 11px; }
.material-picker-menu .mp-slot {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}
.material-picker-menu .ptpm-row.mp-item.active .mp-arrow,
.material-picker-menu .ptpm-row.mp-item.active .mp-slot { color: var(--accent-text); }

/* Separator between the materials list and the "new material" action. */
.ptpm-sep {
  height: 1px;
  background: var(--hairline);
  margin: 4px 6px;
}

/* "‹ New material — route to slot" header doubles as a back button. */
.ptpm-title.mp-back {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
  color: var(--text-dim);
}
.ptpm-title.mp-back:hover { color: var(--text); }
/* ───────── Quality profile selector ─────────
   Coarse print-quality preset dropdown sitting between the materials config
   band and the granular settings editor. Scales to many (incl. user-defined)
   profiles. */
.sp-quality {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 6px;
  margin-top: 2px;
  border-top: 1px dashed var(--hairline);
}
.sp-quality-label {
  margin-right: 0;
  flex-shrink: 0;
}
.sp-quality-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}
.sp-quality-chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  padding: 6px 8px 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  cursor: default;
  text-align: left;
}
.sp-quality-chip:hover { background: var(--surface-2); border-color: var(--border-strong); }
.sp-quality-chip.open { background: var(--surface-2); border-color: var(--border-strong); }
.sp-quality-chip-main {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}
.sp-quality-chip-name {
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sp-quality-chip-h {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.sp-quality-chip .chev { display: flex; flex-shrink: 0; }

.sp-quality-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  padding: 4px;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 1px;
  max-height: 260px;
  overflow-y: auto;
}
.sp-quality-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 8px;
  background: transparent;
  border: 0;
  border-radius: 5px;
  color: var(--text);
  cursor: default;
  text-align: left;
}
.sp-quality-item:hover { background: var(--surface-2); }
.sp-quality-item.active { background: var(--accent-soft); color: var(--accent-text); }
.sp-quality-item-name { font-size: 12.5px; font-weight: 500; }
.sp-quality-item-meta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-shrink: 0;
}
.sp-quality-item-h {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
}
.sp-quality-item.active .sp-quality-item-h { color: var(--accent-text); opacity: 0.85; }
.sp-quality-item-note {
  font-size: 10px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-dim);
  min-width: 56px;
  text-align: right;
}
.sp-quality-item.active .sp-quality-item-note { color: var(--accent-text); opacity: 0.85; }

.sp-tabs {
  display: flex;
  padding: 8px 10px 0;
  gap: 2px;
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: relative;
}
.sp-tab {
  position: relative;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px 10px;
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  color: var(--text-muted);
  font-size: 12.5px;
  font-weight: 500;
  cursor: default;
  border-radius: 0;
}
.sp-tab:hover:not(:disabled) { color: var(--text); }
.sp-tab-count {
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 600;
  color: var(--text-muted);
  background: var(--surface-3);
  border-radius: 7px; padding: 1px 5px;
  margin-left: 1px;
}
.sp-tab.active .sp-tab-count { color: hsl(var(--tab-hue) 55% 40%); background: hsl(var(--tab-hue) 70% 92%); }
[data-theme="dark"] .sp-tab.active .sp-tab-count { color: hsl(var(--tab-hue) 70% 75%); background: hsl(var(--tab-hue) 40% 25%); }
.sp-tab.active {
  color: var(--text);
  border-bottom-color: hsl(var(--tab-hue) 70% 55%);
}
.sp-tab.active .sp-tab-dot { box-shadow: 0 0 0 2px hsl(var(--tab-hue) 85% 90%); }
[data-theme="dark"] .sp-tab.active .sp-tab-dot { box-shadow: 0 0 0 2px hsl(var(--tab-hue) 40% 25%); }
.sp-tab:disabled {
  color: var(--text-dim);
  cursor: not-allowed;
}
.sp-tab-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: hsl(var(--tab-hue) 70% 55%);
  flex-shrink: 0;
}
.sp-tab:disabled .sp-tab-dot { background: var(--text-dim); }
.sp-tab-target {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
  margin-left: 2px;
  max-width: 130px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sp-tabs-spacer { flex: 1; }
.sp-tabs-info {
  align-self: center;
  font-size: 10.5px;
  font-family: var(--font-mono);
  color: var(--text-dim);
  padding-right: 6px;
}
.sp-context {
  padding: 10px 14px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--hairline);
}
.sp-context-label {
  font-size: 11px; color: var(--text-dim);
  letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600;
}
.sp-context-target {
  font-size: 12.5px; color: var(--text);
  display: flex; align-items: center; gap: 6px;
}
.sp-context-target .pill {
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 1px 7px; border-radius: 10px;
  font-family: var(--font-mono); font-size: 11px;
}

.search-wrap {
  padding: 10px 12px 8px;
  display: grid; gap: 8px;
}
.search-row {
  display: flex; align-items: stretch; gap: 8px;
}
.search-row .search-input { flex: 1; min-width: 0; }

/* Filter-by-modified toggle, sits to the right of the search field. */
.filter-toggle {
  flex-shrink: 0;
  display: inline-flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 9px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 100ms, background 100ms, color 100ms, box-shadow 100ms;
}
.filter-toggle:hover:not(:disabled) {
  color: var(--text);
  border-color: color-mix(in oklch, var(--accent) 35%, var(--border));
}
.filter-toggle:disabled { opacity: 0.4; cursor: default; }
.filter-toggle.active {
  background: color-mix(in oklch, var(--accent) 16%, var(--surface));
  border-color: color-mix(in oklch, var(--accent) 55%, var(--border));
  color: var(--accent-text);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 12%, transparent);
}
.filter-toggle-count {
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 600;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.filter-toggle.active .filter-toggle-count {
  background: color-mix(in oklch, var(--accent) 22%, var(--surface));
  border-color: transparent;
  color: var(--accent-text);
}

/* Simple / Advanced / Expert mode switch — sits under the search field. */
.mode-seg {
  display: flex; gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 2px;
}
.mode-seg-btn {
  flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 25px;
  border: 0; background: transparent;
  border-radius: 5px;
  font-size: 11.5px; font-weight: 500;
  color: var(--text-dim);
  cursor: pointer;
  transition: background 110ms, color 110ms, box-shadow 110ms;
}
.mode-seg-btn:hover { color: var(--text); }
.mode-seg-btn.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,0.14);
}
.mode-seg-count {
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 600;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 4px;
  background: transparent;
  color: var(--text-dim);
  opacity: 0.75;
}
.mode-seg-btn.active .mode-seg-count {
  background: color-mix(in oklch, var(--accent) 18%, var(--surface));
  color: var(--accent-text);
  opacity: 1;
}

.empty-link {
  background: none; border: 0; padding: 0;
  color: var(--accent-text);
  font: inherit; cursor: pointer;
  text-decoration: underline;
}
.empty-link:hover { opacity: 0.8; }

/* Tier tag on a setting row that's above the current mode but shown because
   it's been modified. */
.tier-tag {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 8.5px; font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 3px;
  border: 1px solid transparent;
}
.tier-tag.tier-advanced {
  color: hsl(45 75% 38%);
  background: hsl(45 75% 38% / 0.12);
  border-color: hsl(45 75% 38% / 0.3);
}
.tier-tag.tier-expert {
  color: hsl(8 70% 50%);
  background: hsl(8 70% 50% / 0.12);
  border-color: hsl(8 70% 50% / 0.3);
}
[data-theme="dark"] .tier-tag.tier-advanced {
  color: hsl(45 80% 65%);
  background: hsl(45 70% 55% / 0.16);
  border-color: hsl(45 70% 55% / 0.32);
}
[data-theme="dark"] .tier-tag.tier-expert {
  color: hsl(8 85% 68%);
  background: hsl(8 75% 58% / 0.16);
  border-color: hsl(8 75% 58% / 0.32);
}
.search-input {
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px;
  height: 32px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 7px;
  transition: border-color 100ms, background 100ms, box-shadow 100ms;
}
.search-input:focus-within {
  background: var(--surface);
  border-color: color-mix(in oklch, var(--accent) 45%, var(--border));
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 14%, transparent);
}
.search-input input {
  flex: 1; height: 100%;
  border: 0; outline: 0; background: transparent;
  color: var(--text); font-size: 13px;
}
.search-input input::placeholder { color: var(--text-dim); }
.search-input .ico { color: var(--text-dim); width: 14px; height: 14px; flex-shrink: 0; }
.search-input .kbd {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 4px;
}

.search-mode {
  display: flex; align-items: center;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px;
  font-size: 11px;
  gap: 1px;
}
.search-mode button {
  flex: 1; padding: 4px 6px;
  border: 0; background: transparent;
  border-radius: 4px;
  color: var(--text-muted);
  font-family: inherit;
  cursor: default;
}
.search-mode button.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

/* category jump rail + scrolling list */
.settings-body {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  min-height: 0;
}
.cat-rail {
  border-right: 1px solid var(--hairline);
  padding: 6px 0;
  overflow-y: auto;
  background: var(--surface);
  display: flex; flex-direction: column;
  gap: 1px;
}
.cat-rail-item {
  position: relative;
  display: grid;
  grid-template-columns: 22px 1fr 28px;
  align-items: center;
  gap: 4px;
  width: 140px;
  padding: 5px 10px 5px 8px;
  background: transparent;
  border: 0;
  color: var(--text-muted);
  font-size: 12px;
  text-align: left;
  border-radius: 0;
  cursor: default;
}
.cat-rail-item:hover { background: var(--surface-2); color: var(--text); }
.cat-rail-item.active {
  color: var(--text);
  background: var(--accent-soft);
}
.cat-rail-item.active::before {
  content: ""; position: absolute;
  left: 0; top: 4px; bottom: 4px; width: 2px;
  background: var(--accent);
  border-radius: 1px;
}
.cat-rail-icon {
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  border-radius: 3px;
  background: var(--surface-2);
}
.cat-rail-item.active .cat-rail-icon {
  background: var(--surface);
  color: var(--accent-text);
}
.cat-rail-count {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: right;
}

/* ── Collapsible category rail ──────────────────────────────────────────
   Collapsed, the rail shows only each section's symbol, narrowing the whole
   settings panel. */
.cat-rail-toggle {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  width: 140px;
  padding: 2px 12px 4px 8px;
  margin-bottom: 2px;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--hairline);
  color: var(--text-dim);
  cursor: default;
  transition: color 110ms, background 110ms;
}
.cat-rail-toggle:hover { color: var(--text); background: var(--surface-2); }
.cat-rail.collapsed .cat-rail-toggle {
  width: auto;
  justify-content: center;
  padding: 2px 0 4px;
}
.cat-rail-icon { position: relative; }
.cat-rail-ovdot {
  display: none;
  position: absolute;
  top: -2px; right: -2px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 1.5px var(--surface);
}
.cat-rail.collapsed .cat-rail-ovdot { display: block; }
.cat-rail.collapsed .cat-rail-item.active .cat-rail-ovdot { box-shadow: 0 0 0 1.5px var(--accent-soft); }
.cat-rail.collapsed .cat-rail-item {
  grid-template-columns: 1fr;
  width: auto;
  justify-items: center;
  padding: 5px 9px;
}
.cat-rail.collapsed .cat-rail-name,
.cat-rail.collapsed .cat-rail-count { display: none; }
.cat-rail-divider {
  border-bottom: 1px solid var(--hairline);
  margin: 4px 8px;
}

.settings-scroll {
  overflow-y: auto;
  scroll-behavior: smooth;
  padding-bottom: 80px;
  min-height: 0;
}
.settings-scroll::-webkit-scrollbar { width: 10px; }
.settings-scroll::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.12);
  border: 3px solid var(--surface);
  border-radius: 6px;
  background-clip: padding-box;
}
[data-theme="dark"] .settings-scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.14); border-color: var(--surface);
  background-clip: padding-box;
}

.cat-group { border-bottom: 1px solid var(--hairline); }
.cat-header {
  position: sticky; top: 0; z-index: 2;
  background: color-mix(in oklch, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px);
  padding: 10px 14px 6px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--hairline);
}
.cat-header h4 {
  margin: 0; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.cat-header .cat-desc { color: var(--text-dim); font-size: 11.5px; }
.cat-header .cat-counts {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
}

/* ───────── Setting Row ───────── */
.set-row {
  display: grid;
  grid-template-columns: 1fr 150px;
  align-items: center;
  gap: 8px;
  padding: 7px 14px 7px 14px;
  position: relative;
  /* Left rule is HIDDEN by default; revealed on hover so origin is consultable but not noisy */
  box-shadow: inset 3px 0 0 0 transparent;
  transition: box-shadow 120ms, background 120ms;
}
.set-row:hover {
  background: var(--surface-2);
  box-shadow: inset 3px 0 0 0 hsl(var(--row-hue) 70% 55%);
}
[data-theme="dark"] .set-row:hover {
  box-shadow: inset 3px 0 0 0 hsl(var(--row-hue) 60% 60%);
}

/* Project-level override — soft violet tint + bold name */
.set-row.authored-project {
  background: hsl(var(--proj-hue) 90% 97.5%);
}
.set-row.authored-project:hover {
  background: hsl(var(--proj-hue) 88% 96%);
}
.set-row.authored-project .set-name {
  font-weight: 600;
  color: var(--text);
}
[data-theme="dark"] .set-row.authored-project {
  background: hsl(var(--proj-hue) 25% 16%);
}
[data-theme="dark"] .set-row.authored-project:hover {
  background: hsl(var(--proj-hue) 30% 19%);
}

/* Object-level override — soft rose tint + bold name, wins over project tint */
.set-row.authored-object {
  background: hsl(var(--obj-hue) 90% 97.5%);
}
.set-row.authored-object:hover {
  background: hsl(var(--obj-hue) 88% 96%);
}
.set-row.authored-object .set-name {
  font-weight: 600;
  color: var(--text);
}
[data-theme="dark"] .set-row.authored-object {
  background: hsl(var(--obj-hue) 25% 16%);
}
[data-theme="dark"] .set-row.authored-object:hover {
  background: hsl(var(--obj-hue) 30% 19%);
}

/* When overridden, the hover rule reads brighter */
.set-row.overridden:hover {
  box-shadow: inset 4px 0 0 0 hsl(var(--row-hue) 70% 50%);
}
.set-row.has-conflict { background: oklch(from var(--warn) 0.98 0.03 h); }
[data-theme="dark"] .set-row.has-conflict { background: oklch(from var(--warn) 0.20 0.06 h); }
.set-row.has-conflict:hover { background: oklch(from var(--warn) 0.96 0.04 h); }
[data-theme="dark"] .set-row.has-conflict:hover { background: oklch(from var(--warn) 0.24 0.07 h); }

.set-meta { min-width: 0; display: flex; align-items: center; gap: 6px; }
.set-name {
  font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.set-source-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.02em;
  font-weight: 500;
  padding: 1px 5px 1px 4px;
  border-radius: 8px;
  background: hsl(var(--row-hue) 80% 96%);
  color: hsl(var(--row-hue) 60% 28%);
  border: 1px solid hsl(var(--row-hue) 70% 88%);
  flex-shrink: 0;
  cursor: default;
}
[data-theme="dark"] .set-source-chip {
  background: hsl(var(--row-hue) 30% 18%);
  color: hsl(var(--row-hue) 60% 75%);
  border-color: hsl(var(--row-hue) 30% 28%);
}
.set-source-chip .chip-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: hsl(var(--row-hue) 65% 50%);
}
.set-source-chip.conflict {
  background: var(--warn-soft);
  color: oklch(0.36 0.12 60);
  border-color: oklch(0.85 0.08 60);
}

/* Breadcrumb mode (alt accountability) */
.set-breadcrumb {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--text-dim);
  margin-left: 4px;
}
.set-breadcrumb .crumb {
  padding: 1px 4px; border-radius: 3px;
  background: hsl(var(--crumb-hue) 80% 96%);
  color: hsl(var(--crumb-hue) 60% 32%);
  border: 1px solid hsl(var(--crumb-hue) 70% 90%);
}
.set-breadcrumb .crumb.muted { background: var(--surface-2); border-color: var(--hairline); color: var(--text-dim); }
.set-breadcrumb .arrow { color: var(--text-dim); }

/* Input controls */
.set-value {
  display: flex; align-items: center; justify-content: flex-end; gap: 4px;
}
.val-input {
  width: 100%;
  text-align: right;
  height: 26px;
  padding: 0 28px 0 8px;
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text);
  outline: 0;
  transition: border-color 100ms, background 100ms, box-shadow 100ms;
}
.val-input:hover { border-color: var(--border); background: var(--surface); }
.val-input:focus {
  border-color: color-mix(in oklch, var(--accent) 50%, var(--border));
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 12%, transparent);
}
.val-wrap {
  position: relative; width: 100%;
}
.val-unit {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
  pointer-events: none;
}
.val-select {
  width: 100%;
  height: 26px;
  padding: 0 24px 0 8px;
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text);
  appearance: none;
  outline: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 12 12'><path fill='none' stroke='%239AA0AA' stroke-width='1.5' d='M3 5l3 3 3-3'/></svg>");
  background-repeat: no-repeat;
  background-position: right 6px center;
}
.val-select:hover { border-color: var(--border); }
.val-toggle {
  position: relative;
  width: 32px; height: 18px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: default;
  transition: background 120ms;
}
.val-toggle::after {
  content: "";
  position: absolute;
  top: 1px; left: 1px;
  width: 14px; height: 14px;
  background: white;
  border-radius: 50%;
  box-shadow: var(--shadow-sm);
  transition: transform 120ms;
}
.val-toggle.on {
  background: var(--accent);
  border-color: transparent;
}
.val-toggle.on::after { transform: translateX(14px); }
.val-toggle-wrap { width: 100%; display: flex; justify-content: flex-end; padding-right: 4px; }

/* ───────── Cascade ladder (hover, portal'd to body) ───────── */
.cascade-ladder {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 8px;
  box-shadow: var(--shadow-lg);
  min-width: 220px;
  max-width: 250px;
  z-index: 100;
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text);
}
.ladder-title {
  font-size: 10.5px;
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0 4px 6px;
  border-bottom: 1px solid var(--hairline);
  margin-bottom: 4px;
}
.ladder-row {
  display: grid;
  grid-template-columns: 12px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 4px 6px;
  border-radius: 4px;
  font-size: 11.5px;
  position: relative;
}
.ladder-row + .ladder-row { margin-top: 1px; }
.ladder-row .l-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: hsl(var(--row-hue) 70% 55%);
}
.ladder-row .l-dot.empty {
  background: transparent;
  border: 1px dashed var(--border-strong);
}
.ladder-row .l-name { color: var(--text-muted); }
.ladder-row.winner .l-name { color: var(--text); font-weight: 500; }
.ladder-row .l-val {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text);
}
.ladder-row .l-val.muted { color: var(--text-dim); }
.ladder-row.overridden .l-val { text-decoration: line-through; opacity: 0.55; }
.ladder-row.empty .l-name,
.ladder-row.empty .l-val { color: var(--text-dim); }
.ladder-row.winner {
  background: hsl(var(--row-hue) 80% 96%);
}
[data-theme="dark"] .ladder-row.winner {
  background: hsl(var(--row-hue) 30% 20%);
}

.ladder-actions {
  border-top: 1px solid var(--hairline);
  margin-top: 6px;
  padding-top: 6px;
  display: flex; gap: 4px;
}
.ladder-action {
  flex: 1;
  font-size: 11px;
  padding: 4px 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-muted);
  cursor: default;
}
.ladder-action:hover { background: var(--surface-3); color: var(--text); }
.ladder-action.primary { background: var(--accent); color: white; border-color: transparent; }
.ladder-action.primary:hover { background: oklch(from var(--accent) calc(l - 0.05) c h); color: white; }

/* objects-override badge — present on Project tab when 1+ objects override the row */
.objs-badge {
  display: inline-flex; align-items: center;
  gap: 5px;
  padding: 1px 5px 1px 4px;
  border-radius: 9px;
  background: hsl(var(--obj-hue) 90% 96%);
  border: 1px solid hsl(var(--obj-hue) 70% 85%);
  color: hsl(var(--obj-hue) 60% 30%);
  font-size: 10.5px;
  font-family: var(--font-mono);
  cursor: default;
  flex-shrink: 0;
}
[data-theme="dark"] .objs-badge {
  background: hsl(var(--obj-hue) 30% 18%);
  border-color: hsl(var(--obj-hue) 30% 28%);
  color: hsl(var(--obj-hue) 60% 75%);
}
.objs-badge svg { opacity: 0.75; }
.objs-badge-dots {
  display: inline-flex; align-items: center;
  gap: 2px;
}
.objs-badge-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.15) inset, 0 0 0 1px white;
}
[data-theme="dark"] .objs-badge-dot {
  box-shadow: 0 0 0 1px rgba(255,255,255,0.2) inset, 0 0 0 1px var(--surface);
}
.objs-badge-more {
  font-size: 9.5px;
  font-family: var(--font-mono);
  margin-left: 1px;
  opacity: 0.7;
}

/* ladder: per-object overrides section */
.ladder-section-title {
  display: flex; align-items: center; gap: 5px;
  font-size: 10.5px;
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 6px 4px 4px;
  margin-top: 4px;
  border-top: 1px solid var(--hairline);
}
.ladder-section-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
}
.ladder-row.obj-row {
  grid-template-columns: 12px 1fr auto;
}
.ladder-row.obj-row .l-name {
  font-size: 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0;
}
.ladder-row.obj-row.winner {
  background: hsl(var(--row-hue) 80% 94%);
  outline: 1px solid hsl(var(--row-hue) 70% 80%);
}
[data-theme="dark"] .ladder-row.obj-row.winner {
  background: hsl(var(--row-hue) 30% 22%);
  outline-color: hsl(var(--row-hue) 30% 30%);
}

/* ───────── Status bar ───────── */
.statusbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 14px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 10.5px;
}
.statusbar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.statusbar .spacer { flex: 1; }

/* ───────── Misc ───────── */
.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
}
.kbd-inline {
  font-family: var(--font-mono);
  font-size: 10.5px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 4px;
  color: var(--text-muted);
}
.dim { color: var(--text-dim); }
.muted { color: var(--text-muted); }

/* override action when row has user input */
.set-row .reset-btn {
  position: absolute;
  right: 156px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px; height: 18px;
  border-radius: 4px;
  background: transparent;
  border: 0;
  color: var(--text-dim);
  display: none;
  align-items: center; justify-content: center;
  cursor: default;
}
.set-row:hover .reset-btn.show { display: inline-flex; }
.reset-btn:hover { background: var(--surface-3); color: var(--text); }

/* small banner inside settings panel */
.sp-banner {
  margin: 8px 12px 0;
  padding: 8px 10px;
  background: oklch(from var(--accent) 0.97 0.03 h);
  border: 1px solid color-mix(in oklch, var(--accent) 25%, transparent);
  border-radius: 6px;
  font-size: 11.5px;
  color: var(--accent-text);
  display: flex; align-items: center; gap: 6px;
}
[data-theme="dark"] .sp-banner { background: oklch(from var(--accent) 0.22 0.08 h); }

/* ───────── Drag preview ───────── */
.drag-preview {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  box-shadow: var(--shadow-lg);
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text);
  transform: translate(-50%, -50%);
}


/* ═══════════════════════════════════════════════════════════════
   Add Printer flow — modal, empty state, brand marks
   ═══════════════════════════════════════════════════════════════ */

/* ── Modal backdrop & shell ── */
@keyframes apmFadeIn   { from { opacity: 0; } to { opacity: 1; } }
@keyframes apmPopIn    { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }

.modal-backdrop {
  position: fixed; inset: 0;
  background: color-mix(in oklch, var(--text) 35%, transparent);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  animation: apmFadeIn 140ms ease-out;
  padding: 24px;
}
[data-theme="dark"] .modal-backdrop {
  background: rgba(0, 0, 0, 0.55);
}

.add-printer-modal {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  box-shadow: 0 30px 80px rgba(15,17,21,0.22), 0 4px 12px rgba(15,17,21,0.10);
  width: min(880px, 100%);
  max-height: min(680px, calc(100vh - 48px));
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
  animation: apmPopIn 180ms cubic-bezier(0.2, 0.9, 0.3, 1);
}

/* ── Header ── */
.apm-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 18px 22px 16px;
  border-bottom: 1px solid var(--hairline);
  gap: 12px;
}
.apm-header h2 {
  margin: 0 0 2px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
}
.apm-header p {
  margin: 0;
  font-size: 12.5px;
  color: var(--text-muted);
}
.apm-close {
  width: 26px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent;
  border: 0;
  border-radius: 6px;
  color: var(--text-muted);
  cursor: default;
  flex-shrink: 0;
}
.apm-close:hover { background: var(--surface-2); color: var(--text); }

/* ── Two-pane body ── */
.apm-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  min-height: 0;
  overflow: hidden;
}

/* ── Left: profile list ── */
.apm-list {
  display: flex; flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--hairline);
  background: var(--surface);
}
.apm-search {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  height: 36px;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
  color: var(--text-dim);
}
.apm-search input {
  flex: 1; height: 100%;
  border: 0; outline: 0; background: transparent;
  color: var(--text);
  font-size: 13px;
}
.apm-search input::placeholder { color: var(--text-dim); }
.apm-search-clear {
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface-2);
  border: 0;
  border-radius: 50%;
  color: var(--text-muted);
  cursor: default;
}
.apm-search-clear:hover { background: var(--surface-3); color: var(--text); }

.apm-list-scroll {
  overflow-y: auto;
  padding: 8px 8px 14px;
  min-height: 0;
}
.apm-list-scroll::-webkit-scrollbar { width: 10px; }
.apm-list-scroll::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.12);
  border: 3px solid var(--surface);
  border-radius: 6px;
  background-clip: padding-box;
}
[data-theme="dark"] .apm-list-scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.14); border-color: var(--surface);
  background-clip: padding-box;
}

.apm-group + .apm-group { margin-top: 12px; }
.apm-group-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 8px 8px 6px;
}
.apm-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 6px;
}

.apm-card {
  display: grid;
  grid-template-columns: 36px 1fr 18px;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: default;
  text-align: left;
  transition: border-color 100ms, background 100ms, box-shadow 100ms;
}
.apm-card:hover {
  background: var(--surface-2);
  border-color: var(--border-strong);
}
.apm-card.selected {
  background: var(--accent-soft);
  border-color: color-mix(in oklch, var(--accent) 55%, var(--border));
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 14%, transparent);
}
.apm-card-mark {
  width: 36px; height: 36px;
  border-radius: 7px;
  background: var(--bm, oklch(0.58 0.05 240));
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  position: relative;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), inset 0 -8px 14px rgba(0,0,0,0.18);
}
.apm-card-mark::after {
  content: ""; position: absolute;
  inset: 6px;
  background: repeating-linear-gradient(45deg, transparent 0 2px, rgba(255,255,255,0.18) 2px 3px);
  border-radius: 3px;
  pointer-events: none;
}
.apm-card-mark > span { position: relative; z-index: 1; }
.apm-card-info {
  min-width: 0;
  display: flex; flex-direction: column; gap: 2px;
}
.apm-card-model {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.apm-card-dims {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
}
.apm-card.selected .apm-card-dims { color: var(--accent-text); opacity: 0.85; }
.apm-card-check {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent-text);
}

.apm-no-results {
  padding: 30px 12px;
  text-align: center;
  font-size: 12px;
  color: var(--text-dim);
}
.apm-no-results .apm-q {
  color: var(--text);
  font-family: var(--font-mono);
}

/* Brand color tokens — applied to .apm-card-mark, .onboarding-brand-mark, .apm-preview-brand */
[data-brand="Bambu Lab"] { --bm: oklch(0.55 0.16 145); }
[data-brand="Snapmaker"] { --bm: oklch(0.52 0.18 250); }
[data-brand="Prusa"]     { --bm: oklch(0.62 0.20 35);  }
[data-brand="Voron"]     { --bm: oklch(0.52 0.20 295); }
[data-brand="Creality"]  { --bm: oklch(0.55 0.20 25);  }

/* ── Right: detail pane ── */
.apm-detail {
  display: flex; flex-direction: column;
  min-height: 0;
  padding: 18px 20px 16px;
  gap: 14px;
  background: var(--surface-2);
  overflow-y: auto;
}
/* Children must not shrink — they should push apm-detail to scroll instead.
   Otherwise on short viewports the cube collapses to 0 height. */
.apm-detail > * { flex-shrink: 0; }
.apm-no-selection {
  color: var(--text-dim);
  font-size: 12.5px;
  padding: 30px 12px;
  text-align: center;
}

/* Preview block with isometric build-volume cube */
.apm-preview {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 16px 14px;
  display: flex; flex-direction: column; align-items: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
}
.apm-preview::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    color-mix(in oklch, var(--bm, oklch(0.6 0.05 240)) 12%, transparent) 0%,
    transparent 60%
  );
  pointer-events: none;
}
.apm-cube-svg {
  width: 130px; height: 130px;
  min-height: 130px;
  flex-shrink: 0;
  color: color-mix(in oklch, var(--bm, var(--text)) 75%, var(--text));
  position: relative;
}
.apm-preview-meta {
  text-align: center;
  position: relative;
}
.apm-preview-brand {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: color-mix(in oklch, var(--bm, var(--text-muted)) 80%, var(--text-muted));
  margin-bottom: 4px;
}
.apm-preview-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px;
  border-radius: 4px;
  background: var(--bm, oklch(0.58 0.05 240));
  color: white;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.apm-preview-model {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
}

/* Spec list */
.apm-spec {
  margin: 0;
  display: grid;
  gap: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 12px;
}
.apm-spec-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  align-items: baseline;
  gap: 12px;
  padding: 7px 0;
  border-bottom: 1px solid var(--hairline);
}
.apm-spec-row:last-child { border-bottom: 0; }
.apm-spec-row dt {
  margin: 0;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}
.apm-spec-row dd {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text);
  text-align: right;
}
.apm-spec-row dd.apm-spec-note {
  font-family: var(--font-sans);
  font-size: 11.5px;
  color: var(--text-muted);
  font-style: italic;
}

/* Name input */
.apm-name { display: flex; flex-direction: column; gap: 6px; }
.apm-name label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
