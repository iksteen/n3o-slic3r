  const shortLabel = slotShortLabel(slotId, slotIds);
  const longLabel = slotLongLabel(slotId);
  return (
    <div className="slot-chip-wrap">
      <button
        className={`slot-pill slot-chip-${slotId.replace(/[:]/g,"-")} ${filament ? "" : "empty"}`}
        onClick={() => onOpenPicker(slotId)}
        title={filament
          ? `${longLabel} · ${filament.brand || ""} ${filament.product || filament.label || ""}${filament.colorName ? " (" + filament.colorName + ")" : ""}\nClick to change`
          : `${longLabel} — click to assign filament`}
      >
        <span className="slot-pill-swatch" style={{ background: filament?.color || "transparent" }}/>
        <span className="slot-pill-label">{shortLabel}</span>
        <span className="slot-pill-material">{filament?.material || "—"}</span>
      </button>
    </div>
  );
}

function MaterialChip({ materialId, slotId, filament, useCount, filaments, slotIds = [], slotMap, onPickSlot }) {
  const [open, setOpen] = useSPS(false);
  useSPE(() => {
    if (!open) return;
    const onDoc = (e) => {
      if (!e.target.closest(`.material-menu-${materialId}`) &&
          !e.target.closest(`.material-chip-${materialId}`)) setOpen(false);
    };
    document.addEventListener("click", onDoc);
    return () => document.removeEventListener("click", onDoc);
  }, [open, materialId]);

  return (
    <div className="config-chip-wrap">
      <button
        className={`material-chip material-chip-${materialId}`}
        onClick={() => setOpen(o => !o)}
        title={filament ? `${materialId} → ${slotLongLabel(slotId)} (${filament.label}) · ${useCount} object${useCount !== 1 ? "s" : ""}` : `${materialId} → unmapped`}
      >
        <span className="material-id">{materialId}</span>
        <span className="material-arrow">→</span>
        <span className="material-slot">{slotId ? slotShortLabel(slotId, slotIds) : "—"}</span>
        <span className="fil-swatch" style={{ background: filament?.color || "transparent", border: filament ? "none" : "1px dashed currentColor" }}/>
        <span className="fil-label">{filament ? filament.label : "unmapped"}</span>
        <span className="fil-count">×{useCount}</span>
        <ChevronChip/>
      </button>
      {open && (
        <div className={`printer-picker-menu material-menu material-menu-${materialId}`} onClick={(e) => e.stopPropagation()}>
          <div className="ptpm-title">Route {materialId} to slot…</div>
          {slotIds.map(sid => {
            const fid = (slotMap || {})[sid];
            const f = fid ? filaments.find(x => x.id === fid) : null;
            return (
              <button
                key={sid}
                className={`ptpm-item ptpm-row ${sid === slotId ? "active" : ""}`}
                onClick={() => { onPickSlot(sid); setOpen(false); }}
              >
                <span className="ptpm-name">
                  <span className="ptpm-swatch" style={{ background: f?.color || "transparent", border: f ? "none" : "1px dashed currentColor" }}/>
                  {slotLongLabel(sid)}
                </span>
                <span className="ptpm-detail">{f ? f.label : "empty"}</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

// "Slots" row label is the sync button — clicking it pulls the printer's
// current spool loadout into the slicer. Label stays "Slots"; only the icon
// animates: spinning while syncing, briefly flashing a check on success.
// Button is disabled (non-interactive) for the duration of the sync.
function SyncSlotsLabel({ printer, onSync }) {
  const [state, setState] = useSPS("idle"); // idle | syncing | synced
  const timerRef = useSPR(null);
  useSPE(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

  const handleClick = () => {
    if (state !== "idle") return;
    setState("syncing");
    Promise.resolve(onSync && onSync())
      .catch(() => {})
      .finally(() => {
        // hold the spinner for a beat even if onSync resolves instantly
        timerRef.current = setTimeout(() => {
          setState("synced");
          timerRef.current = setTimeout(() => setState("idle"), 900);
        }, 650);
      });
  };

  const title = state === "syncing"
    ? `Syncing filament loadout from ${printer || "printer"}…`
    : state === "synced"
    ? `Filament loadout synced from ${printer || "printer"}`
    : `Physical loadout — what each slot is spooled with right now.\nClick to sync from ${printer || "the printer"}.`;

  return (
    <button
      className={`config-row-label slots-sync-label state-${state}`}
      onClick={handleClick}
      disabled={state !== "idle"}
      title={title}
      aria-label="Sync filaments from printer"
      aria-busy={state === "syncing"}
    >
      <span className="slots-sync-ico" aria-hidden>
        {state === "synced" ? (
          <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 6.5l2.2 2.2L9.5 3.8" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        ) : (
          <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
            <path d="M10 5.5A4 4 0 0 0 3 3.2" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            <path d="M10 1.5V3.5H8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            <path d="M2 6.5A4 4 0 0 0 9 8.8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            <path d="M2 10.5V8.5H4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
      </span>
      <span className="slots-sync-text">Slots</span>
    </button>
  );
}

// Per-extruder nozzle chip. With one extruder this is the classic "Nozzle"
// chip; with multiple toolheads (Snapmaker U1, Prusa XL) we render one chip
// per toolhead and number them T1, T2, …
function NozzleChip({ index, total, nozzle, onClick }) {
  const label = total > 1 ? `Nozzle T${index + 1}` : "Nozzle";
  return (
    <button
      className="config-chip"
      onClick={onClick}
      style={{ "--chip-hue": LAYER_BY_ID.nozzle.hue }}
      title={`${label} — ${nozzle}\nClick to change`}
    >
      <span className="config-chip-top">
        <span className="chip-dot"/>
        <span className="chip-label">{label}</span>
        <span className="chev"><ChevronChip/></span>
      </span>
      <span className="chip-value" title={nozzle}>{nozzle}</span>
    </button>
  );
}

// ───────── Settings Panel root ─────────
function SettingsPanel({
  readOnly = false,
  contextLayer,
  setContextLayer,
  selectedObject,
  setObjectOverride,
  resetObjectOverride,
  accountabilityMode,
  searchMode,
  machineEntry = "gear",
  userOverrides,
  setUserOverrides,
  objects,                 // all objects on the plate
  filaments,
  // config-strip props
  printer, printerConnStatus = "none", bedPlate, nozzle,
  extruders = 1,
  nozzles,                 // optional per-extruder array; falls back to [nozzle] × extruders
  filamentsInUse,
  materialsInUse,
  slotIds = [],
  slotMap,
  materialMap,
  onOpenSlotPicker,
  onSyncFilaments,
  setMaterialSlot,
  printerPresets,
  onSwapPrinter, onSwapBedPlate, onSwapNozzle, onSwapFilament,
  onEditPrinter,
  // plugins (plate-level surface)
  pluginEnablement, setPluginEnablement, pluginConfig, setPluginConfig,
  activePlateId, activePlateName,
}) {
  const [query, setQuery] = useSPS("");
  const [showModifiedOnly, setShowModifiedOnly] = useSPS(false);
  const [settingMode, setSettingMode] = useSPS(() => {
    try { return localStorage.getItem("n3o.settingMode") || "advanced"; }
    catch (e) { return "advanced"; }
  });
  useSPE(() => {
    try { localStorage.setItem("n3o.settingMode", settingMode); } catch (e) {}
  }, [settingMode]);
  const [pluginTabActive, setPluginTabActive] = useSPS(false);
  const PluginManagerComp = window.PluginManager;
  const [activeCat, setActiveCat] = useSPS(CATEGORIES[0].id);
  const [railCollapsed, setRailCollapsed] = useSPS(() => {
    try { return localStorage.getItem("n3o.railCollapsed.v2") === "1"; }
    catch (e) { return false; }
  });
  useSPE(() => {
    try { localStorage.setItem("n3o.railCollapsed.v2", railCollapsed ? "1" : "0"); } catch (e) {}
  }, [railCollapsed]);
  // Drive the panel width via a root class so the workspace grid column
  // (which reads --sp-w) narrows when the rail is collapsed.
  useSPE(() => {
    document.documentElement.classList.toggle("sp-collapsed", railCollapsed);
  }, [railCollapsed]);
  const [printerMenuOpen, setPrinterMenuOpen] = useSPS(false);
  const [qualityProfile, setQualityProfile] = useSPS("standard");
  const [qualityMenuOpen, setQualityMenuOpen] = useSPS(false);
  const scrollRef = useSPR(null);
  const inputRef = useSPR(null);
  const printerChipRef = useSPR(null);

  // Dismiss printer menu on outside click
  useSPE(() => {
    if (!printerMenuOpen) return;
    const onDoc = (e) => {
      if (!e.target.closest(".printer-picker-menu") && !e.target.closest(".config-chip-printer")) {
        setPrinterMenuOpen(false);
      }
    };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [printerMenuOpen]);

  // Dismiss quality menu on outside click
  useSPE(() => {
    if (!qualityMenuOpen) return;
    const onDoc = (e) => {
      if (!e.target.closest(".sp-quality-menu") && !e.target.closest(".sp-quality-chip")) {
        setQualityMenuOpen(false);
      }
    };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [qualityMenuOpen]);

  const objectAvailable = !!selectedObject;

  // Derive the per-extruder nozzle list. Most printers have a single nozzle;
  // the U1 has 4 (one per toolhead), the Prusa XL up to 5. If the plate
  // doesn't store per-extruder strings yet, mirror the default nozzle into
  // each slot so the chips still render.
  const nozzleList = useSPM(() => {
    const n = Math.max(1, extruders | 0);
    if (Array.isArray(nozzles) && nozzles.length) {
      return Array.from({ length: n }, (_, i) => nozzles[i] || nozzle);
    }
    return Array(n).fill(nozzle);
  }, [extruders, nozzles, nozzle]);
  const inlineNozzles = nozzleList.length <= 2;

  // The user printer currently assigned to this plate, matched by display
  // name. Machine-settings entry points act on this printer directly.
  const activePrinterId = useSPM(() => {
    const m = (printerPresets || []).find(p => !p.isAddNew && p.name === printer);
    return m ? m.id : null;
  }, [printerPresets, printer]);
  const openMachineSettings = useSPC(() => {
    if (onEditPrinter && activePrinterId) onEditPrinter(activePrinterId);
  }, [onEditPrinter, activePrinterId]);
  // If object becomes unavailable while on object tab, fall back to project.
  useSPE(() => {
    if (contextLayer === "object" && !objectAvailable) setContextLayer("project");
  }, [contextLayer, objectAvailable, setContextLayer]);

  // keyboard shortcut for search focus
  useSPE(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "f") {
        e.preventDefault();
        inputRef.current?.focus();
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  // Is this setting "modified" at the current editing layer? On the Project
  // tab: has a project-level value (base profile + user edits, minus cleared
  // sentinels). On the Object tab: the selected object overrides it. This is
  // the same notion the category-rail accent counts use, so the filter total
  // lines up with those badges.
  const isSettingModified = useSPC((s) => {
    if (contextLayer === "object") {
      if (!selectedObject) return false;
      const ov = (selectedObject.overrides || {})[s.id];
      return ov !== undefined && ov !== null;
    }
    const user = (userOverrides[s.id] || {}).project;
    if (user === null) return false;
    if (user !== undefined) return true;
    return s.cascade.project !== undefined && s.cascade.project !== null;
  }, [contextLayer, selectedObject, userOverrides]);

  const filteredCategories = useSPM(() => {
    const passFilters = (arr) => {
      // A setting shows if it's in the current mode's tier OR it's been
      // modified — changed settings are never hidden by the mode, so you can
      // always see (and revert) what differs even in Simple mode.
      let out = arr.filter(s => settingVisibleInMode(s, settingMode) || isSettingModified(s));
      if (showModifiedOnly) out = out.filter(isSettingModified);
      return out;
    };
    // The list shows literally everything only in Expert mode with no query
    // and no modified filter — the only case the header omits the "/total".
    const showingAll = !query.trim() && !showModifiedOnly && settingMode === "expert";

    if (!query.trim()) {
      return CATEGORIES
        .map(c => ({ ...c, _settings: passFilters(c.settings), _matchedAll: showingAll }))
        .filter(c => c._settings.length > 0);
    }

    const q = query.trim();
    return CATEGORIES.map(cat => {
      let matched;
      if (searchMode === "instant") {
        // simple case-insensitive substring on setting name or id
        const lower = q.toLowerCase();
        matched = cat.settings.filter(s =>
          s.name.toLowerCase().includes(lower) || s.id.includes(lower)
        );
      } else if (searchMode === "scoped") {
        // narrows to the active category only
        if (cat.id !== activeCat) matched = [];
        else {
          const lower = q.toLowerCase();
          matched = cat.settings.filter(s =>
            s.name.toLowerCase().includes(lower) || s.id.includes(lower)
          );
        }
      } else { // fuzzy
        matched = cat.settings
          .map(s => ({ s, score: Math.max(fuzzyScore(q, s.name), fuzzyScore(q, s.id) * 0.7) }))
          .filter(x => x.score > 0.25)
          .sort((a, b) => b.score - a.score)
          .map(x => x.s);
      }
      return { ...cat, _settings: passFilters(matched), _matchedAll: false };
    }).filter(c => c._settings.length > 0);
  }, [query, searchMode, activeCat, showModifiedOnly, settingMode, isSettingModified]);

  // observe scroll position to update activeCat
  useSPE(() => {
    const root = scrollRef.current;
    if (!root) return;
    const headers = Array.from(root.querySelectorAll("[data-cat-id]"));
    const obs = new IntersectionObserver(entries => {
      // pick the topmost-visible
      const visible = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible.length > 0) {
        const id = visible[0].target.getAttribute("data-cat-id");
        setActiveCat(id);
      }
    }, { root, rootMargin: "-10% 0px -70% 0px", threshold: [0, 1] });
    headers.forEach(h => obs.observe(h));
    return () => obs.disconnect();
  }, [filteredCategories]);

  const jumpToCat = (catId) => {
    setActiveCat(catId);
    const el = scrollRef.current?.querySelector(`[data-cat-id="${catId}"]`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // Project-layer writes — go into userOverrides (also support the rare "user"
  // layer write from the cascade ladder, treating it like project).
  const setProjectOverride = useSPC((settingId, value) => {
    setUserOverrides(prev => {
      const cur = { ...(prev[settingId] || {}) };
      cur.project = value;
      return { ...prev, [settingId]: cur };
    });
  }, [setUserOverrides]);

  const resetProjectOverride = useSPC((settingId) => {
    setUserOverrides(prev => {
      const cur = { ...(prev[settingId] || {}) };
      const setting = ALL_SETTINGS.find(s => s.id === settingId);
      const baseHasValue = setting && setting.cascade.project !== undefined && setting.cascade.project !== null;
      if (baseHasValue) {
        // base profile defined a value here — sentinel-clear with null so it
        // doesn't fall through.
        cur.project = null;
      } else {
        // value was a user-added override — just drop the key.
        delete cur.project;
      }
      const next = { ...prev };
      if (Object.keys(cur).length === 0) delete next[settingId];
      else next[settingId] = cur;
      return next;
    });
  }, [setUserOverrides]);

  // Count of settings per category that have an active value at the current
  // editing layer. On Project tab: counts settings with project values (base
  // profile + user additions, minus cleared sentinels). On Object tab: counts
  // settings the selected object has overrides for.
  const counts = useSPM(() => {
    const out = {};
    CATEGORIES.forEach(c => {
      const visible = c.settings.filter(s => settingVisibleInMode(s, settingMode) || isSettingModified(s));
      out[c.id] = {
        total: visible.length,
        overrides: visible.filter(isSettingModified).length,
      };
    });
    return out;
  }, [isSettingModified, settingMode]);

  // How many settings each mode reveals (cumulative) — shown on the segments.
  const modeCounts = useSPM(() => {
    const out = {};
    SETTING_MODES.forEach(m => {
      out[m.id] = ALL_SETTINGS.filter(s => settingVisibleInMode(s, m.id)).length;
    });
    return out;
  }, []);

  const modifiedTotal = useSPM(
    () => Object.values(counts).reduce((n, c) => n + c.overrides, 0),
    [counts]
  );

  // If the user filters to modified-only and then clears every override (so
  // nothing is left to show), drop the filter so the list isn't stuck empty.
  useSPE(() => {
    if (showModifiedOnly && modifiedTotal === 0) setShowModifiedOnly(false);
  }, [showModifiedOnly, modifiedTotal]);

  const totalMatches = filteredCategories.reduce((n, c) => n + c._settings.length, 0);

  return (
    <aside className={`settings-panel ${readOnly ? "readonly" : ""} ${railCollapsed ? "rail-collapsed" : ""}`}>
      {readOnly && (
        <div className="sp-readonly-banner" title="Settings are locked while viewing the sliced result. Switch to Prepare to edit.">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="2.5" y="6" width="9" height="6.5" rx="1.2" stroke="currentColor" strokeWidth="1.3"/>
            <path d="M4.5 6V4.5a2.5 2.5 0 0 1 5 0V6" stroke="currentColor" strokeWidth="1.3"/>
          </svg>
          <span>Read-only — sliced preview. Switch to <b>Prepare</b> to edit.</span>
        </div>
      )}
      <div className="sp-config">
        <div className="sp-config-row">
          <div className={`config-chip-wrap config-chip-wrap-printer ${machineEntry === "gear" && onEditPrinter && activePrinterId ? "is-split" : ""}`} ref={printerChipRef}>
            <button
              className="config-chip config-chip-printer"
              onClick={() => setPrinterMenuOpen(o => !o)}
              style={{ "--chip-hue": LAYER_BY_ID.printer.hue }}
            >
              <span className="config-chip-top">
                <span className="chip-dot"/>
                <span className="chip-label">Printer</span>
                <span className="chev"><ChevronChip/></span>
              </span>
              <span className="chip-value-row">
                <span className="chip-value" title={printer}>{printer}</span>
                <span
                  className={`conn-indicator conn-${printerConnStatus}`}
                  title={CONN_LABELS[printerConnStatus] || CONN_LABELS.none}
                  aria-label={CONN_LABELS[printerConnStatus] || CONN_LABELS.none}
                />
              </span>
            </button>
            {machineEntry === "gear" && onEditPrinter && activePrinterId && (
              <button
                className="chip-gear"
                onClick={(e) => { e.stopPropagation(); openMachineSettings(); }}
                title={`Machine settings \u2014 ${printer}\nG-code, limits, connection`}
                aria-label={`Machine settings for ${printer}`}
              >
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <circle cx="8" cy="8" r="2.3" stroke="currentColor" strokeWidth="1.3"/>
                  <path d="M8 1.4v2M8 12.6v2M1.4 8h2M12.6 8h2M3.3 3.3l1.4 1.4M11.3 11.3l1.4 1.4M3.3 12.7l1.4-1.4M11.3 4.7l1.4-1.4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                </svg>
              </button>
            )}
            {printerMenuOpen && printerPresets && (
              <div className="printer-picker-menu" onClick={(e) => e.stopPropagation()}>
                {machineEntry === "menu" && onEditPrinter && activePrinterId && (
                  <>
                    <button
                      className="ptpm-machine-action"
                      onClick={() => { setPrinterMenuOpen(false); openMachineSettings(); }}
                      title={`Open machine settings for ${printer}`}
                    >
                      <span className="ptpm-machine-action-ico">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                          <circle cx="8" cy="8" r="2.3" stroke="currentColor" strokeWidth="1.3"/>
                          <path d="M8 1.4v2M8 12.6v2M1.4 8h2M12.6 8h2M3.3 3.3l1.4 1.4M11.3 11.3l1.4 1.4M3.3 12.7l1.4-1.4M11.3 4.7l1.4-1.4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                        </svg>
                      </span>
                      <span className="ptpm-machine-action-text">
                        <span className="ptpm-machine-action-title">Machine settings…</span>
                        <span className="ptpm-machine-action-sub">{printer} · G-code, limits, connection</span>
                      </span>
                      <svg className="ptpm-machine-action-chev" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
                        <path d="M3.5 2l3 3-3 3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    </button>
                    <div className="ptpm-divider"/>
                  </>
                )}
                <div className="ptpm-title">Switch printer for this plate</div>
                {printerPresets.filter(p => !p.isAddNew).map(preset => (
                  <div
                    key={preset.id}
                    className={`ptpm-item ptpm-row ${preset.name === printer ? "active" : ""}`}
                  >
                    <button
                      className="ptpm-row-main"
                      onClick={() => {
                        onSwapPrinter && onSwapPrinter(preset.id);
                        setPrinterMenuOpen(false);
                      }}
                      title={`Assign ${preset.name} to this plate`}
                    >
                      <span className="ptpm-name">{preset.name}</span>
                      <span className="ptpm-detail">
                        {preset.plateSize[0]}×{preset.plateSize[1]} · {preset.bedPlate}
                      </span>
                    </button>
                    {onEditPrinter && (
                      <button
                        className="ptpm-cog ptpm-cog-visible"
                        onClick={(e) => {
                          e.stopPropagation();
                          setPrinterMenuOpen(false);
                          onEditPrinter(preset.id);
                        }}
                        title={`Machine settings for ${preset.name}`}
                        aria-label={`Machine settings for ${preset.name}`}
                      >
                        <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
                          <path d="M7 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM7 1v1.5M7 11.5V13M3.5 3.5l1 1M9.5 9.5l1 1M1 7h1.5M11.5 7H13M3.5 10.5l1-1M9.5 4.5l1-1" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
                        </svg>
                      </button>
                    )}
                  </div>
                ))}
                {printerPresets.some(p => p.isAddNew) && (
                  <>
                    <div className="ptpm-divider"/>
                    <button
                      className="ptpm-item ptpm-add"
                      onClick={() => {
                        onSwapPrinter && onSwapPrinter("__new__");
                        setPrinterMenuOpen(false);
                      }}
                    >
                      <span className="ptpm-name">
                        <svg width="11" height="11" viewBox="0 0 14 14" fill="none" style={{verticalAlign:"-1px", marginRight:6}}>
                          <path d="M7 2v10M2 7h10" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
                        </svg>
                        New printer…
                      </span>
                      <span className="ptpm-detail">⌘N</span>
                    </button>
                  </>
                )}
              </div>
            )}
          </div>
          <button className="config-chip" onClick={onSwapBedPlate} style={{ "--chip-hue": LAYER_BY_ID.printer.hue }}>
            <span className="config-chip-top">
              <span className="chip-dot"/>
              <span className="chip-label">Bed</span>
              <span className="chev"><ChevronChip/></span>
            </span>
            <span className="chip-value" title={bedPlate}>{bedPlate}</span>
          </button>
          {inlineNozzles && nozzleList.map((nz, i) => (
            <NozzleChip
              key={i}
              index={i}
              total={nozzleList.length}
              nozzle={nz}
              onClick={() => onSwapNozzle && onSwapNozzle(i)}
            />
          ))}
          {machineEntry === "chip" && onEditPrinter && activePrinterId && (
            <button
              className="config-chip config-chip-machine"
              onClick={openMachineSettings}
              style={{ "--chip-hue": LAYER_BY_ID.printer.hue }}
              title={`Machine settings \u2014 ${printer}\nG-code, machine limits, connection`}
            >
              <span className="config-chip-top">
                <span className="chip-dot"/>
                <span className="chip-label">Machine</span>
              </span>
              <span className="chip-value chip-value-action">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <circle cx="8" cy="8" r="2.3" stroke="currentColor" strokeWidth="1.3"/>
                  <path d="M8 1.4v2M8 12.6v2M1.4 8h2M12.6 8h2M3.3 3.3l1.4 1.4M11.3 11.3l1.4 1.4M3.3 12.7l1.4-1.4M11.3 4.7l1.4-1.4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                </svg>
                Configure
              </span>
            </button>
          )}
        </div>
        {!inlineNozzles && (
          <div className="sp-config-row sp-config-nozzles">
            <span
              className="config-row-label"
              title="Per-toolhead nozzles — one chip per extruder. Click any to change that toolhead's nozzle."
            >Nozzles</span>
            <div className="nozzle-grid">
              {nozzleList.map((nz, i) => (
                <NozzleChip
                  key={i}
                  index={i}
                  total={nozzleList.length}
                  nozzle={nz}
                  onClick={() => onSwapNozzle && onSwapNozzle(i)}
                />
              ))}
            </div>
          </div>
        )}
      <div className="sp-quality" role="row">
        <span className="config-row-label sp-quality-label">Quality</span>
        <div className="sp-quality-wrap">
          {(() => {
            const cur = QUALITY_PROFILES.find(p => p.id === qualityProfile) || QUALITY_PROFILES[0];
            return (
              <button
                className={`sp-quality-chip ${qualityMenuOpen ? "open" : ""}`}
                onClick={() => setQualityMenuOpen(o => !o)}
                aria-haspopup="listbox"
                aria-expanded={qualityMenuOpen}
                title={`${cur.name} · ${cur.layer} mm layer height`}
              >
                <span className="sp-quality-chip-main">
                  <span className="sp-quality-chip-name">{cur.name}</span>
                  <span className="sp-quality-chip-h">{cur.layer} mm</span>
                </span>
                <span className="chev"><ChevronChip/></span>
              </button>
            );
          })()}
          {qualityMenuOpen && (
            <div className="sp-quality-menu" role="listbox" onClick={(e) => e.stopPropagation()}>
              {QUALITY_PROFILES.map(p => (
                <button
                  key={p.id}
                  className={`sp-quality-item ${p.id === qualityProfile ? "active" : ""}`}
                  role="option"
                  aria-selected={p.id === qualityProfile}
                  onClick={() => { setQualityProfile(p.id); setQualityMenuOpen(false); }}
                >
                  <span className="sp-quality-item-name">{p.name}</span>
                  <span className="sp-quality-item-meta">
                    <span className="sp-quality-item-h">{p.layer} mm</span>
                    <span className="sp-quality-item-note">{p.note}</span>
                  </span>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
        <div className="sp-config-row sp-config-slots">
          <SyncSlotsLabel printer={printer} onSync={onSyncFilaments}/>
          {slotIds.length === 0 ? (
            <span className="dim" style={{ fontSize: 11, fontFamily: "var(--font-mono)" }}>
              no slots — printer has no extruders configured
            </span>
          ) : slotIds.map(slotId => {
            const filamentId = (slotMap || {})[slotId];
            const fil = filamentId ? filaments.find(f => f.id === filamentId) : null;
            return (
              <SlotChip
                key={slotId}
                slotId={slotId}
                slotIds={slotIds}
                filament={fil}
                onOpenPicker={onOpenSlotPicker}
              />
            );
          })}
        </div>
        <div className="sp-config-row sp-config-materials">
          <span className="config-row-label" title="Each material in the project (M1, M2…) is routed to one slot.">Materials</span>
          {(!materialsInUse || materialsInUse.length === 0) ? (
            <span className="dim" style={{ fontSize: 11, fontFamily: "var(--font-mono)" }}>
              none — add an object to assign a material
            </span>
          ) : (
            materialsInUse.map(m => (
              <MaterialChip
                key={m.materialId}
                materialId={m.materialId}
                slotId={m.slotId}
                filament={m.filament}
                useCount={m.useCount}
                filaments={filaments}
                slotIds={slotIds}
                slotMap={slotMap || {}}
                onPickSlot={(slotId) => setMaterialSlot && setMaterialSlot(m.materialId, slotId)}
              />
            ))
          )}
        </div>
      </div>

      <div className="sp-tabs">
        <button

                {settingMode !== "expert" && (

                    <button

                  </div>
                )}
              </div>
            </div>
          )}
          {filteredCategories.map(cat => (
            <section key={cat.id} className="cat-group" data-cat-id={cat.id}>
              <header className="cat-header">
                <h4>
                  <span className="cat-rail-icon" style={{ marginRight: 2 }}>{cat.icon}</span>

                <span className="cat-counts">
                  {cat._settings.length}{!cat._matchedAll && `/${cat.settings.length}`}
                </span>
              </header>
              {cat._settings.map(setting => (
                <SettingRow
                  key={setting.id}
                  readOnly={readOnly}
                  setting={setting}
                  outOfMode={!settingVisibleInMode(setting, settingMode)}
                  contextLayer={contextLayer}
                  selectedObject={contextLayer === "object" ? selectedObject : null}
                  objects={objects}
                  filaments={filaments}
                  slotMap={slotMap}
                  materialMap={materialMap}
                  accountabilityMode={accountabilityMode}
                  userOverrides={userOverrides}
                  onSetProjectOverride={setProjectOverride}
                  onResetProjectOverride={resetProjectOverride}
                  onSetObjectOverride={setObjectOverride}
                  onResetObjectOverride={resetObjectOverride}
                />
              ))}
            </section>
          ))}
        </div>
      </div>
      )}
    </aside>
  );
}

window.SettingsPanel = SettingsPanel;

</script>

<script type="text/babel" data-source="PlateTabs.jsx">
// PlateTabs.jsx — horizontal tab strip below the topbar.
//
// Layout:
//   [+]  [Plate 1] [Plate 2] [Plate 3] ────────────────── [Devices]
//
// Left: a single "+" button to add a new plate. Then the plate tabs scroll.
// Right-aligned at the end: a Devices tab that switches the whole workspace
// into fleet-monitor mode (the user's preferred mental model — Devices is
// "the other place", not yet another plate).

function PlateTabs({
  plates,
  activePlateId,
  setActivePlateId,
  addPlate,
  closePlate,
  renamePlate,
  devicesActive,
  onSelectDevices,
  printingCount = 0,
  errorCount = 0,
  deviceCount = 0,
}) {
  const { useState, useRef, useEffect, useLayoutEffect } = React;
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState("");
  const editInputRef = useRef(null);
  // Scroll container — used for active-tab-into-view, edge fades, and
  // mouse-wheel-to-horizontal-scroll.
  const scrollerRef = useRef(null);
  const activeTabRef = useRef(null);
  const [scrollState, setScrollState] = useState({ left: false, right: false });

  useEffect(() => {
    if (editingId && editInputRef.current) {
      editInputRef.current.focus();
      editInputRef.current.select();
    }
  }, [editingId]);

  // Keep the active tab in view when switching plates (e.g. opening a new
  // plate at the far right of an overflowing strip).
  useLayoutEffect(() => {
    const el = activeTabRef.current;
    const scroller = scrollerRef.current;
    if (!el || !scroller || devicesActive) return;
    const eLeft = el.offsetLeft;
    const eRight = eLeft + el.offsetWidth;
    const sLeft = scroller.scrollLeft;
    const sRight = sLeft + scroller.clientWidth;
    if (eLeft < sLeft) scroller.scrollTo({ left: eLeft - 12, behavior: "smooth" });
    else if (eRight > sRight) scroller.scrollTo({ left: eRight - scroller.clientWidth + 12, behavior: "smooth" });
  }, [activePlateId, devicesActive, plates.length]);

  // Update edge-fade indicators whenever the scroll state changes (resize,
  // tab add/remove, manual scroll).
  useEffect(() => {
    const scroller = scrollerRef.current;
    if (!scroller) return;
    const update = () => {
      const max = scroller.scrollWidth - scroller.clientWidth;
      setScrollState({
        left: scroller.scrollLeft > 1,
        right: scroller.scrollLeft < max - 1,
      });
    };
    update();
    scroller.addEventListener("scroll", update, { passive: true });
    const ro = new ResizeObserver(update);
    ro.observe(scroller);
    // Re-check after each tab mutation
    const mo = new MutationObserver(update);
    mo.observe(scroller, { childList: true, subtree: false });
    return () => {
      scroller.removeEventListener("scroll", update);
      ro.disconnect();
      mo.disconnect();
    };
  }, []);

  // Convert vertical mouse-wheel into horizontal scroll over the tab strip
  // (matches Chrome / VS Code tab behaviour). Trackpad gestures with native
  // deltaX bypass this branch and scroll directly.
  const onWheel = (e) => {
    const scroller = scrollerRef.current;
    if (!scroller) return;
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && e.deltaY !== 0) {
      scroller.scrollLeft += e.deltaY;
      // Only prevent default if we actually consumed (have room to move).
      const max = scroller.scrollWidth - scroller.clientWidth;
      if (scroller.scrollLeft > 0 && scroller.scrollLeft < max) e.preventDefault();
    }
  };

  const commitRename = () => {
    if (editingId && editValue.trim()) {
      renamePlate(editingId, editValue.trim());
    }
    setEditingId(null);
  };

  return (
    <div className="plate-tabs">
      <button
        className="plate-tab-add"
        onClick={addPlate}
        title="New plate"
        aria-label="New plate"
      >
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
          <path d="M7 2v10M2 7h10" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
        </svg>
      </button>

      <div
        className={`plate-tabs-scroll ${scrollState.left ? "fade-left" : ""} ${scrollState.right ? "fade-right" : ""}`}
        ref={scrollerRef}
        onWheel={onWheel}
      >
        {plates.map(plate => {
          const isActive = !devicesActive && plate.id === activePlateId;
          const isEditing = editingId === plate.id;
          return (
            <div
              key={plate.id}
              ref={isActive ? activeTabRef : null}
              className={`plate-tab ${isActive ? "active" : ""}`}
              onClick={() => !isEditing && setActivePlateId(plate.id)}
            >
              <span className="plate-tab-icon" title="Build plate">
                <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
                  <path d="M1 9l6 3 6-3M1 6l6 3 6-3M1 3l6 3 6-3-6-3-6 3z" stroke="currentColor" strokeWidth="1.1" strokeLinejoin="round"/>
                </svg>
              </span>
              {isEditing ? (
                <input
                  ref={editInputRef}
                  className="plate-tab-rename-input"
                  value={editValue}
                  onChange={(e) => setEditValue(e.target.value)}
                  onBlur={commitRename}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") commitRename();
                    if (e.key === "Escape") { setEditingId(null); }
                  }}
                  onClick={(e) => e.stopPropagation()}
                />
              ) : (
                <span
                  className="plate-tab-name"
                  onDoubleClick={(e) => {
                    e.stopPropagation();
                    setEditingId(plate.id);
                    setEditValue(plate.name);
                  }}
                  title="Double-click to rename"
                >
                  {plate.name}
                </span>
              )}
              <span className="plate-tab-divider"/>
              <span className="plate-tab-printer-display" title={`Assigned to ${plate.printer} — change in the settings panel`}>
                {plate.printer}
              </span>
              <span className="plate-tab-meta">
                {plate.objects.length} obj
              </span>
              {plates.length > 1 && (
                <button
                  className="plate-tab-close"
                  onClick={(e) => { e.stopPropagation(); closePlate(plate.id); }}
                  title="Close plate"
                >
                  <svg width="9" height="9" viewBox="0 0 12 12" fill="none">
                    <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                  </svg>
                </button>
              )}
            </div>
          );
        })}
      </div>

      {/* Devices: right-aligned context tab. */}
      <button
        className={`plate-tab plate-tab-devices ${devicesActive ? "active" : ""}`}
        onClick={onSelectDevices}
        title="Devices — monitor and control your printers"
      >
        <span className="plate-tab-icon">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
            <rect x="1.5" y="2.5" width="11" height="7.5" rx="1.2" stroke="currentColor" strokeWidth="1.2"/>
            <path d="M5 12.5h4M7 10v2.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
          </svg>
        </span>
        <span className="plate-tab-name">Devices</span>
        <span className="plate-tab-meta">{deviceCount}</span>
        {printingCount > 0 && (
          <span className="plate-tab-badge printing" title={`${printingCount} printing`}>{printingCount}</span>
        )}
        {errorCount > 0 && (
          <span className="plate-tab-badge error" title={`${errorCount} with errors`}>!</span>
        )}
      </button>
    </div>
  );
}

window.PlateTabs = PlateTabs;

</script>
<script type="text/babel" data-source="AddPrinterModal.jsx">
// AddPrinterModal.jsx — modal dialog for creating a new user printer from a
// profile. Two-pane layout: profile gallery on the left, spec preview + name
// input on the right. Enter to confirm, Esc to cancel.

function AddPrinterModal({ profiles, existingNames = [], onAdd, onClose, initialProfileId = null }) {
  const { useState, useEffect, useMemo, useRef } = React;

  const [selectedId, setSelectedId] = useState(initialProfileId || profiles[0]?.id || null);
  const [query, setQuery] = useState("");
  const [name, setName] = useState("");
  const [touched, setTouched] = useState(false);
  const [amsUnits, setAmsUnits] = useState(1); // default to 1 AMS if the profile supports any
  const nameRef = useRef(null);

  const selected = useMemo(
    () => profiles.find(p => p.id === selectedId),
    [profiles, selectedId]
  );

  // Whenever the profile changes, reset the AMS count to a sensible default
  // (1 if the printer supports an AMS at all, 0 otherwise). User can adjust.
  useEffect(() => {
    if (!selected) return;
    setAmsUnits(selected.amsMax > 0 ? 1 : 0);
  }, [selectedId]);

  const makeUniqueName = (base) => {
    if (!base) return "";
    if (!existingNames.includes(base)) return base;
    let n = 2;
    while (existingNames.includes(`${base} (${n})`)) n++;
    return `${base} (${n})`;
  };

  // Auto-fill the name when the user picks a new profile (until they edit it)
  useEffect(() => {
    if (selected && !touched) {
      setName(makeUniqueName(selected.model));
    }
  }, [selectedId]);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return profiles;
    return profiles.filter(p =>
      `${p.brand} ${p.model}`.toLowerCase().includes(q)
    );
  }, [query, profiles]);

  const grouped = useMemo(() => {
    const order = [];
    const map = new Map();
    filtered.forEach(p => {
      if (!map.has(p.brand)) { map.set(p.brand, []); order.push(p.brand); }
      map.get(p.brand).push(p);
    });
    return order.map(brand => ({ brand, items: map.get(brand) }));
  }, [filtered]);

  const trimmedName = name.trim();
  const nameInUse = trimmedName && existingNames.includes(trimmedName);
  const canAdd = !!selected && trimmedName.length > 0 && !nameInUse;

  const handleAdd = () => {
    if (!canAdd) return;
    onAdd({ profileId: selected.id, name: trimmedName, amsUnits });
  };

  // ESC to close, Enter (on name input handled inline) to confirm
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") { e.stopPropagation(); onClose(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div
        className="add-printer-modal"
        onClick={(e) => e.stopPropagation()}
        role="dialog"
        aria-modal="true"
        aria-labelledby="apm-title"
      >
        <header className="apm-header">
          <div className="apm-header-text">
            <h2 id="apm-title">Add a printer</h2>
            <p>Pick a profile to base it on. Everything is editable later.</p>
          </div>
          <button className="apm-close" onClick={onClose} aria-label="Close" title="Close (Esc)">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </button>
        </header>

        <div className="apm-body">
          <aside className="apm-list" aria-label="Printer profiles">
            <div className="apm-search">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <circle cx="6" cy="6" r="4" stroke="currentColor" strokeWidth="1.4"/>
                <path d="M9 9l3.5 3.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
              </svg>
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Search profiles…"
                autoFocus
                aria-label="Search profiles"
              />
              {query && (
                <button className="apm-search-clear" onClick={() => setQuery("")} aria-label="Clear">
                  <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                    <path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                  </svg>
                </button>
              )}
            </div>

            <div className="apm-list-scroll">
              {grouped.length === 0 ? (
                <div className="apm-no-results">
                  No profiles match <span className="apm-q">"{query}"</span>
                </div>
              ) : grouped.map(group => (
                <div key={group.brand} className="apm-group">
                  <div className="apm-group-label">{group.brand}</div>
                  <div className="apm-cards">
                    {group.items.map(p => {
                      const isSel = selectedId === p.id;
                      return (
                        <button
                          key={p.id}
                          className={`apm-card ${isSel ? "selected" : ""}`}
                          onClick={() => setSelectedId(p.id)}
                          type="button"
                        >
                          <div className="apm-card-mark" data-brand={p.brand}>
                            <span>{p.brandShort}</span>
                          </div>
                          <div className="apm-card-info">
                            <div className="apm-card-model">{p.model}</div>
                            <div className="apm-card-dims">
                              {p.plateSize[0]} × {p.plateSize[1]} × {p.plateSize[2]} mm
                            </div>
                          </div>
                          <div className="apm-card-check">
                            {isSel && (
                              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <path d="M3 7.5l2.8 2.8L11 4.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                              </svg>
                            )}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </aside>

          <section className="apm-detail">
            {selected ? (
              <>
                <div className="apm-preview" data-brand={selected.brand}>
                  <BuildVolumePreview dims={selected.plateSize} brand={selected.brand} />
                  <div className="apm-preview-meta">
                    <div className="apm-preview-brand" data-brand={selected.brand}>
                      <span className="apm-preview-mark">{selected.brandShort}</span>
                      {selected.brand}
                    </div>
                    <div className="apm-preview-model">{selected.model}</div>
                  </div>
                </div>

                <dl className="apm-spec">
                  <div className="apm-spec-row">
                    <dt>Build volume</dt>
                    <dd>{selected.plateSize[0]} × {selected.plateSize[1]} × {selected.plateSize[2]} mm</dd>
                  </div>
                  <div className="apm-spec-row">
                    <dt>Default nozzle</dt>
                    <dd>{selected.nozzle}</dd>
                  </div>
                  {(selected.extruders || 1) > 1 && (
                    <div className="apm-spec-row">
                      <dt>Extruders</dt>
                      <dd>{selected.extruders} toolheads</dd>
                    </div>
                  )}
                  {selected.note && (
                    <div className="apm-spec-row">
                      <dt>Notes</dt>
                      <dd className="apm-spec-note">{selected.note}</dd>
                    </div>
                  )}
                </dl>

                {selected.amsMax > 0 && (
                  <AmsPicker
                    amsMax={selected.amsMax}
                    amsType={selected.amsType || "AMS"}
                    value={amsUnits}
                    onChange={setAmsUnits}
                  />
                )}

                <div className="apm-name">
                  <label htmlFor="apm-name-input">Name this printer</label>
                  <div className={`apm-name-input ${nameInUse ? "error" : ""}`}>
                    <input
                      id="apm-name-input"
                      ref={nameRef}
                      value={name}
                      onChange={(e) => { setName(e.target.value); setTouched(true); }}
                      onKeyDown={(e) => { if (e.key === "Enter" && canAdd) handleAdd(); }}
                      placeholder="e.g. Garage A1"
                    />
                    {touched && name && (
                      <button
                        className="apm-name-reset"
                        onClick={() => { setTouched(false); setName(makeUniqueName(selected.model)); }}
                        title="Reset to profile default"
                        type="button"
                      >
                        reset
                      </button>
                    )}
                  </div>
                  {nameInUse ? (
                    <div className="apm-name-hint error">
                      A printer named "{trimmedName}" already exists. Try another.
                    </div>
                  ) : (
                    <div className="apm-name-hint">
                      Shown on plate tabs and in the printer picker. Use whatever helps you tell yours apart.
                    </div>
                  )}
                </div>
              </>
            ) : (
              <div className="apm-no-selection">Pick a profile to continue.</div>
            )}
          </section>
        </div>

        <footer className="apm-footer">
          <span className="apm-keyhint">
            <kbd>↵</kbd> add &nbsp;·&nbsp; <kbd>esc</kbd> cancel
          </span>
          <div className="apm-actions">
            <button className="apm-btn" onClick={onClose} type="button">Cancel</button>
            <button
              className="apm-btn primary"
              onClick={handleAdd}
              disabled={!canAdd}
              type="button"
            >
              Add printer
            </button>
          </div>
        </footer>
      </div>
    </div>
  );
}

// AMS configuration picker — shown in the right pane of AddPrinterModal when
// the selected profile supports one or more AMS units.
//
// For amsMax === 1: a binary toggle (no AMS / with AMS).
// For amsMax > 1: a row of selectable "tiles" 0..amsMax so the user can pick
// how many AMS units to install. Each unit contributes 4 slots; the
// running total of slots is shown for clarity.
function AmsPicker({ amsMax, amsType, value, onChange }) {
  const isToggle = amsMax === 1;
  const totalSlots = (value || 0) * 4 + 1; // +1 for the external spool
  return (
    <div className="apm-ams">
      <div className="apm-ams-head">
        <span className="apm-ams-label">{amsType} configuration</span>
        <span className="apm-ams-counter">
          {value === 0
            ? "No AMS"
            : value === 1
              ? `1 × ${amsType} · 4 slots`
              : `${value} × ${amsType} · ${value * 4} slots`}
          {value > 0 && <span className="apm-ams-counter-dim"> (+ ext spool = {totalSlots})</span>}
        </span>
      </div>
      {isToggle ? (
        <div className="apm-ams-toggle">
          <button
            className={`apm-ams-tile ${value === 0 ? "active" : ""}`}
            onClick={() => onChange(0)}
            type="button"
          >
            <span className="apm-ams-tile-num">0</span>
            <span className="apm-ams-tile-label">No AMS</span>
          </button>
          <button
            className={`apm-ams-tile ${value === 1 ? "active" : ""}`}
            onClick={() => onChange(1)}
            type="button"
          >
            <span className="apm-ams-tile-num">1</span>
            <span className="apm-ams-tile-label">With {amsType}</span>
            <span className="apm-ams-tile-dots">
              {[0,1,2,3].map(i => <span key={i} className="apm-ams-tile-dot"/>)}
            </span>
          </button>
        </div>
      ) : (
        <div className="apm-ams-row">
          {Array.from({ length: amsMax + 1 }, (_, i) => (
            <button
              key={i}
              className={`apm-ams-tile ${value === i ? "active" : ""}`}
              onClick={() => onChange(i)}
              type="button"
              title={i === 0 ? `No ${amsType} installed` : `${i} × ${amsType} (${i * 4} slots)`}
            >
              <span className="apm-ams-tile-num">{i}</span>
              <span className="apm-ams-tile-label">
                {i === 0 ? "None" : `${i} unit${i > 1 ? "s" : ""}`}
              </span>
              {i > 0 && (
                <span className="apm-ams-tile-dots">
                  {[0,1,2,3].map(d => <span key={d} className="apm-ams-tile-dot"/>)}
                </span>
              )}
            </button>
          ))}
        </div>
      )}
      <div className="apm-name-hint">
        {value === 0
          ? "Filaments load directly into the extruder via an external spool. You can attach an AMS later from the printer's settings."
          : `Each ${amsType} holds 4 spools and feeds them to the toolhead automatically. You'll route project materials to slots once a plate exists.`}
      </div>
    </div>
  );
}

// Brand color hexes (mirror styles.css [data-brand] tokens but as concrete
// values so SVG renders correctly even in html-to-image captures, which can
// stumble on nested color-mix(oklch).
const BRAND_COLORS = {
  "Bambu Lab": "#2F8C5A",
  "Snapmaker": "#3266C8",
  "Prusa":     "#D77A2E",
  "Voron":     "#7148C9",
  "Creality":  "#C84528",
};

// Tiny isometric wireframe cube. Highlights the bottom face (the build plate)
// with a solid brand-tinted fill. Dims subtly scale the cube width vs depth so
// 250 × 210 looks different from 256 × 256.
function BuildVolumePreview({ dims, brand }) {
  const color = BRAND_COLORS[brand] || "#3F4A5A";
  const [w, d, h] = dims;
  const maxDim = Math.max(w, d, h, 360);
  const scale = 60 / maxDim;
  const wp = w * scale;
  const dp = d * scale;
  const hp = h * scale;

  const cos = Math.cos(Math.PI / 6);
  const sin = Math.sin(Math.PI / 6);

  const cx = 75, cy = 80;
  const p = (x, y, z) => {
    const px = cx + (x - y) * cos;
    const py = cy - z + (x + y) * sin;
    return [px, py];
  };

  const c000 = p(0, 0, 0);
  const c100 = p(wp, 0, 0);
  const c110 = p(wp, dp, 0);
  const c010 = p(0, dp, 0);
  const c001 = p(0, 0, hp);
  const c101 = p(wp, 0, hp);
  const c111 = p(wp, dp, hp);
  const c011 = p(0, dp, hp);

  const xs = [c000, c100, c110, c010, c001, c101, c111, c011].map(c => c[0]);
  const ys = [c000, c100, c110, c010, c001, c101, c111, c011].map(c => c[1]);
  const offX = 75 - (Math.min(...xs) + Math.max(...xs)) / 2;
  const offY = 75 - (Math.min(...ys) + Math.max(...ys)) / 2;
  const a = (pt) => `${pt[0] + offX} ${pt[1] + offY}`;

  return (
    <svg className="apm-cube-svg" viewBox="0 0 150 150" fill="none" aria-hidden="true" style={{ color }}>
      {/* Bottom face — build plate, brand-tinted solid */}
      <path
        d={`M ${a(c000)} L ${a(c100)} L ${a(c110)} L ${a(c010)} Z`}
        fill={color}
        fillOpacity="0.18"
        stroke={color}
        strokeWidth="1.4"
        strokeLinejoin="round"
      />
      {/* Inner grid lines on the build plate (3 strips) — gives it that "plate" feel */}
      {[0.25, 0.5, 0.75].map((t, i) => {
        const pa = p(wp * t, 0, 0);
        const pb = p(wp * t, dp, 0);
        const pc = p(0, dp * t, 0);
        const pd = p(wp, dp * t, 0);
        return (
          <g key={i} opacity="0.35">
            <path d={`M ${a(pa)} L ${a(pb)}`} stroke={color} strokeWidth="0.6"/>
            <path d={`M ${a(pc)} L ${a(pd)}`} stroke={color} strokeWidth="0.6"/>
          </g>
        );
      })}
      {/* Vertical edges (z-axis) — dashed at the back */}
      <path d={`M ${a(c100)} L ${a(c101)}`} stroke={color} strokeWidth="1" strokeDasharray="2 2" opacity="0.55"/>
      <path d={`M ${a(c010)} L ${a(c011)}`} stroke={color} strokeWidth="1" strokeDasharray="2 2" opacity="0.55"/>
      <path d={`M ${a(c110)} L ${a(c111)}`} stroke={color} strokeWidth="1" strokeDasharray="2 2" opacity="0.55"/>
      {/* Front vertical — solid */}
      <path d={`M ${a(c000)} L ${a(c001)}`} stroke={color} strokeWidth="1.4"/>
      {/* Top face outline */}
      <path
        d={`M ${a(c001)} L ${a(c101)} L ${a(c111)} L ${a(c011)} Z`}
        stroke={color}
        strokeWidth="1"
        strokeLinejoin="round"
        opacity="0.55"
      />
    </svg>
  );
}

window.AddPrinterModal = AddPrinterModal;
window.AmsPicker = AmsPicker;

</script>
<script type="text/babel" data-source="PrinterSettingsModal.jsx">
// PrinterSettingsModal.jsx — per-printer settings sheet.
// Reached by clicking the cog next to a printer in the picker.
// Sections: General (name + profile info), Connection (network — only for
// printers n3o can talk to), Start G-code, End G-code, Machine limits.
// Delete lives in the footer with an inline confirm.

// Network connection support, keyed by hardware profile id. Printers absent
// from this map can't be driven over the network in this build, so their
// Connection section is hidden entirely.
//   needsAccessCode — show the access-code field (Bambu LAN auth)
//   needsPort       — show the port field (defaults to 80)
//   lanNote         — show the LAN-only / developer-mode requirement callout
const CONNECTION_SPECS = {
  bambu_a1:      { needsAccessCode: true,  lanNote: true },
  bambu_a1_mini: { needsAccessCode: true,  lanNote: true },
  snapmaker_u1:  { needsAccessCode: false, needsPort: true, lanNote: false },
};

const DEFAULT_PORT = 80;

function PrinterSettingsModal({ printer, allPrinters, onSave, onDelete, onClose }) {
  const { useState, useEffect, useRef } = React;
  if (!printer) return null;

  // Which printer profiles n3o can talk to over the network, and what each
  // connection needs. Profiles not listed here have no Connection section.
  const connSpec = CONNECTION_SPECS[printer.profileId] || null;

  const [draft, setDraft] = useState({
    name: printer.name,
    nozzle: printer.nozzle,
    bedPlate: printer.bedPlate,
    amsUnits: printer.amsUnits || 0,
    startGcode: printer.startGcode || "",
    endGcode: printer.endGcode || "",
    limits: { ...(printer.limits || {}) },
    connection: { ip: "", accessCode: "", port: DEFAULT_PORT, ...(printer.connection || {}) },
  });
  const [active, setActive] = useState("general");
  const [confirmingDelete, setConfirmingDelete] = useState(false);
  const [confirmingDiscard, setConfirmingDiscard] = useState(false);

  // Reset when switching to a different printer
  useEffect(() => {
    setDraft({
      name: printer.name,
      nozzle: printer.nozzle,
      bedPlate: printer.bedPlate,
      amsUnits: printer.amsUnits || 0,
      startGcode: printer.startGcode || "",
      endGcode: printer.endGcode || "",
      limits: { ...(printer.limits || {}) },
      connection: { ip: "", accessCode: "", port: DEFAULT_PORT, ...(printer.connection || {}) },
    });
    setActive("general");
    setConfirmingDelete(false);
    setConfirmingDiscard(false);
  }, [printer.id]);

  // Esc closes — but if there are unsaved edits, ask first instead.
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Escape") return;
      e.stopPropagation();
      if (confirmingDiscard) { setConfirmingDiscard(false); return; }
      requestClose();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const otherNames = allPrinters.filter(p => p.id !== printer.id).map(p => p.name);
  const trimmedName = draft.name.trim();
  const nameInUse = trimmedName && otherNames.includes(trimmedName);
  const dirty = (
    draft.name !== printer.name ||
    draft.nozzle !== printer.nozzle ||
    draft.amsUnits !== (printer.amsUnits || 0) ||
    draft.startGcode !== (printer.startGcode || "") ||
    draft.endGcode !== (printer.endGcode || "") ||
    JSON.stringify(draft.limits) !== JSON.stringify(printer.limits || {}) ||
    (!!connSpec && JSON.stringify(draft.connection) !== JSON.stringify({ ip: "", accessCode: "", port: DEFAULT_PORT, ...(printer.connection || {}) }))
  );
  const canSave = !!trimmedName && !nameInUse && dirty;

  const handleSave = () => {
    if (!canSave) return;
    const patch = {
      name: trimmedName,
      nozzle: draft.nozzle,
      amsUnits: draft.amsUnits,
      startGcode: draft.startGcode,
      endGcode: draft.endGcode,
      limits: draft.limits,
    };
    if (connSpec) {
      patch.connection = { ip: draft.connection.ip };
      if (connSpec.needsAccessCode) patch.connection.accessCode = draft.connection.accessCode;
      if (connSpec.needsPort) patch.connection.port = draft.connection.port;
    }
    onSave(printer.id, patch);
  };

  // Close requests funnel through here so unsaved edits prompt a confirm
  // instead of silently discarding work.
  const requestClose = () => {
    if (dirty) { setConfirmingDiscard(true); return; }
    onClose();
  };

  const setConn = (k, v) => setDraft(d => ({ ...d, connection: { ...d.connection, [k]: v } }));

  const setLimit = (k, v) => setDraft(d => ({ ...d, limits: { ...d.limits, [k]: v } }));

  const otherCount = allPrinters.length - 1;
  const fallback = allPrinters.find(p => p.id !== printer.id);

  // Per-field / per-section change tracking, so the nav can flag which
  // sections hold unsaved edits and each field can mark itself changed.
  const baseConn = { ip: "", accessCode: "", port: DEFAULT_PORT, ...(printer.connection || {}) };
  const limitKeys = ["feedrateX","feedrateY","feedrateZ","feedrateE","acceleration","jerk","minLayer","maxLayer"];
  const limitChanged = {};
  limitKeys.forEach(k => {
    limitChanged[k] = (printer.limits?.[k] ?? "") !== (draft.limits?.[k] ?? "");
  });
  const changed = {
    name: draft.name !== printer.name,
    amsUnits: draft.amsUnits !== (printer.amsUnits || 0),
    startGcode: draft.startGcode !== (printer.startGcode || ""),
    endGcode: draft.endGcode !== (printer.endGcode || ""),
    conn: {
      ip: (draft.connection.ip || "") !== (baseConn.ip || ""),
      accessCode: (draft.connection.accessCode || "") !== (baseConn.accessCode || ""),
      port: String(draft.connection.port ?? "") !== String(baseConn.port ?? ""),
    },
    limits: limitChanged,
  };
  const sectionDirty = {
    general: changed.name || changed.amsUnits,
    connection: !!connSpec && (changed.conn.ip
      || (connSpec.needsAccessCode && changed.conn.accessCode)
      || (connSpec.needsPort && changed.conn.port)),
    start: changed.startGcode,
    end: changed.endGcode,
    limits: limitKeys.some(k => limitChanged[k]),
  };

  const sections = [
    { id: "general",  label: "General",       icon: "⚙" },
    ...(connSpec ? [{ id: "connection", label: "Connection", icon: "⇄" }] : []),
    { id: "start",    label: "Start G-code",  icon: "⊳" },
    { id: "end",      label: "End G-code",    icon: "⊲" },
    { id: "limits",   label: "Machine limits",icon: "↔" },
  ];

  return (
    <div className="modal-backdrop" onClick={requestClose}>
      <div
        className="printer-settings-modal"
        onClick={(e) => e.stopPropagation()}
        role="dialog"
        aria-modal="true"
        aria-labelledby="psm-title"
      >
        <header className="psm-header">
          <div className="psm-header-mark" data-brand={printer.brand}>
            <span>{printer.brandShort}</span>
          </div>
          <div className="psm-header-text">
            <h2 id="psm-title">{printer.name}</h2>
            <p>
              Based on <span className="psm-profile-label">{printer.profileLabel}</span>
              &nbsp;·&nbsp;
              <span className="psm-mono">{printer.plateSize[0]} × {printer.plateSize[1]} × {printer.plateSize[2]} mm</span>
            </p>
          </div>
          <button className="apm-close" onClick={requestClose} aria-label="Close" title="Close (Esc)">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </button>
        </header>

        <div className="psm-body">
          <nav className="psm-nav" aria-label="Settings sections">
            {sections.map(s => (
              <button
                key={s.id}
                className={`psm-nav-item ${active === s.id ? "active" : ""} ${sectionDirty[s.id] ? "dirty" : ""}`}
                onClick={() => setActive(s.id)}
                type="button"
              >
                <span className="psm-nav-icon">{s.icon}</span>
                <span>{s.label}</span>
                {sectionDirty[s.id] && <span className="psm-nav-dot" title="Unsaved changes" aria-label="Unsaved changes"></span>}
              </button>
            ))}
          </nav>

          <section className="psm-content">
            {active === "general" && (
              <GeneralSection
                draft={draft} setDraft={setDraft}
                printer={printer} nameInUse={nameInUse}
                changed={changed}
              />
            )}
            {active === "connection" && connSpec && (
              <ConnectionSection
                printer={printer}
                spec={connSpec}
                connection={draft.connection}
                setConn={setConn}
                changed={changed.conn}
              />
            )}
            {active === "start" && (
              <GcodeSection
                kind="start"
                value={draft.startGcode}
                onChange={(v) => setDraft(d => ({ ...d, startGcode: v }))}
                changed={changed.startGcode}
              />
            )}
            {active === "end" && (
              <GcodeSection
                kind="end"
                value={draft.endGcode}
                onChange={(v) => setDraft(d => ({ ...d, endGcode: v }))}
                changed={changed.endGcode}
              />
            )}
            {active === "limits" && (
              <LimitsSection limits={draft.limits} setLimit={setLimit} changed={changed.limits}/>
            )}
          </section>
        </div>

        <footer className="psm-footer">
          {confirmingDelete ? (
            <div className="psm-confirm">
              <div className="psm-confirm-text">
                {allPrinters.length <= 1 ? (
                  <>
                    <strong>Can't delete the only printer.</strong>
                    <span> Add another first.</span>
                  </>
                ) : (
                  <>
                    <strong>Delete "{printer.name}"?</strong>
                    {otherCount > 0 && (
                      <span> Plates using it will be reassigned to <span className="psm-mono">{fallback.name}</span>.</span>
                    )}
                  </>
                )}
              </div>
              <div className="psm-confirm-actions">
                <button className="apm-btn" onClick={() => setConfirmingDelete(false)} type="button">
                  Cancel
                </button>
                {allPrinters.length > 1 && (
                  <button
                    className="apm-btn danger"
                    onClick={() => { onDelete(printer.id); }}
                    type="button"
                  >
                    Delete printer
                  </button>
                )}
              </div>
            </div>
          ) : (
            <>
              <button
                className="psm-delete-trigger"
                onClick={() => setConfirmingDelete(true)}
                type="button"
                title={allPrinters.length <= 1 ? "Can't delete the only printer" : "Delete this printer"}
              >
                <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
                  <path d="M3 4h8M5 4V2.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V4M4.5 4l.5 7a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1l.5-7" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                Delete printer
              </button>
              <div className="apm-actions">
                <button className="apm-btn" onClick={requestClose} type="button">
                  {dirty ? "Cancel" : "Close"}
                </button>
                <button
                  className="apm-btn primary"
                  onClick={handleSave}
                  disabled={!canSave}
                  type="button"
                >
                  Save changes
                </button>
              </div>
            </>
          )}
        </footer>

        {confirmingDiscard && (
          <div className="psm-discard-overlay" onClick={() => setConfirmingDiscard(false)}>
            <div
              className="psm-discard-card"
              onClick={(e) => e.stopPropagation()}
              role="alertdialog"
              aria-modal="true"
              aria-labelledby="psm-discard-title"
            >
              <h3 id="psm-discard-title" className="psm-discard-title">Unsaved changes</h3>
              <p className="psm-discard-body">
                You have unsaved changes to <strong>{printer.name}</strong>. Closing now will discard them.
              </p>
              <div className="psm-discard-actions">
                <button className="apm-btn" onClick={() => setConfirmingDiscard(false)} type="button">
                  Keep editing
                </button>
                <button
                  className="apm-btn danger"
                  onClick={() => { setConfirmingDiscard(false); onClose(); }}
                  type="button"
                >
                  Discard changes
                </button>
                <button
                  className="apm-btn primary"
                  onClick={() => { if (canSave) { handleSave(); } setConfirmingDiscard(false); onClose(); }}
                  disabled={!canSave}
                  type="button"
                >
                  Save &amp; close
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function GeneralSection({ draft, setDraft, printer, nameInUse, changed = {} }) {
  const AmsPicker = window.AmsPicker;
  return (
    <div className="psm-section">
      <div className={`psm-field ${changed.name ? "changed" : ""}`}>

function ConnectionSection({ printer, spec, connection, setConn, changed = {} }) {
  return (
    <div className="psm-section">
      <div className={`psm-field ${changed.ip ? "changed" : ""}`}>
        <label htmlFor="psm-conn-ip">IP address</label>
        <div className="apm-name-input">
          <input
            id="psm-conn-ip"
            value={connection.ip}

          />
        </div>
        <div className="apm-name-hint">
          The local network address of your {printer.profileLabel}. Find it on the printer's screen under network settings.
        </div>
      </div>

      {spec.needsPort && (
        <div className={`psm-field ${changed.port ? "changed" : ""}`}>
          <label htmlFor="psm-conn-port">Port</label>
          <div className="apm-name-input">

              id="psm-conn-port"
              value={connection.port}
              onChange={(e) => setConn("port", e.target.value.replace(/[^0-9]/g, ""))}

              inputMode="numeric"
              autoComplete="off"

            />

          <div className="apm-name-hint">
            The port n3o connects on. Defaults to 80; change it only if you've remapped the printer's HTTP interface.
          </div>

      {spec.needsAccessCode && (
        <div className={`psm-field ${changed.accessCode ? "changed" : ""}`}>
          <label htmlFor="psm-conn-code">Access code</label>
          <div className="apm-name-input">
            <input
              id="psm-conn-code"
              value={connection.accessCode}
              onChange={(e) => setConn("accessCode", e.target.value)}
              placeholder="8-character code"
              autoComplete="off"
              spellCheck={false}
            />
          </div>
          <div className="apm-name-hint">
            Shown on the printer under the LAN-only access settings. Used to authenticate this connection.
          </div>
        </div>

      {spec.lanNote && (
        <div className="psm-conn-note" role="note">
          <svg className="psm-conn-note-ico" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1.5l5.5 2.4v3.2c0 3.2-2.3 6-5.5 7-3.2-1-5.5-3.8-5.5-7V3.9L8 1.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/>
            <path d="M8 6v3.2M8 11.2h.01" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
          </svg>
          <div className="psm-conn-note-body">
            <strong>Requires LAN-only mode with Developer Mode enabled.</strong>
            <span> On the printer, turn on <em>LAN Only Mode</em> and <em>Developer Mode</em> before connecting — n3o can't reach it over the cloud.</span>
          </div>
        </div>
      )}
    </div>
  );
}

function GcodeSection({ kind, value, onChange, changed = false }) {
  const help = kind === "start"
    ? "Runs before the first layer — homing, heating, purge line. Use [bed_temp], [nozzle_temp], [first_layer_temp] etc as placeholders."
    : "Runs after the last layer — cool down, park, retract. Avoid moves that crash into the print.";
  return (
    <div className="psm-section">
      <div className={`psm-field ${changed ? "changed" : ""}`}>
        <label htmlFor={`psm-gcode-${kind}`}>{kind === "start" ? "Start G-code" : "End G-code"}</label>
        <textarea
          id={`psm-gcode-${kind}`}
          className="psm-gcode"
          value={value}
          onChange={(e) => onChange(e.target.value)}
          spellCheck={false}
          rows={14}
          placeholder={kind === "start"
            ? "G28 ; home all axes\nG29 ; auto bed level\n…"
            : "M104 S0 ; turn off nozzle\nM140 S0 ; turn off bed\n…"}
        />
        <div className="apm-name-hint">{help}</div>
      </div>
    </div>
  );
}

function LimitsSection({ limits, setLimit, changed = {} }) {
  const fields = [
    { group: "Max feedrate", items: [
      { k: "feedrateX",   label: "X axis", unit: "mm/s" },
      { k: "feedrateY",   label: "Y axis", unit: "mm/s" },
      { k: "feedrateZ",   label: "Z axis", unit: "mm/s" },
      { k: "feedrateE",   label: "Extruder", unit: "mm/s" },
    ]},
    { group: "Motion", items: [
      { k: "acceleration",label: "Max accel", unit: "mm/s²" },
      { k: "jerk",        label: "Max jerk",  unit: "mm/s"  },
    ]},
    { group: "Layer height", items: [
      { k: "minLayer",    label: "Min layer", unit: "mm" },
      { k: "maxLayer",    label: "Max layer", unit: "mm" },
    ]},
  ];

  return (
    <div className="psm-section">
      {fields.map(group => (
        <div className="psm-limit-group" key={group.group}>
          <div className="psm-limit-group-label">{group.group}</div>
          <div className="psm-limit-grid">
            {group.items.map(item => (
              <div className={`psm-limit-cell ${changed[item.k] ? "changed" : ""}`} key={item.k}>
                <label htmlFor={`psm-l-${item.k}`}>{item.label}</label>
                <div className="psm-limit-input">
                  <input
                    id={`psm-l-${item.k}`}
                    type="number"
                    value={limits[item.k] ?? ""}
                    step={item.k.startsWith("minLayer") || item.k.startsWith("maxLayer") ? "0.01" : "1"}
                    onChange={(e) => {
                      const v = e.target.value;
                      setLimit(item.k, v === "" ? null : Number(v));
                    }}
                  />
                  <span className="psm-limit-unit">{item.unit}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
      <div className="apm-name-hint" style={{ marginTop: 8 }}>
        These caps clip slicer-generated G-code so nothing exceeds your machine's safe envelope.
      </div>
    </div>
  );
}

window.PrinterSettingsModal = PrinterSettingsModal;

</script>
<script type="text/babel" data-source="PrintersEmptyState.jsx">

            <path d="M22 24 L8 16 L8 28 L22 36 Z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" opacity="0.3"/>
