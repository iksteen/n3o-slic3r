<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>SVG preview</title>
<style>
  html,body{margin:0;height:100%;display:grid;place-items:center;background:#222633;}
  .frame{width:500px;height:500px;}
</style>
</head>
<body>
<div class="frame">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#0f0f15"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d5e"/>
      <stop offset="100%" stop-color="#ff1f3a"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="40"/>
  <circle cx="250" cy="250" r="160" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="10 15 80 15 10 15 160 15" opacity="0.4" transform="rotate(-45 250 250)"/>
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="5 10" opacity="0.2"/>
  <g id="geometry-mesh" transform="translate(0, 30)">
    <path d="M 160 230 L 210 230 L 226 205 L 276 280 L 340 280" fill="none" stroke="url(#neonRed)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowRed)"/>
    <path d="M 160 195 L 210 195 L 226 170 L 276 245 L 340 245" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 160 160 L 210 160 L 226 135 L 276 210 L 340 210" fill="none" stroke="url(#neonCyan)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
  </g>
</svg>
</div>
</body>
</html>
