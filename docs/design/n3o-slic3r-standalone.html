<style data-source="styles.css">
/* Lattice slicer — design tokens & global styles */

:root {
  --bg:           #FBFBFC;
  --surface:      #FFFFFF;
  --surface-2:    #F5F6F8;
  --surface-3:    #EEF0F3;
  --border:       rgba(15, 17, 21, 0.08);
  --border-strong:rgba(15, 17, 21, 0.14);
  --hairline:     rgba(15, 17, 21, 0.05);
  --text:         #0F1115;
  --text-muted:   #5A6270;
  --text-dim:     #9AA0AA;
  --accent:       oklch(0.62 0.19 235);
  --accent-soft:  oklch(0.96 0.04 235);
  --accent-text:  oklch(0.42 0.18 235);
  --warn:         oklch(0.68 0.16 60);
  --warn-soft:    oklch(0.97 0.05 70);
  --danger:       oklch(0.62 0.21 25);
  --danger-soft:  oklch(0.97 0.04 25);
  --ok:           oklch(0.62 0.14 155);
  --shadow-sm:    0 1px 0 rgba(15,17,21,0.04), 0 1px 2px rgba(15,17,21,0.04);
  --shadow-md:    0 1px 0 rgba(15,17,21,0.04), 0 4px 12px rgba(15,17,21,0.06);
  --shadow-lg:    0 12px 32px rgba(15,17,21,0.10), 0 1px 0 rgba(15,17,21,0.04);
  --radius-sm:    4px;
  --radius:       6px;
  --radius-lg:    10px;
  --radius-xl:    14px;
  --font-sans:    "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-mono:    "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

[data-theme="dark"] {
  --bg:           #0E1014;
  --surface:      #15181D;
  --surface-2:    #1B1F25;
  --surface-3:    #232830;
  --border:       rgba(255, 255, 255, 0.08);
  --border-strong:rgba(255, 255, 255, 0.16);
  --hairline:     rgba(255, 255, 255, 0.05);
  --text:         #E6E9EE;
  --text-muted:   #9AA1AE;
  --text-dim:     #5C6471;
  --accent:       oklch(0.72 0.17 235);
  --accent-soft:  oklch(0.30 0.10 235);
  --accent-text:  oklch(0.82 0.12 235);
  --warn-soft:    oklch(0.30 0.10 60);
  --danger-soft:  oklch(0.30 0.10 25);
}

/* Accent themes */
[data-accent="ember"]  { --accent: oklch(0.65 0.19 35);  --accent-soft: oklch(0.96 0.04 35);  --accent-text: oklch(0.46 0.18 35); }
[data-accent="violet"] { --accent: oklch(0.60 0.21 295); --accent-soft: oklch(0.96 0.04 295); --accent-text: oklch(0.42 0.20 295); }
[data-accent="mint"]   { --accent: oklch(0.62 0.15 165); --accent-soft: oklch(0.96 0.04 165); --accent-text: oklch(0.42 0.15 165); }

* { box-sizing: border-box; }
html, body, #app { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button { font-family: inherit; }
input, select, textarea { font-family: inherit; }

::selection { background: var(--accent-soft); color: var(--accent-text); }

/* ───────── Layout ───────── */
.app {
  display: grid;
  grid-template-rows: 48px 38px 1fr 24px;
  height: 100vh;
}
.workspace {
  display: grid;
  grid-template-columns: 240px 1fr 420px;
  min-height: 0;
  overflow: hidden;
}
@media (max-width: 1400px) {
  .workspace { grid-template-columns: 220px 1fr 380px; }
}

/* ───────── Plate Tabs ───────── */
.plate-tabs {
  display: flex; align-items: stretch;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  padding: 0 8px;
  gap: 0;
  overflow: hidden;
}
.plate-tabs-scroll {
  display: flex; align-items: stretch;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  overflow-y: visible;
  gap: 1px;
  scrollbar-width: none;
}
.plate-tabs-scroll::-webkit-scrollbar { display: none; }

.plate-tab {
  position: relative;
  display: inline-flex; align-items: center;
  gap: 8px;
  padding: 0 8px 0 10px;
  height: 100%;
  min-width: 0;
  background: transparent;
  border: 0;
  border-right: 1px solid var(--hairline);
  color: var(--text-muted);
  font-size: 12px;
  cursor: default;
  flex-shrink: 0;
}
.plate-tab:first-child { border-left: 1px solid var(--hairline); }
.plate-tab:hover {
  background: var(--surface);
  color: var(--text);
}
.plate-tab.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 0 var(--surface);
  z-index: 1;
}
.plate-tab.active::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--accent);
}
.plate-tab-icon {
  display: inline-flex;
  color: var(--text-dim);
  flex-shrink: 0;
}
.plate-tab.active .plate-tab-icon { color: var(--accent-text); }
.plate-tab-name {
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  user-select: none;
}
.plate-tab-rename-input {
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 3px;
  font: inherit;
  color: var(--text);
  padding: 1px 4px;
  width: 130px;
  outline: 0;
}
.plate-tab-divider {
  width: 1px; height: 16px;
  background: var(--hairline);
  flex-shrink: 0;
}
.plate-tab-printer-display {
  display: inline-flex; align-items: center;
  padding: 3px 6px;
  color: var(--text-muted);
  font-size: 11.5px;
  font-family: var(--font-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
  flex-shrink: 0;
}
.plate-tab.active .plate-tab-printer-display { color: var(--text); }
.plate-tab-meta {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.plate-tab-close {
  width: 18px; height: 18px;
  border: 0; background: transparent;
  border-radius: 3px;
  color: var(--text-dim);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: default;
  opacity: 0;
  transition: opacity 100ms;
  flex-shrink: 0;
}
.plate-tab:hover .plate-tab-close,
.plate-tab.active .plate-tab-close { opacity: 1; }
.plate-tab-close:hover { background: var(--surface-3); color: var(--text); }

.plate-tab-add {
  display: inline-flex; align-items: center;
  gap: 5px;
  padding: 0 12px;
  background: transparent;
  border: 0;
  border-left: 1px solid var(--hairline);
  color: var(--text-muted);
  font-size: 12px;
  cursor: default;
  white-space: nowrap;
}
.plate-tab-add:hover {
  background: var(--surface);
  color: var(--text);
}

/* Printer assign menu (popover) */
.plate-tab-printer-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  padding: 4px;
  z-index: 50;
  min-width: 260px;
  display: flex; flex-direction: column;
  gap: 1px;
}
.ptpm-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 6px 8px 4px;
}
.ptpm-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 8px;
  background: transparent;
  border: 0;
  border-radius: 5px;
  color: var(--text);
  cursor: default;
  text-align: left;
  gap: 8px;
}
.ptpm-item:hover { background: var(--surface-2); }
.ptpm-item.active {
  background: var(--accent-soft);
  color: var(--accent-text);
}
.ptpm-name { font-size: 12.5px; font-weight: 500; }
.ptpm-detail {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
}
.ptpm-item.active .ptpm-detail { color: var(--accent-text); opacity: 0.85; }

/* ───────── Top Bar ───────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-right: 6px;
  font-size: 14px;
}
.brand-mark {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--text);
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.brand-mark::after {
  content: ""; position: absolute;
  inset: 4px;
  background:
    repeating-linear-gradient(45deg, transparent 0 2px, var(--bg) 2px 3px);
  border-radius: 2px;
}
.brand-divider { width: 1px; height: 22px; background: var(--border); margin: 0 6px; }

.layer-chips {
  display: flex; gap: 4px; align-items: center;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
}
.layer-chips.profile-chips {
  background: transparent;
  border: 0;
  padding: 0;
  gap: 2px;
}
.profile-chip {
  cursor: default;
}
.profile-chip:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border);
}
.profile-chevron {
  color: var(--text-dim);
  font-size: 13px;
  margin: 0 1px;
  user-select: none;
}
.layer-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px 4px 8px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: default;
  white-space: nowrap;
}
.layer-chip:hover { background: var(--surface); color: var(--text); }
.layer-chip.active {
  background: var(--surface);
  border-color: var(--border);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.layer-chip-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: hsl(var(--layer-hue) 70% 55%);
  box-shadow: 0 0 0 2px hsl(var(--layer-hue) 85% 90% / 0.7);
}
[data-theme="dark"] .layer-chip-dot {
  box-shadow: 0 0 0 2px hsl(var(--layer-hue) 40% 25% / 0.7);
}
.layer-chip-name { font-weight: 500; }
.layer-chip-detail { color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; }

.tb-spacer { flex: 1; }
.tb-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--text);
  cursor: default;
}
.tb-btn:hover { background: var(--surface-2); }
.tb-btn.primary {
  background: var(--text); color: var(--bg);
  border-color: var(--text);
  font-weight: 500;
  padding: 0 14px 0 12px;
}
.tb-btn.primary:hover { background: oklch(from var(--text) calc(l + 0.08) c h); }
.tb-btn .kbd {
  font-family: var(--font-mono);
  font-size: 10.5px;
  opacity: 0.6;
  margin-left: 4px;
}

/* ───────── Objects Panel ───────── */
.objects-panel {
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex; flex-direction: column;
  min-height: 0;
}
.panel-head {
  padding: 12px 14px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.panel-head h3 {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.icon-btn {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 4px;
  color: var(--text-muted);
  cursor: default;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }

.object-list { padding: 4px 6px; flex: 1; overflow-y: auto; min-height: 0; }
.object-item {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 6px;
  cursor: default;
  position: relative;
}
.object-item:hover { background: var(--surface-2); }
.object-item.selected {
  background: var(--accent-soft);
  outline: 1px solid color-mix(in oklch, var(--accent) 25%, transparent);
}
.object-thumb {
  width: 28px; height: 28px;
  border-radius: 5px;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
}
.object-name {
  font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.object-meta {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
}
.object-color-tag {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
  vertical-align: middle;
}
.object-overrides {
  background: oklch(from var(--accent) 0.95 0.04 h);
  color: var(--accent-text);
  font-family: var(--font-mono);
  font-size: 9.5px;
  padding: 1px 5px;
  border-radius: 8px;
  border: 1px solid color-mix(in oklch, var(--accent) 20%, transparent);
}
[data-theme="dark"] .object-overrides {
  background: oklch(from var(--accent) 0.30 0.10 h);
}

.add-menu {
  border-top: 1px solid var(--hairline);
  padding: 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.add-menu-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 8px;
  border-radius: 5px;
  cursor: default;
  font-size: 12.5px;
  color: var(--text);
  background: transparent;
  border: 0;
  text-align: left;
}
.add-menu-item:hover { background: var(--surface-2); }
.add-menu-item .meta { color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; }
.add-section-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-dim);
  padding: 8px 8px 4px;
}

/* Plate stats footer */
.plate-stats {
  border-top: 1px solid var(--hairline);
  padding: 10px 14px 12px;
  display: grid; gap: 6px;
}
.plate-stat-row {
  display: flex; justify-content: space-between; font-size: 11.5px;
}
.plate-stat-row .k { color: var(--text-dim); }
.plate-stat-row .v { font-family: var(--font-mono); color: var(--text); }

/* ───────── Viewport ───────── */
.viewport {
  position: relative;
  background:
    radial-gradient(circle at 50% 35%, oklch(0.99 0.005 235) 0%, var(--bg) 60%);
  overflow: hidden;
}
[data-theme="dark"] .viewport {
  background:
    radial-gradient(circle at 50% 35%, oklch(0.20 0.02 235) 0%, var(--bg) 60%);
}
.viewport canvas { display: block; }

.viewport-toolbar {
  position: absolute;
  top: 12px; left: 12px;
  display: flex; gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 3px;
  box-shadow: var(--shadow-sm);
}
.vp-tool {
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: transparent;
  border-radius: 4px;
  color: var(--text-muted);
  cursor: default;
}
.vp-tool:hover { background: var(--surface-2); color: var(--text); }
.vp-tool.active { background: var(--accent-soft); color: var(--accent-text); }
.vp-tool svg { width: 14px; height: 14px; }
.vp-sep { width: 1px; background: var(--border); margin: 4px 2px; }

.viewport-corner {
  position: absolute;
  bottom: 12px; right: 12px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
  pointer-events: none;
}
.viewport-corner .axes {
  display: flex; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  box-shadow: var(--shadow-sm);
}
.viewport-corner .axis { display: flex; align-items: center; gap: 4px; }
.axis-x { color: oklch(0.62 0.21 25); }
.axis-y { color: oklch(0.62 0.18 145); }
.axis-z { color: oklch(0.62 0.18 235); }

.gizmo-hint {
  position: absolute;
  bottom: 12px; left: 12px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
  padding: 4px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: var(--shadow-sm);
}

/* Drag-target highlight when dragging from object library */
.viewport.drop-target::before {
  content: "Drop to add to plate";
  position: absolute;
  inset: 16px;
  border: 2px dashed color-mix(in oklch, var(--accent) 70%, transparent);
  border-radius: 12px;
  background: color-mix(in oklch, var(--accent) 8%, transparent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 500;
  color: var(--accent-text);
  z-index: 5;
  pointer-events: none;
}

/* ───────── Settings Panel ───────── */
.settings-panel {
  border-left: 1px solid var(--border);
  background: var(--surface);
  display: grid;
  grid-template-rows: auto auto auto auto 1fr;
  min-height: 0;
}

.sp-config {
  display: flex; flex-direction: column;
  gap: 6px;
  padding: 10px 12px 8px;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
}
.sp-config-row {
  display: flex; flex-wrap: wrap;
  gap: 4px;
  align-items: center;
}
.sp-config-filaments {
  padding-top: 4px;
  border-top: 1px dashed var(--hairline);
  margin-top: 2px;
}
.config-row-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-right: 4px;
  align-self: center;
}
.config-chip {
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  padding: 6px 8px 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-size: 12px;
  cursor: default;
  flex: 1 1 0;
  min-width: 0;
  text-align: left;
}
.config-chip-wrap {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  display: flex;
}
.config-chip-wrap > .config-chip { width: 100%; flex: 1 1 0; }

.printer-picker-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  padding: 4px;
  z-index: 60;
  min-width: 280px;
  display: flex; flex-direction: column;
  gap: 1px;
}
.config-chip:hover {
  background: var(--surface-2);
  border-color: var(--border-strong);
}
.config-chip-top {
  display: flex; align-items: center; gap: 5px;
  width: 100%;
}
.config-chip-top .chev {
  margin-left: auto;
}
.config-chip .chip-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: hsl(var(--chip-hue) 70% 55%);
  flex-shrink: 0;
}
.config-chip .chip-label {
  font-size: 9.5px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  flex-shrink: 0;
}
.config-chip .chip-value {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
  display: block;
}

.filament-chip {
  display: inline-flex; align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 6px 0 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 11.5px;
  cursor: default;
}
.filament-chip:hover {
  background: var(--surface-2);
  border-color: var(--border-strong);
}
.fil-swatch {

.search-wrap {

}

.search-mode {

}

/* category jump rail + scrolling list */
.settings-body {

}
.cat-rail {

}
.cat-rail-item {
  position: relative;
  display: grid;
  grid-template-columns: 22px 1fr 28px;
  align-items: center;
  gap: 4px;
  width: 140px;
  padding: 5px 10px 5px 8px;
  background: transparent;
  border: 0;

}
.cat-rail-item:hover { background: var(--surface-2); color: var(--text); }

}
.cat-rail-item.active::before {

}

}
.cat-rail-count {

  font-size: 10px;
  color: var(--text-dim);

}
.cat-rail-divider {

}

.settings-scroll {

}
.settings-scroll::-webkit-scrollbar { width: 10px; }
.settings-scroll::-webkit-scrollbar-thumb {

.cat-group { border-bottom: 1px solid var(--hairline); }
.cat-header {

}

/* ───────── Setting Row ───────── */
.set-row {
  display: grid;
  grid-template-columns: 1fr 150px;
  align-items: center;
  gap: 8px;
  padding: 7px 14px 7px 14px;
  position: relative;
  /* Left rule is HIDDEN by default; revealed on hover so origin is consultable but not noisy */
  box-shadow: inset 3px 0 0 0 transparent;
  transition: box-shadow 120ms, background 120ms;
}
.set-row:hover {
  background: var(--surface-2);
  box-shadow: inset 3px 0 0 0 hsl(var(--row-hue) 70% 55%);
}
[data-theme="dark"] .set-row:hover {
  box-shadow: inset 3px 0 0 0 hsl(var(--row-hue) 60% 60%);
}

/* Project-level override — soft violet tint + bold name */
.set-row.authored-project {
  background: hsl(var(--proj-hue) 90% 97.5%);
}
.set-row.authored-project:hover {
  background: hsl(var(--proj-hue) 88% 96%);
}
.set-row.authored-project .set-name {
  font-weight: 600;
  color: var(--text);
}
[data-theme="dark"] .set-row.authored-project {
  background: hsl(var(--proj-hue) 25% 16%);
}
[data-theme="dark"] .set-row.authored-project:hover {
  background: hsl(var(--proj-hue) 30% 19%);
}

/* Object-level override — soft rose tint + bold name, wins over project tint */
.set-row.authored-object {
  background: hsl(var(--obj-hue) 90% 97.5%);
}
.set-row.authored-object:hover {
  background: hsl(var(--obj-hue) 88% 96%);
}
.set-row.authored-object .set-name {
  font-weight: 600;
  color: var(--text);
}
[data-theme="dark"] .set-row.authored-object {
  background: hsl(var(--obj-hue) 25% 16%);
}
[data-theme="dark"] .set-row.authored-object:hover {
  background: hsl(var(--obj-hue) 30% 19%);
}

/* When overridden, the hover rule reads brighter */
.set-row.overridden:hover {
  box-shadow: inset 4px 0 0 0 hsl(var(--row-hue) 70% 50%);
}
.set-row.has-conflict { background: oklch(from var(--warn) 0.98 0.03 h); }
[data-theme="dark"] .set-row.has-conflict { background: oklch(from var(--warn) 0.20 0.06 h); }
.set-row.has-conflict:hover { background: oklch(from var(--warn) 0.96 0.04 h); }
[data-theme="dark"] .set-row.has-conflict:hover { background: oklch(from var(--warn) 0.24 0.07 h); }

.set-meta { min-width: 0; display: flex; align-items: center; gap: 6px; }
.set-name {
  font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.set-source-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.02em;
  font-weight: 500;
  padding: 1px 5px 1px 4px;
  border-radius: 8px;
  background: hsl(var(--row-hue) 80% 96%);
  color: hsl(var(--row-hue) 60% 28%);
  border: 1px solid hsl(var(--row-hue) 70% 88%);
  flex-shrink: 0;
  cursor: default;
}
[data-theme="dark"] .set-source-chip {
  background: hsl(var(--row-hue) 30% 18%);
  color: hsl(var(--row-hue) 60% 75%);
  border-color: hsl(var(--row-hue) 30% 28%);
}
.set-source-chip .chip-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: hsl(var(--row-hue) 65% 50%);
}
.set-source-chip.conflict {
  background: var(--warn-soft);
  color: oklch(0.36 0.12 60);
  border-color: oklch(0.85 0.08 60);
}

/* Breadcrumb mode (alt accountability) */
.set-breadcrumb {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--text-dim);
  margin-left: 4px;
}
.set-breadcrumb .crumb {
  padding: 1px 4px; border-radius: 3px;
  background: hsl(var(--crumb-hue) 80% 96%);
  color: hsl(var(--crumb-hue) 60% 32%);
  border: 1px solid hsl(var(--crumb-hue) 70% 90%);
}
.set-breadcrumb .crumb.muted { background: var(--surface-2); border-color: var(--hairline); color: var(--text-dim); }
.set-breadcrumb .arrow { color: var(--text-dim); }

/* Input controls */
.set-value {
  display: flex; align-items: center; justify-content: flex-end; gap: 4px;
}
.val-input {
  width: 100%;
  text-align: right;
  height: 26px;
  padding: 0 28px 0 8px;
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text);
  outline: 0;
  transition: border-color 100ms, background 100ms, box-shadow 100ms;
}
.val-input:hover { border-color: var(--border); background: var(--surface); }
.val-input:focus {
  border-color: color-mix(in oklch, var(--accent) 50%, var(--border));
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 12%, transparent);
}
.val-wrap {
  position: relative; width: 100%;
}
.val-unit {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
  pointer-events: none;
}
.val-select {
  width: 100%;
  height: 26px;
  padding: 0 24px 0 8px;
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text);
  appearance: none;
  outline: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 12 12'><path fill='none' stroke='%239AA0AA' stroke-width='1.5' d='M3 5l3 3 3-3'/></svg>");
  background-repeat: no-repeat;
  background-position: right 6px center;
}
.val-select:hover { border-color: var(--border); }
.val-toggle {
  position: relative;
  width: 32px; height: 18px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: default;
  transition: background 120ms;
}
.val-toggle::after {
  content: "";
  position: absolute;
  top: 1px; left: 1px;
  width: 14px; height: 14px;
  background: white;
  border-radius: 50%;
  box-shadow: var(--shadow-sm);
  transition: transform 120ms;
}
.val-toggle.on {
  background: var(--accent);
  border-color: transparent;
}
.val-toggle.on::after { transform: translateX(14px); }
.val-toggle-wrap { width: 100%; display: flex; justify-content: flex-end; padding-right: 4px; }

/* ───────── Cascade ladder (hover, portal'd to body) ───────── */
.cascade-ladder {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 8px;
  box-shadow: var(--shadow-lg);
  min-width: 220px;
  max-width: 250px;
  z-index: 100;
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text);
}
.ladder-title {
  font-size: 10.5px;
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0 4px 6px;
  border-bottom: 1px solid var(--hairline);
  margin-bottom: 4px;
}
.ladder-row {
  display: grid;
  grid-template-columns: 12px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 4px 6px;
  border-radius: 4px;
  font-size: 11.5px;
  position: relative;
}
.ladder-row + .ladder-row { margin-top: 1px; }
.ladder-row .l-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: hsl(var(--row-hue) 70% 55%);
}
.ladder-row .l-dot.empty {
  background: transparent;
  border: 1px dashed var(--border-strong);
}
.ladder-row .l-name { color: var(--text-muted); }
.ladder-row.winner .l-name { color: var(--text); font-weight: 500; }
.ladder-row .l-val {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text);
}
.ladder-row .l-val.muted { color: var(--text-dim); }
.ladder-row.overridden .l-val { text-decoration: line-through; opacity: 0.55; }
.ladder-row.empty .l-name,
.ladder-row.empty .l-val { color: var(--text-dim); }
.ladder-row.winner {
  background: hsl(var(--row-hue) 80% 96%);
}
[data-theme="dark"] .ladder-row.winner {
  background: hsl(var(--row-hue) 30% 20%);
}

.ladder-actions {
  border-top: 1px solid var(--hairline);
  margin-top: 6px;
  padding-top: 6px;
  display: flex; gap: 4px;
}
.ladder-action {
  flex: 1;
  font-size: 11px;
  padding: 4px 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-muted);
  cursor: default;
}
.ladder-action:hover { background: var(--surface-3); color: var(--text); }
.ladder-action.primary { background: var(--accent); color: white; border-color: transparent; }
.ladder-action.primary:hover { background: oklch(from var(--accent) calc(l - 0.05) c h); color: white; }

/* objects-override badge — present on Project tab when 1+ objects override the row */
.objs-badge {
  display: inline-flex; align-items: center;
  gap: 5px;
  padding: 1px 5px 1px 4px;
  border-radius: 9px;
  background: hsl(var(--obj-hue) 90% 96%);
  border: 1px solid hsl(var(--obj-hue) 70% 85%);
  color: hsl(var(--obj-hue) 60% 30%);
  font-size: 10.5px;
  font-family: var(--font-mono);
  cursor: default;
  flex-shrink: 0;
}
[data-theme="dark"] .objs-badge {
  background: hsl(var(--obj-hue) 30% 18%);
  border-color: hsl(var(--obj-hue) 30% 28%);
  color: hsl(var(--obj-hue) 60% 75%);
}
.objs-badge svg { opacity: 0.75; }
.objs-badge-dots {
  display: inline-flex; align-items: center;
  gap: 2px;
}
.objs-badge-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.15) inset, 0 0 0 1px white;
}
[data-theme="dark"] .objs-badge-dot {
  box-shadow: 0 0 0 1px rgba(255,255,255,0.2) inset, 0 0 0 1px var(--surface);
}
.objs-badge-more {
  font-size: 9.5px;
  font-family: var(--font-mono);
  margin-left: 1px;
  opacity: 0.7;
}

/* ladder: per-object overrides section */
.ladder-section-title {
  display: flex; align-items: center; gap: 5px;
  font-size: 10.5px;
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 6px 4px 4px;
  margin-top: 4px;
  border-top: 1px solid var(--hairline);
}
.ladder-section-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
}
.ladder-row.obj-row {
  grid-template-columns: 12px 1fr auto;
}
.ladder-row.obj-row .l-name {
  font-size: 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0;
}
.ladder-row.obj-row.winner {
  background: hsl(var(--row-hue) 80% 94%);
  outline: 1px solid hsl(var(--row-hue) 70% 80%);
}
[data-theme="dark"] .ladder-row.obj-row.winner {
  background: hsl(var(--row-hue) 30% 22%);
  outline-color: hsl(var(--row-hue) 30% 30%);
}

/* ───────── Status bar ───────── */
.statusbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 14px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 10.5px;
}
.statusbar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.statusbar .spacer { flex: 1; }

/* ───────── Misc ───────── */
.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
}
.kbd-inline {
  font-family: var(--font-mono);
  font-size: 10.5px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 4px;
  color: var(--text-muted);
}
.dim { color: var(--text-dim); }
.muted { color: var(--text-muted); }

/* override action when row has user input */
.set-row .reset-btn {
  position: absolute;
  right: 156px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px; height: 18px;
  border-radius: 4px;

  border: 0;

/* small banner inside settings panel */
.sp-banner {
  margin: 8px 12px 0;
  padding: 8px 10px;
  background: oklch(from var(--accent) 0.97 0.03 h);
  border: 1px solid color-mix(in oklch, var(--accent) 25%, transparent);
  border-radius: 6px;
  font-size: 11.5px;
  color: var(--accent-text);
  display: flex; align-items: center; gap: 6px;
}
[data-theme="dark"] .sp-banner { background: oklch(from var(--accent) 0.22 0.08 h); }

/* ───────── Drag preview ───────── */
.drag-preview {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  box-shadow: var(--shadow-lg);
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text);
  transform: translate(-50%, -50%);
}

// data.jsx — cascade layers + categories + settings model.
// Each setting carries a `cascade` object with values at zero or more layers.
// The "active" value is whichever layer is highest-priority and defined.

// Cascade layers in priority order (low → high). Phases:
//   Authored (specificity-and-source-order within): default → printer → build_plate → filament
//   Absolute overrides (CSS-!important style, higher tiers beat lower): user → project → object
// The mockup uses a simple "highest defined wins" walk; the real resolver
// does proper two-phase resolution per docs/profiles.md.
const CASCADE_LAYERS = [
  { id: "default",     label: "Defaults",    short: "DEF", hue: 220, desc: "Shipped baseline values" },
  { id: "printer",     label: "Printer",     short: "PRN", hue: 18,  desc: "Mechanical limits, kinematics, dimensions, toolhead+nozzle context" },
  { id: "build_plate", label: "Build plate", short: "PLT", hue: 95,  desc: "Plate surface and temperatures" },
  { id: "filament",    label: "Filament",    short: "FIL", hue: 175, desc: "Material chemistry, temps, retract" },
  { id: "user",        label: "Profile",     short: "USR", hue: 235, desc: "Personal defaults across projects (override tier)" },
  { id: "project",     label: "Project",     short: "PRJ", hue: 285, desc: "This .3mf file (override tier — beats user)" },
  { id: "object",      label: "Object",      short: "OBJ", hue: 340, desc: "Per-mesh overrides (override tier — beats project)" },
];

const LAYER_BY_ID = Object.fromEntries(CASCADE_LAYERS.map(l => [l.id, l]));
const LAYER_INDEX = Object.fromEntries(CASCADE_LAYERS.map((l, i) => [l.id, i]));

// Resolve the active value of a setting from its cascade.
function resolveValue(setting) {
  for (let i = CASCADE_LAYERS.length - 1; i >= 0; i--) {
    const id = CASCADE_LAYERS[i].id;
    if (setting.cascade[id] !== undefined && setting.cascade[id] !== null) {
      return { value: setting.cascade[id], layer: id };
    }
  }
  return { value: setting.default, layer: "default" };
}

// Detect a conflict: object overrides project (or any higher layer overrides lower).
// Returns the list of layers that are being overridden.
function getOverriddenLayers(setting) {
  const defined = CASCADE_LAYERS
    .filter(l => setting.cascade[l.id] !== undefined && setting.cascade[l.id] !== null)
    .map(l => l.id);
  if (defined.length <= 1) return [];
  return defined.slice(0, -1); // all but the winning layer
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-source="BuildPlate.jsx">
// BuildPlate.jsx — three.js viewport for the slicer.
// Renders a build plate with grid, drag-arrangeable primitive meshes,
// and orbit controls. Selection syncs with parent via props.

const { useEffect, useRef, useState, useMemo } = React;

// Geometry factory for our object library
function makeGeometry(THREE, kind, params = {}) {
  switch (kind) {
    case "cube":
      return new THREE.BoxGeometry(params.size || 20, params.size || 20, params.size || 20);
    case "cylinder":
      return new THREE.CylinderGeometry(params.r || 12, params.r || 12, params.h || 30, 48);
    case "sphere":
      return new THREE.SphereGeometry(params.r || 14, 32, 24);
    case "cone":
      return new THREE.ConeGeometry(params.r || 14, params.h || 30, 32);
    case "torus":
      return new THREE.TorusGeometry(params.r || 12, params.tube || 4, 16, 48);
    case "benchy": {
      // crude "boat-shaped" placeholder hull (not the copyrighted geometry)
      const shape = new THREE.Shape();
      shape.moveTo(-30, -10);
      shape.lineTo(30, -10);
      shape.lineTo(25, 8);
      shape.lineTo(-25, 8);
      shape.lineTo(-30, -10);
      const geom = new THREE.ExtrudeGeometry(shape, { depth: 18, bevelEnabled: true, bevelSize: 1.5, bevelThickness: 1, bevelSegments: 2 });
      geom.rotateX(-Math.PI / 2);
      geom.translate(0, 0, 0);
      return geom;
    }
    case "calicube": {
      const g = new THREE.BoxGeometry(20, 20, 20);
      return g;
    }
    case "temptower": {
      const merged = new THREE.BufferGeometry();
      // approximate via stacked boxes — we just return a tall box; segments drawn via shader would be fancier
      return new THREE.BoxGeometry(28, 80, 18);
    }
    case "stl_mount":
      return new THREE.BoxGeometry(45, 12, 30);
    case "stl_bracket":
      return new THREE.BoxGeometry(36, 28, 8);
    default:
      return new THREE.BoxGeometry(20, 20, 20);
  }
}

function BuildPlate({
  objects, setObjects,
  selectedId, setSelectedId,
  plateSize, // [x, y]
  filaments,
  onCameraReset,
}) {
  const mountRef = useRef(null);
  const stateRef = useRef({});
  const [draggingId, setDraggingId] = useState(null);

  // Setup once
  useEffect(() => {
    if (!window.THREE) return;
    const THREE = window.THREE;
    const mount = mountRef.current;
    if (!mount) return;

    const scene = new THREE.Scene();
    scene.background = null;

    const w = mount.clientWidth || 800;
    const h = mount.clientHeight || 600;

    const camera = new THREE.PerspectiveCamera(40, w / h, 1, 4000);
    camera.position.set(280, 260, 320);
    camera.lookAt(0, 30, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    mount.appendChild(renderer.domElement);

    // Lights
    const hemi = new THREE.HemisphereLight(0xffffff, 0xe6e8ec, 0.6);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(120, 220, 80);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    dir.shadow.camera.left = -200;
    dir.shadow.camera.right = 200;
    dir.shadow.camera.top = 200;
    dir.shadow.camera.bottom = -200;
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0xffffff, 0.25);
    fill.position.set(-200, 100, -120);
    scene.add(fill);

    // Build plate (group)
    const plateGroup = new THREE.Group();
    scene.add(plateGroup);

    const buildPlate = (sizeX, sizeY) => {
      while (plateGroup.children.length) plateGroup.remove(plateGroup.children[0]);

      // Base plate
      const plateGeom = new THREE.BoxGeometry(sizeX, 4, sizeY);
      const plateMat = new THREE.MeshStandardMaterial({
        color: 0x1f2228,
        roughness: 0.85,
        metalness: 0.05,
      });
      const plate = new THREE.Mesh(plateGeom, plateMat);
      plate.position.y = -2;
      plate.receiveShadow = true;
      plateGroup.add(plate);

      // Bevel edge — thin lighter cap
      const capGeom = new THREE.BoxGeometry(sizeX, 0.4, sizeY);
      const capMat = new THREE.MeshStandardMaterial({ color: 0x2a2e36, roughness: 0.7 });
      const cap = new THREE.Mesh(capGeom, capMat);
      cap.position.y = 0.21;
      plateGroup.add(cap);

      // Grid
      const grid = new THREE.GridHelper(Math.max(sizeX, sizeY), Math.max(sizeX, sizeY) / 10, 0x4a505a, 0x35393f);
      grid.material.opacity = 0.5; grid.material.transparent = true;
      grid.position.y = 0.42;
      // crop to plate (we use scale trick — grid is square so we let it overflow, masked by plate edges? skip mask, use second grid)
      plateGroup.add(grid);

      // Plate outline
      const outlineGeom = new THREE.EdgesGeometry(plateGeom);
      const outlineMat = new THREE.LineBasicMaterial({ color: 0x6a727f });
      const outline = new THREE.LineSegments(outlineGeom, outlineMat);
      outline.position.y = -2;
      plateGroup.add(outline);

      // Origin marker
      const originGeom = new THREE.RingGeometry(2, 3, 16);
      const originMat = new THREE.MeshBasicMaterial({ color: 0xff5566, side: THREE.DoubleSide });
      const origin = new THREE.Mesh(originGeom, originMat);
      origin.rotation.x = -Math.PI / 2;
      origin.position.set(-sizeX / 2 + 5, 0.5, sizeY / 2 - 5);
      plateGroup.add(origin);

      // X/Y axis labels (just colored lines)
      const xAxisMat = new THREE.LineBasicMaterial({ color: 0xff5566 });
      const xAxisGeom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-sizeX / 2 + 2, 0.5, sizeY / 2 - 5),
        new THREE.Vector3(-sizeX / 2 + 22, 0.5, sizeY / 2 - 5),
      ]);
      plateGroup.add(new THREE.Line(xAxisGeom, xAxisMat));
      const yAxisMat = new THREE.LineBasicMaterial({ color: 0x66cc88 });
      const yAxisGeom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-sizeX / 2 + 2, 0.5, sizeY / 2 - 5),
        new THREE.Vector3(-sizeX / 2 + 2, 0.5, sizeY / 2 - 25),
      ]);
      plateGroup.add(new THREE.Line(yAxisGeom, yAxisMat));
    };

    buildPlate(plateSize[0], plateSize[1]);

    // Object group
    const objectGroup = new THREE.Group();
    scene.add(objectGroup);

    // Orbit controls (minimal hand-rolled, since we may not have OrbitControls)
    const ctrl = {
      rotating: false, panning: false,
      lastX: 0, lastY: 0,
      theta: Math.atan2(camera.position.x, camera.position.z),
      phi: Math.acos(camera.position.y / camera.position.length()),
      radius: camera.position.length(),
      target: new THREE.Vector3(0, 30, 0),
    };

    const applyCamera = () => {
      const sinPhi = Math.sin(ctrl.phi);
      camera.position.x = ctrl.target.x + ctrl.radius * sinPhi * Math.sin(ctrl.theta);
      camera.position.z = ctrl.target.z + ctrl.radius * sinPhi * Math.cos(ctrl.theta);
      camera.position.y = ctrl.target.y + ctrl.radius * Math.cos(ctrl.phi);
      camera.lookAt(ctrl.target);
    };
    applyCamera();

    // Raycaster for object selection + drag
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const dragOffset = new THREE.Vector3();
    let dragMesh = null;

    const getMouse = (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    };

    const intersectGround = () => {
      const target = new THREE.Vector3();
      raycaster.setFromCamera(mouse, camera);
      raycaster.ray.intersectPlane(dragPlane, target);
      return target;
    };

    const onPointerDown = (e) => {
      getMouse(e);
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objectGroup.children, false);
      if (e.button === 0 && intersects.length > 0) {
        const mesh = intersects[0].object;
        dragMesh = mesh;
        setSelectedId(mesh.userData.id);
        setDraggingId(mesh.userData.id);
        const ground = intersectGround();
        dragOffset.set(mesh.position.x - ground.x, 0, mesh.position.z - ground.z);
        renderer.domElement.style.cursor = "grabbing";
      } else if (e.button === 0) {
        setSelectedId(null);
        ctrl.rotating = true;
        ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
      } else if (e.button === 1 || e.button === 2) {
        ctrl.panning = true;
        ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
      }
    };
    const onPointerMove = (e) => {
      getMouse(e);
      if (dragMesh) {
        const ground = intersectGround();
        const halfX = plateSize[0] / 2;
        const halfY = plateSize[1] / 2;
        const newX = Math.max(-halfX, Math.min(halfX, ground.x + dragOffset.x));
        const newZ = Math.max(-halfY, Math.min(halfY, ground.z + dragOffset.z));
        dragMesh.position.x = newX;
        dragMesh.position.z = newZ;
        // sync to state
        setObjects(prev => prev.map(o =>
          o.id === dragMesh.userData.id ? { ...o, x: newX, y: newZ } : o
        ));
      } else if (ctrl.rotating) {
        const dx = e.clientX - ctrl.lastX;
        const dy = e.clientY - ctrl.lastY;
        ctrl.theta -= dx * 0.006;
        ctrl.phi -= dy * 0.006;
        ctrl.phi = Math.max(0.15, Math.min(Math.PI / 2 - 0.05, ctrl.phi));
        ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
        applyCamera();
      } else if (ctrl.panning) {
        const dx = e.clientX - ctrl.lastX;
        const dy = e.clientY - ctrl.lastY;
        // pan in world space
        const panSpeed = ctrl.radius * 0.0015;
        const right = new THREE.Vector3(Math.cos(ctrl.theta), 0, -Math.sin(ctrl.theta));
        const up = new THREE.Vector3(0, 1, 0);
        ctrl.target.addScaledVector(right, -dx * panSpeed);
        ctrl.target.addScaledVector(up, dy * panSpeed);
        ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
        applyCamera();
      } else {
        // hover: change cursor when over an object
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objectGroup.children, false);
        renderer.domElement.style.cursor = intersects.length > 0 ? "grab" : "default";
      }
    };
    const onPointerUp = (e) => {
      if (dragMesh) {
        dragMesh = null;
        setDraggingId(null);
        renderer.domElement.style.cursor = "default";
      }
      ctrl.rotating = false;
      ctrl.panning = false;
    };
    const onWheel = (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 1.1 : 0.9;
      ctrl.radius = Math.max(80, Math.min(900, ctrl.radius * delta));
      applyCamera();
    };
    const onContext = (e) => e.preventDefault();

    renderer.domElement.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    renderer.domElement.addEventListener("wheel", onWheel, { passive: false });
    renderer.domElement.addEventListener("contextmenu", onContext);

    // Resize
    const onResize = () => {
      const w = mount.clientWidth;
      const h = mount.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    const ro = new ResizeObserver(onResize);
    ro.observe(mount);

    // Animate
    let raf;
    const animate = () => {
      raf = requestAnimationFrame(animate);
      renderer.render(scene, camera);
    };
    animate();

    // expose
    stateRef.current = {
      THREE, scene, camera, renderer, plateGroup, objectGroup, ctrl, applyCamera, buildPlate,
    };

    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      renderer.domElement.removeEventListener("pointerdown", onPointerDown);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("pointerup", onPointerUp);
      renderer.domElement.removeEventListener("wheel", onWheel);
      renderer.domElement.removeEventListener("contextmenu", onContext);
      try { mount.removeChild(renderer.domElement); } catch {}
      renderer.dispose();
    };
  }, []);

  // Rebuild plate if size changes
  useEffect(() => {
    const s = stateRef.current;
    if (s && s.buildPlate) s.buildPlate(plateSize[0], plateSize[1]);
  }, [plateSize[0], plateSize[1]]);

  // Sync objects to scene
  useEffect(() => {
    const s = stateRef.current;
    if (!s || !s.THREE) return;
    const { THREE, objectGroup } = s;

    // Reconcile: remove meshes whose ids vanished
    const idsInState = new Set(objects.map(o => o.id));
    const meshesToRemove = [];
    objectGroup.children.forEach(m => {
      if (!idsInState.has(m.userData.id)) meshesToRemove.push(m);
    });
    meshesToRemove.forEach(m => objectGroup.remove(m));

    // Add or update
    objects.forEach(obj => {
      let mesh = objectGroup.children.find(m => m.userData.id === obj.id);
      const fil = filaments.find(f => f.id === obj.filamentId) || filaments[0];
      const color = new THREE.Color(fil.color || "#7AA2D9");
      const isSelected = obj.id === selectedId;
      const emissive = isSelected ? new THREE.Color("#FFFFFF").multiplyScalar(0.08) : new THREE.Color(0,0,0);

      if (!mesh) {
        const geom = makeGeometry(THREE, obj.kind);
        // size it so it sits on the plate
        geom.computeBoundingBox();
        const bb = geom.boundingBox;
        const minY = bb.min.y;
        geom.translate(0, -minY, 0);
        const mat = new THREE.MeshStandardMaterial({
          color, roughness: 0.55, metalness: 0.05, emissive,
        });
        mesh = new THREE.Mesh(geom, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData.id = obj.id;
        mesh.userData.kind = obj.kind;
        // Add outline (using EdgesGeometry as child)
        const edges = new THREE.EdgesGeometry(geom, 30);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.0 });
        const wire = new THREE.LineSegments(edges, lineMat);
        wire.userData.isOutline = true;
        mesh.add(wire);
        objectGroup.add(mesh);
      }
      mesh.position.set(obj.x, 0, obj.y);
      if (obj.rotZ !== undefined) mesh.rotation.y = obj.rotZ;
      if (mesh.material) {
        mesh.material.color.copy(color);
        mesh.material.emissive.copy(emissive);
        if (isSelected) {
          mesh.material.emissiveIntensity = 1;
        } else {
          mesh.material.emissiveIntensity = 0;
        }
      }
      // outline
      const wire = mesh.children.find(c => c.userData.isOutline);
      if (wire) {
        wire.material.opacity = isSelected ? 0.9 : 0.0;
        wire.material.color.set(isSelected ? 0xffffff : 0xffffff);
      }
    });
  }, [objects, selectedId, filaments, plateSize[0], plateSize[1]]);

  // Drop handling (from object library drag)
  const onDragOver = (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    mountRef.current?.parentElement?.classList.add("drop-target");
  };
  const onDragLeave = () => {
    mountRef.current?.parentElement?.classList.remove("drop-target");
  };
  const onDrop = (e) => {
    e.preventDefault();
    mountRef.current?.parentElement?.classList.remove("drop-target");
    try {
      const payload = JSON.parse(e.dataTransfer.getData("application/json"));
      const s = stateRef.current;
      if (!s) return;
      // compute drop world position on the ground plane
      const rect = s.renderer.domElement.getBoundingClientRect();
      const mouse = new s.THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      const ray = new s.THREE.Raycaster();
      ray.setFromCamera(mouse, s.camera);
      const target = new s.THREE.Vector3();
      ray.ray.intersectPlane(new s.THREE.Plane(new s.THREE.Vector3(0, 1, 0), 0), target);
      const halfX = plateSize[0] / 2;
      const halfY = plateSize[1] / 2;
      const x = Math.max(-halfX, Math.min(halfX, target.x));
      const y = Math.max(-halfY, Math.min(halfY, target.z));

      const id = `obj_${Date.now()}_${Math.floor(Math.random() * 999)}`;
      setObjects(prev => [...prev, {
        id,
        name: payload.name,
        kind: payload.kind,
        x, y, rotZ: 0,
        filamentId: payload.filamentId || filaments[0].id,
        overrides: {},
      }]);
      setSelectedId(id);
    } catch (err) {
      console.warn("drop failed", err);
    }
  };

  // Camera reset
  useEffect(() => {
    if (!onCameraReset) return;
    onCameraReset.current = () => {
      const s = stateRef.current;
      if (!s) return;
      s.ctrl.theta = Math.atan2(280, 320);
      s.ctrl.phi = Math.PI / 2.6;
      s.ctrl.radius = 480;
      s.ctrl.target.set(0, 30, 0);
      s.applyCamera();
    };
  }, [onCameraReset]);

  return (
    <div
      ref={mountRef}
      style={{ position: "absolute", inset: 0 }}
      onDragOver={onDragOver}
      onDragLeave={onDragLeave}
      onDrop={onDrop}
    />
  );
}

window.BuildPlate = BuildPlate;

</script>
<script type="text/babel" data-source="ObjectsPanel.jsx">
// ObjectsPanel.jsx — left panel: object library + plate object list.

const { useState: useStateOP, useRef: useRefOP } = React;

const OBJECT_LIBRARY = [
  { section: "Primitives", items: [
    { kind: "cube",     name: "Cube",     meta: "20 mm" },
    { kind: "cylinder", name: "Cylinder", meta: "Ø24 × 30" },
    { kind: "sphere",   name: "Sphere",   meta: "Ø28" },
    { kind: "cone",     name: "Cone",     meta: "Ø28 × 30" },
    { kind: "torus",    name: "Torus",    meta: "Ø28 / 4" },
  ]},
  { section: "Calibration", items: [
    { kind: "calicube",  name: "calibration_cube.stl",   meta: "20×20×20" },
    { kind: "temptower", name: "temp_tower.stl",         meta: "28×80×18" },
    { kind: "benchy",    name: "boat_test.stl",          meta: "60×18×20" },
  ]},
  { section: "Imported", items: [
