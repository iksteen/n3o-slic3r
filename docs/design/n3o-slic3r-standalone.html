];

function ObjectsPanel({
  objects, setObjects,
  selectedId, setSelectedId,
  filaments,
  printerName,
  countObjectOverrides,
  plateSize,
}) {
  const [showLibrary, setShowLibrary] = useStateOP(false);
  const draggingRef = useRefOP(null);

  const handleDragStart = (e, item) => {
    const payload = {
      kind: item.kind,
      name: item.name,
      filamentId: filaments[0].id,
    };
    e.dataTransfer.setData("application/json", JSON.stringify(payload));
    e.dataTransfer.effectAllowed = "copy";
    // ghost
    const ghost = document.createElement("div");
    ghost.className = "drag-preview";
    ghost.textContent = item.name;
    ghost.style.left = "-9999px";
    document.body.appendChild(ghost);
    e.dataTransfer.setDragImage(ghost, 0, 0);
    setTimeout(() => ghost.remove(), 0);
  };

  const addItem = (item) => {
    // Place it at a tidy grid slot
    const id = `obj_${Date.now()}_${Math.floor(Math.random() * 999)}`;
    const n = objects.length;
    const cols = 3;
    const spacing = 50;
    const x = ((n % cols) - 1) * spacing;
    const y = (Math.floor(n / cols) - 1) * spacing;
    setObjects(prev => [...prev, {
      id, name: item.name, kind: item.kind,
      x, y, rotZ: 0,
      filamentId: filaments[0].id,
      overrides: {},
    }]);
    setSelectedId(id);
    setShowLibrary(false);
  };

  const removeObject = (id, e) => {
    e?.stopPropagation();
    setObjects(prev => prev.filter(o => o.id !== id));
    if (selectedId === id) setSelectedId(null);
  };

  return (
    <aside className="objects-panel">
      <div className="panel-head">
        <h3>Plate · {printerName}</h3>
        <button className="icon-btn" title="Add object" onClick={() => setShowLibrary(s => !s)}>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M6 1.5v9M1.5 6h9" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
          </svg>
        </button>
      </div>

      <div className="object-list">
        {objects.length === 0 && (
          <div className="empty-state">
            Drag an object from the library<br/>or click <span className="kbd-inline">+</span> to add one.
          </div>
        )}
        {objects.map(obj => {
          const fil = filaments.find(f => f.id === obj.filamentId) || filaments[0];
          const overrideCount = countObjectOverrides(obj.id);
          return (
            <div
              key={obj.id}
              className={`object-item ${selectedId === obj.id ? "selected" : ""}`}
              onClick={() => setSelectedId(obj.id)}
            >
              <div className="object-thumb">{obj.kind.slice(0, 2).toUpperCase()}</div>
              <div style={{ minWidth: 0 }}>
                <div className="object-name">
                  <span className="object-color-tag" style={{ background: fil.color }}/>
                  {obj.name}
                </div>
                <div className="object-meta">
                  {Math.round(obj.x)}, {Math.round(obj.y)} mm · {fil.label}
                </div>
              </div>
              <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                {overrideCount > 0 && (
                  <span className="object-overrides" title={`${overrideCount} per-object overrides`}>
                    {overrideCount}
                  </span>
                )}
                <button
                  className="icon-btn"
                  title="Remove"
                  onClick={(e) => removeObject(obj.id, e)}
                >
                  <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                    <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                  </svg>
                </button>
              </div>
            </div>
          );
        })}
      </div>

      {showLibrary && (
        <div className="add-menu" style={{ maxHeight: 320, overflowY: "auto" }}>
          {OBJECT_LIBRARY.map(group => (
            <React.Fragment key={group.section}>
              <div className="add-section-label">{group.section}</div>
              {group.items.map(item => (
                <button
                  key={item.kind + item.name}
                  className="add-menu-item"
                  draggable
                  onDragStart={(e) => handleDragStart(e, item)}
                  onClick={() => addItem(item)}
                >
                  <span>{item.name}</span>
                  <span className="meta">{item.meta}</span>
                </button>
              ))}
            </React.Fragment>
          ))}
        </div>
      )}

      <div className="plate-stats">
        <div className="plate-stat-row">
          <span className="k">Build plate</span>
          <span className="v">{plateSize[0]} × {plateSize[1]} mm</span>
        </div>
        <div className="plate-stat-row">
          <span className="k">Objects</span>
          <span className="v">{objects.length}</span>
        </div>
        <div className="plate-stat-row">
          <span className="k">Est. material</span>
          <span className="v">{(objects.length * 12.4).toFixed(1)} g</span>
        </div>
        <div className="plate-stat-row">
          <span className="k">Est. time</span>
          <span className="v">
            {objects.length === 0 ? "—" : `${Math.floor(objects.length * 0.42 + 0.6)}h ${((objects.length * 25) % 60).toString().padStart(2,"0")}m`}
          </span>
        </div>
      </div>
    </aside>
  );
}

window.OBJECT_LIBRARY = OBJECT_LIBRARY;
window.ObjectsPanel = ObjectsPanel;

</script>
<script type="text/babel" data-source="SettingsPanel.jsx">
// SettingsPanel.jsx — categorized scrolling settings list with
// instant search, category jump-rail, and value-cascade accountability.

const { useState: useSPS, useMemo: useSPM, useRef: useSPR, useEffect: useSPE, useCallback: useSPC } = React;

const {
  CASCADE_LAYERS, LAYER_BY_ID,
  CATEGORIES, ALL_SETTINGS,
  resolveValue, getOverriddenLayers,
} = window.SLICER_DATA;

// tiny chevron used on dropdown chips
const ChevronChip = () => (
  <svg width="9" height="9" viewBox="0 0 10 10" fill="none" style={{ opacity: 0.55, flexShrink: 0 }}>
    <path d="M2 4l3 3 3-3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);

// ───────── fuzzy match (very small implementation) ─────────
function fuzzyScore(needle, hay) {
  if (!needle) return 1;
  needle = needle.toLowerCase();
  hay = hay.toLowerCase();
  if (hay.includes(needle)) return 1 - (hay.indexOf(needle) / hay.length) * 0.3;
  let ni = 0; let score = 0; let lastIdx = -1;
  for (let i = 0; i < hay.length && ni < needle.length; i++) {
    if (hay[i] === needle[ni]) {
      score += 1 - (lastIdx === -1 ? 0 : (i - lastIdx - 1) * 0.05);
      lastIdx = i;
      ni++;
    }
  }
  return ni === needle.length ? Math.max(0, score / needle.length * 0.6) : 0;
}

// ───────── Cascade Ladder (hover) ─────────
// Rendered via a portal at body level (with fixed positioning) so the scroll
// container clipping inside .settings-scroll can't swallow it.
function CascadeLadder({ rowRect, onLadderEnter, onLadderLeave, setting, layerOverrides, winner, onPromote, onReset, contextLayer, objectOverrides }) {
  if (!rowRect) return null;
  const allDefinedIds = new Set(
    CASCADE_LAYERS
      .filter(l => layerOverrides[l.id] !== undefined && layerOverrides[l.id] !== null)
      .map(l => l.id)
  );

  const LADDER_W = 250;
  const pad = 8;
  // Default position: to the left of the row, vertically centered.
  let left = rowRect.left - LADDER_W - 10;
  if (left < pad) {
    // not enough room on the left — fall back to the right of the row
    left = Math.min(window.innerWidth - LADDER_W - pad, rowRect.right + 10);
  }
  const top = Math.max(pad, Math.min(rowRect.top + rowRect.height / 2, window.innerHeight - pad));

  return ReactDOM.createPortal(
    <div
      className="cascade-ladder"
      style={{ position: "fixed", top, left, transform: "translateY(-50%)" }}
      onMouseEnter={onLadderEnter}
      onMouseLeave={onLadderLeave}
    >
      <div className="ladder-title">Value cascade · {setting.name}</div>
      {CASCADE_LAYERS.filter(l => l.id !== "object").map(layer => {
        const has = allDefinedIds.has(layer.id);
        const v = layerOverrides[layer.id];
        const isWinner = layer.id === winner;
        const isOverridden = has && !isWinner;
        return (
          <div
            key={layer.id}
            className={`ladder-row ${has ? "" : "empty"} ${isWinner ? "winner" : ""} ${isOverridden ? "overridden" : ""}`}
            style={{ "--row-hue": layer.hue }}
          >
            <span className={`l-dot ${has ? "" : "empty"}`}/>
            <span className="l-name">{layer.label}</span>
            <span className={`l-val ${has ? "" : "muted"}`}>
              {has ? formatVal(v, setting.unit) : "—"}
            </span>
          </div>
        );
      })}

      {objectOverrides && objectOverrides.length > 0 && (
        <>
          <div className="ladder-section-title">
            <span className="ladder-section-dot" style={{ background: `hsl(${LAYER_BY_ID.object.hue} 70% 55%)` }}/>
            {objectOverrides.length} object{objectOverrides.length > 1 ? "s" : ""} override
          </div>
          {objectOverrides.map(({ obj, value, filament, isSelected }) => (
            <div
              key={obj.id}
              className={`ladder-row obj-row ${isSelected ? "winner" : ""}`}
              style={{ "--row-hue": LAYER_BY_ID.object.hue }}
            >
              <span className="l-dot" style={{ background: filament?.color || "#888" }}/>
              <span className="l-name" title={obj.name}>{obj.name}</span>
              <span className="l-val">{formatVal(value, setting.unit)}</span>
            </div>
          ))}
        </>
      )}
    </div>,
    document.body
  );
}

function formatVal(v, unit) {
  if (typeof v === "boolean") return v ? "on" : "off";
  if (typeof v === "number") {
    const s = (Math.round(v * 1000) / 1000).toString();
    return unit ? `${s} ${unit}` : s;
  }
  return String(v);
}

// ───────── Setting Row ─────────
function SettingRow({
  setting,
  contextLayer,
  selectedObject,         // present when contextLayer === "object"
  objects,                // ALL objects on the plate, so we can show which override this setting
  filaments,              // for color swatches in the per-object section
  accountabilityMode,
  userOverrides,          // project-level user edits only
  onSetProjectOverride,
  onResetProjectOverride,
  onSetObjectOverride,
  onResetObjectOverride,
}) {
  // Which objects on the plate override this specific setting? Used for the
  // "objects-override" badge + the per-object section in the hover ladder.
  const objectOverrides = useSPM(() => {
    if (!objects) return [];
    return objects
      .filter(o => o.overrides && o.overrides[setting.id] !== undefined && o.overrides[setting.id] !== null)
      .map(o => ({
        obj: o,
        value: o.overrides[setting.id],
        filament: filaments.find(f => f.id === o.filamentId),
        isSelected: selectedObject && o.id === selectedObject.id,
      }));
  }, [objects, filaments, setting.id, selectedObject]);
  // Effective cascade:
  //   - Base: setting.cascade (printer..project, set by profile data)
  //   - + user project overrides
  //   - + selected object's overrides (only on Object tab)
  const layerOverrides = useSPM(() => {
    const out = { ...setting.cascade };
    const user = userOverrides[setting.id] || {};
    Object.entries(user).forEach(([k, v]) => {
      if (v === undefined || v === null) delete out[k]; else out[k] = v;
    });
    if (contextLayer === "object" && selectedObject) {
      const objVal = (selectedObject.overrides || {})[setting.id];
      if (objVal !== undefined && objVal !== null) {
        out.object = objVal;
      }
    }
    return out;
  }, [setting, userOverrides, contextLayer, selectedObject]);

  const { value, layer } = useSPM(() => {
    for (let i = CASCADE_LAYERS.length - 1; i >= 0; i--) {
      const id = CASCADE_LAYERS[i].id;
      if (layerOverrides[id] !== undefined && layerOverrides[id] !== null) {
        return { value: layerOverrides[id], layer: id };
      }
    }
    return { value: setting.default, layer: "printer" };
  }, [layerOverrides]);

  const layerMeta = LAYER_BY_ID[layer];
  const definedLayers = CASCADE_LAYERS.filter(l => layerOverrides[l.id] !== undefined);
  const isOverridden = definedLayers.length > 1;
  const hasProjectAuthored = layerOverrides.project !== undefined;
  const hasObjectAuthored  = layerOverrides.object  !== undefined;
  const conflict = isOverridden && definedLayers[definedLayers.length - 1].id === "object"
    && definedLayers.some(l => l.id === "project" && layerOverrides.project !== layerOverrides.object);

  // Writes go to the layer matching the current tab.
  const handleChange = (newVal) => {
    if (contextLayer === "object" && selectedObject) {
      onSetObjectOverride(setting.id, newVal);
    } else {
      onSetProjectOverride(setting.id, newVal);
    }
  };
  const handleReset = () => {
    if (contextLayer === "object" && selectedObject) {
      onResetObjectOverride(setting.id);
    } else {
      onResetProjectOverride(setting.id);
    }
  };

  // Reset is available whenever the ACTIVE editing layer has any value for this
  // setting — pre-seeded from profile data or added by the user.
  const hasValueAtContext = layerOverrides[contextLayer] !== undefined;

  // ─── Hover handling for the cascade ladder ───
  // Ladder is rendered via portal at body level so it isn't clipped by the
  // scroll container. We open on row hover, close on a short delay so the user
  // can move from the row to the ladder without losing it.
  const [ladderOpen, setLadderOpen] = useSPS(false);
  const [rowRect, setRowRect] = useSPS(null);
  const rowRef = useSPR(null);
  const closeT = useSPR(null);
  const openLadder = () => {
    if (closeT.current) { clearTimeout(closeT.current); closeT.current = null; }
    if (rowRef.current) setRowRect(rowRef.current.getBoundingClientRect());
    setLadderOpen(true);
  };
  const scheduleClose = () => {
    if (closeT.current) clearTimeout(closeT.current);
    closeT.current = setTimeout(() => setLadderOpen(false), 120);
  };
  useSPE(() => () => { if (closeT.current) clearTimeout(closeT.current); }, []);

  const renderControl = () => {
    if (setting.type === "toggle") {
      return (
        <div className="val-toggle-wrap">
          <div className={`val-toggle ${value ? "on" : ""}`} onClick={() => handleChange(!value)}/>
        </div>
      );
    }
    if (setting.type === "select") {
      return (
        <select className="val-select" value={value} onChange={(e) => handleChange(e.target.value)}>
          {(setting.options || []).map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      );
    }
    return (
      <div className="val-wrap">
        <input
          className="val-input"
          type="number"
          value={value}
          step={setting.step || 1}
          min={setting.min}
          max={setting.max}
          onChange={(e) => handleChange(parseFloat(e.target.value))}
        />
        {setting.unit && <span className="val-unit">{setting.unit}</span>}
      </div>
    );
  };

  return (
    <div
      ref={rowRef}
      className={`set-row ${isOverridden ? "overridden" : ""} ${conflict ? "has-conflict" : ""} ${hasObjectAuthored ? "authored-object" : hasProjectAuthored ? "authored-project" : ""}`}
      style={{
        "--row-hue": layerMeta.hue,
        "--proj-hue": LAYER_BY_ID.project.hue,
        "--obj-hue":  LAYER_BY_ID.object.hue,
      }}
      data-setting-id={setting.id}
      onMouseEnter={openLadder}
      onMouseLeave={scheduleClose}
    >
      <div className="set-meta">
        <span className="set-name" title={setting.name}>{setting.name}</span>
        {accountabilityMode === "breadcrumb" && (
          <span className="set-breadcrumb">
            {definedLayers.map((l, i) => (
              <React.Fragment key={l.id}>
                <span
                  className={`crumb ${l.id === layer ? "" : "muted"}`}
                  style={{ "--crumb-hue": l.hue }}
                >{l.short}</span>
                {i < definedLayers.length - 1 && <span className="arrow">›</span>}
              </React.Fragment>
            ))}
          </span>
        )}
        {objectOverrides.length > 0 && contextLayer !== "object" && (
          <span
            className="objs-badge"
            style={{ "--obj-hue": LAYER_BY_ID.object.hue }}
            title={`${objectOverrides.length} object${objectOverrides.length > 1 ? "s" : ""} override this — hover row for details`}
          >
            <svg width="9" height="9" viewBox="0 0 12 12" fill="none" aria-hidden>
              <path d="M2.5 3v3a2 2 0 0 0 2 2H10M10 8L7.5 5.5M10 8L7.5 10.5"
                stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            <span className="objs-badge-dots">
              {objectOverrides.slice(0, 3).map((o, i) => (
                <span key={o.obj.id} className="objs-badge-dot" style={{ background: o.filament?.color || "#888" }}/>
              ))}
              {objectOverrides.length > 3 && <span className="objs-badge-more">+{objectOverrides.length - 3}</span>}
            </span>
          </span>
        )}
      </div>

      {hasValueAtContext && (
        <button
          className="reset-btn show"
          title={`Reset ${LAYER_BY_ID[contextLayer].label} override (falls back to inherited value)`}
          onClick={(e) => { e.stopPropagation(); handleReset(); }}
        >
          <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 5a3.5 3.5 0 1 0 1-2.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
            <path d="M2 2v3h3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
      )}

      <div className="set-value">{renderControl()}</div>

      {ladderOpen && (
        <CascadeLadder
          setting={setting}
          layerOverrides={layerOverrides}
          winner={layer}
          contextLayer={contextLayer}
          objectOverrides={objectOverrides}
          onPromote={() => handleChange(value)}
          onReset={handleReset}
          rowRect={rowRect}
          onLadderEnter={openLadder}
          onLadderLeave={scheduleClose}
        />
      )}
    </div>
  );
}

// ───────── Settings Panel root ─────────
function SettingsPanel({
  contextLayer,
  setContextLayer,
  selectedObject,
  setObjectOverride,
  resetObjectOverride,
  accountabilityMode,
  searchMode,
  userOverrides,
  setUserOverrides,
  objects,                 // all objects on the plate
  filaments,
  // config-strip props
  printer, bedPlate, nozzle,
  filamentsInUse,
  printerPresets,
  onSwapPrinter, onSwapBedPlate, onSwapNozzle, onSwapFilament,
}) {
  const [query, setQuery] = useSPS("");
  const [activeCat, setActiveCat] = useSPS(CATEGORIES[0].id);
  const [printerMenuOpen, setPrinterMenuOpen] = useSPS(false);
  const scrollRef = useSPR(null);
  const inputRef = useSPR(null);
  const printerChipRef = useSPR(null);

  // Dismiss printer menu on outside click
  useSPE(() => {
    if (!printerMenuOpen) return;
    const onDoc = (e) => {
      if (!e.target.closest(".printer-picker-menu") && !e.target.closest(".config-chip-printer")) {
        setPrinterMenuOpen(false);
      }
    };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [printerMenuOpen]);

  const objectAvailable = !!selectedObject;
  // If object becomes unavailable while on object tab, fall back to project.
  useSPE(() => {
    if (contextLayer === "object" && !objectAvailable) setContextLayer("project");
  }, [contextLayer, objectAvailable, setContextLayer]);

  // keyboard shortcut for search focus
  useSPE(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "f") {
        e.preventDefault();
        inputRef.current?.focus();
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  const filteredCategories = useSPM(() => {
    if (!query.trim()) return CATEGORIES.map(c => ({ ...c, _settings: c.settings, _matchedAll: true }));

    const q = query.trim();
    return CATEGORIES.map(cat => {
      let matched;
      if (searchMode === "instant") {
        // simple case-insensitive substring on setting name or id
        const lower = q.toLowerCase();
        matched = cat.settings.filter(s =>
          s.name.toLowerCase().includes(lower) || s.id.includes(lower)
        );
      } else if (searchMode === "scoped") {
        // narrows to the active category only
        if (cat.id !== activeCat) matched = [];
        else {
          const lower = q.toLowerCase();
          matched = cat.settings.filter(s =>
            s.name.toLowerCase().includes(lower) || s.id.includes(lower)
          );
        }
      } else { // fuzzy
        matched = cat.settings
          .map(s => ({ s, score: Math.max(fuzzyScore(q, s.name), fuzzyScore(q, s.id) * 0.7) }))
          .filter(x => x.score > 0.25)
          .sort((a, b) => b.score - a.score)
          .map(x => x.s);
      }
      return { ...cat, _settings: matched, _matchedAll: false };
    }).filter(c => c._settings.length > 0);
  }, [query, searchMode, activeCat]);

  // observe scroll position to update activeCat
  useSPE(() => {
    const root = scrollRef.current;
    if (!root) return;
    const headers = Array.from(root.querySelectorAll("[data-cat-id]"));
    const obs = new IntersectionObserver(entries => {
      // pick the topmost-visible
      const visible = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible.length > 0) {
        const id = visible[0].target.getAttribute("data-cat-id");
        setActiveCat(id);
      }
    }, { root, rootMargin: "-10% 0px -70% 0px", threshold: [0, 1] });
    headers.forEach(h => obs.observe(h));
    return () => obs.disconnect();
  }, [filteredCategories]);

  const jumpToCat = (catId) => {
    setActiveCat(catId);
    const el = scrollRef.current?.querySelector(`[data-cat-id="${catId}"]`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // Project-layer writes — go into userOverrides (also support the rare "user"
  // layer write from the cascade ladder, treating it like project).
  const setProjectOverride = useSPC((settingId, value) => {
    setUserOverrides(prev => {
      const cur = { ...(prev[settingId] || {}) };
      cur.project = value;
      return { ...prev, [settingId]: cur };
    });
  }, [setUserOverrides]);

  const resetProjectOverride = useSPC((settingId) => {
    setUserOverrides(prev => {
      const cur = { ...(prev[settingId] || {}) };
      const setting = ALL_SETTINGS.find(s => s.id === settingId);
      const baseHasValue = setting && setting.cascade.project !== undefined && setting.cascade.project !== null;
      if (baseHasValue) {
        // base profile defined a value here — sentinel-clear with null so it
        // doesn't fall through.
        cur.project = null;
      } else {
        // value was a user-added override — just drop the key.
        delete cur.project;
      }
      const next = { ...prev };
      if (Object.keys(cur).length === 0) delete next[settingId];
      else next[settingId] = cur;
      return next;
    });
  }, [setUserOverrides]);

  // Count of settings per category that have an active value at the current
  // editing layer. On Project tab: counts settings with project values (base
  // profile + user additions, minus cleared sentinels). On Object tab: counts
  // settings the selected object has overrides for.
  const counts = useSPM(() => {
    const out = {};
    CATEGORIES.forEach(c => {
      out[c.id] = {
        total: c.settings.length,
        overrides: c.settings.filter(s => {
          if (contextLayer === "object") {
            if (!selectedObject) return false;
            const ov = (selectedObject.overrides || {})[s.id];
            return ov !== undefined && ov !== null;
          }
          // project tab
          const user = (userOverrides[s.id] || {}).project;
          if (user === null) return false;
          if (user !== undefined) return true;
          return s.cascade.project !== undefined && s.cascade.project !== null;
        }).length,
      };
    });
    return out;
  }, [userOverrides, contextLayer, selectedObject]);

  const totalMatches = filteredCategories.reduce((n, c) => n + c._settings.length, 0);

  return (
    <aside className="settings-panel">
      <div className="sp-config">
        <div className="sp-config-row">
          <div className="config-chip-wrap" ref={printerChipRef}>
            <button
              className="config-chip config-chip-printer"
              onClick={() => setPrinterMenuOpen(o => !o)}
              style={{ "--chip-hue": LAYER_BY_ID.printer.hue }}
            >
              <span className="config-chip-top">
                <span className="chip-dot"/>
                <span className="chip-label">Printer</span>
                <span className="chev"><ChevronChip/></span>
              </span>
              <span className="chip-value" title={printer}>{printer}</span>
            </button>
            {printerMenuOpen && printerPresets && (
              <div className="printer-picker-menu" onClick={(e) => e.stopPropagation()}>
                <div className="ptpm-title">Assign printer to this plate</div>
                {printerPresets.map(preset => (
                  <button
                    key={preset.id}
                    className={`ptpm-item ${preset.name === printer ? "active" : ""}`}
                    onClick={() => {
                      onSwapPrinter && onSwapPrinter(preset.id);
                      setPrinterMenuOpen(false);
                    }}
                  >
                    <span className="ptpm-name">{preset.name}</span>
                    <span className="ptpm-detail">
                      {preset.plateSize[0]}×{preset.plateSize[1]} · {preset.bedPlate}
                    </span>
                  </button>
                ))}
              </div>
            )}
          </div>
          <button className="config-chip" onClick={onSwapBedPlate} style={{ "--chip-hue": LAYER_BY_ID.printer.hue }}>
            <span className="config-chip-top">
              <span className="chip-dot"/>
              <span className="chip-label">Bed</span>
              <span className="chev"><ChevronChip/></span>
            </span>
            <span className="chip-value" title={bedPlate}>{bedPlate}</span>
          </button>
          {/* Nozzle is context-state on the printer profile, not a cascade layer of its own. */}
          <button className="config-chip" onClick={onSwapNozzle} style={{ "--chip-hue": LAYER_BY_ID.printer.hue }}>
            <span className="config-chip-top">
              <span className="chip-dot"/>
              <span className="chip-label">Nozzle</span>
              <span className="chev"><ChevronChip/></span>
            </span>
            <span className="chip-value" title={nozzle}>{nozzle}</span>
          </button>
        </div>
        <div className="sp-config-row sp-config-filaments">
          <span className="config-row-label">Filaments</span>
          {filamentsInUse.length === 0 ? (
            <span className="dim" style={{ fontSize: 11, fontFamily: "var(--font-mono)" }}>
              none — add an object to assign material
            </span>
          ) : (
            filamentsInUse.map(fil => (
              <button
                key={fil.id}
                className="filament-chip"
                onClick={() => onSwapFilament(fil.id)}
                title={`${fil.label} · used by ${fil.useCount} object${fil.useCount !== 1 ? "s" : ""}`}
              >
                <span className="fil-swatch" style={{ background: fil.color }}/>
                <span className="fil-label">{fil.label}</span>
                <span className="fil-count">×{fil.useCount}</span>
                <ChevronChip/>
              </button>
            ))
          )}
        </div>
      </div>

      <div className="sp-tabs">
        <button
          className={`sp-tab ${contextLayer === "project" ? "active" : ""}`}
          style={{ "--tab-hue": LAYER_BY_ID.project.hue }}
          onClick={() => setContextLayer("project")}
        >
          <span className="sp-tab-dot"/>
          Project
        </button>
        <button
          className={`sp-tab ${contextLayer === "object" ? "active" : ""}`}
          style={{ "--tab-hue": LAYER_BY_ID.object.hue }}
          onClick={() => objectAvailable && setContextLayer("object")}
          disabled={!objectAvailable}
          title={objectAvailable ? `Per-object overrides for ${selectedObject.name}` : "Select an object on the plate to edit per-object overrides"}
        >
          <span className="sp-tab-dot"/>
          Object
        </button>
      </div>

      <div className="search-wrap">
        <div className="search-input">
          <svg className="ico" viewBox="0 0 14 14" fill="none">
            <circle cx="6" cy="6" r="4.2" stroke="currentColor" strokeWidth="1.4"/>
            <path d="M9.2 9.2L12 12" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
          </svg>
          <input
            ref={inputRef}
            type="text"
            placeholder={
              searchMode === "instant" ? "Search 800+ settings…" :
              searchMode === "scoped"  ? `Search within ${LAYER_BY_ID && CATEGORIES.find(c=>c.id===activeCat)?.name}…` :
              "Fuzzy search any setting…"
            }
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
          {query && (
            <button className="icon-btn" onClick={() => setQuery("")}>×</button>
          )}
          {!query && <span className="kbd">⌘F</span>}
        </div>
        {query && (
          <div className="dim" style={{ fontSize: 11, fontFamily: "var(--font-mono)" }}>
            {totalMatches} {totalMatches === 1 ? "match" : "matches"} across {filteredCategories.length} {filteredCategories.length === 1 ? "category" : "categories"}
          </div>
        )}
      </div>

      <div className="settings-body">
        <div className="cat-rail">
          {CATEGORIES.map(cat => {
            const hasMatches = !query.trim() || filteredCategories.find(c => c.id === cat.id);
            return (
              <button
                key={cat.id}
                className={`cat-rail-item ${activeCat === cat.id ? "active" : ""}`}
                onClick={() => jumpToCat(cat.id)}
                disabled={!hasMatches}
                style={{ opacity: hasMatches ? 1 : 0.35 }}
              >
                <span className="cat-rail-icon">{cat.icon}</span>
                <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{cat.name}</span>
                <span className="cat-rail-count">
                  {counts[cat.id].overrides > 0
                    ? <span style={{ color: "var(--accent-text)" }}>{counts[cat.id].overrides}/{counts[cat.id].total}</span>
                    : counts[cat.id].total}
                </span>
              </button>
            );
          })}
        </div>

        <div className="settings-scroll" ref={scrollRef}>
          {filteredCategories.length === 0 && (
            <div className="empty-state">
              No settings match <span className="kbd-inline">{query}</span>
              <div style={{ marginTop: 8, fontSize: 11 }}>Try fuzzy mode or broaden your terms.</div>
            </div>
          )}
          {filteredCategories.map(cat => (
            <section key={cat.id} className="cat-group" data-cat-id={cat.id}>
              <header className="cat-header">
                <h4>
                  <span className="cat-rail-icon" style={{ marginRight: 2 }}>{cat.icon}</span>
                  {cat.name}
                  <span className="cat-desc"> · {cat.desc}</span>
                </h4>
                <span className="cat-counts">
                  {cat._settings.length}{!cat._matchedAll && `/${cat.settings.length}`}
                </span>
              </header>
              {cat._settings.map(setting => (
                <SettingRow
                  key={setting.id}
                  setting={setting}
                  contextLayer={contextLayer}
                  selectedObject={contextLayer === "object" ? selectedObject : null}
                  objects={objects}
                  filaments={filaments}
                  accountabilityMode={accountabilityMode}
                  userOverrides={userOverrides}
                  onSetProjectOverride={setProjectOverride}
                  onResetProjectOverride={resetProjectOverride}
                  onSetObjectOverride={setObjectOverride}
                  onResetObjectOverride={resetObjectOverride}
                />
              ))}
            </section>
          ))}
        </div>
      </div>
    </aside>
  );
}

window.SettingsPanel = SettingsPanel;

</script>
<script type="text/babel" data-source="TopBar.jsx">

<script type="text/babel" data-source="PlateTabs.jsx">
// PlateTabs.jsx — horizontal plate-tabs strip below the topbar. Each plate
// owns its own printer/bed/nozzle/objects/overrides. Printer assignment is
// done from the settings panel; the tab just displays the current printer.

function PlateTabs({
  plates,
  activePlateId,
  setActivePlateId,
  addPlate,
  closePlate,
  renamePlate,
}) {
  const { useState, useRef, useEffect } = React;
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState("");
  const editInputRef = useRef(null);

  useEffect(() => {
    if (editingId && editInputRef.current) {
      editInputRef.current.focus();
      editInputRef.current.select();
    }
  }, [editingId]);

  const commitRename = () => {
    if (editingId && editValue.trim()) {
      renamePlate(editingId, editValue.trim());
    }
    setEditingId(null);
  };

  return (
    <div className="plate-tabs">
      <div className="plate-tabs-scroll">
        {plates.map(plate => {
          const isActive = plate.id === activePlateId;
          const isEditing = editingId === plate.id;
          return (
            <div
              key={plate.id}
              className={`plate-tab ${isActive ? "active" : ""}`}
              onClick={() => !isEditing && setActivePlateId(plate.id)}
            >
              <span className="plate-tab-icon" title="Build plate">
                <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
                  <path d="M1 9l6 3 6-3M1 6l6 3 6-3M1 3l6 3 6-3-6-3-6 3z" stroke="currentColor" strokeWidth="1.1" strokeLinejoin="round"/>
                </svg>
              </span>
              {isEditing ? (
                <input
                  ref={editInputRef}
                  className="plate-tab-rename-input"
                  value={editValue}
                  onChange={(e) => setEditValue(e.target.value)}
                  onBlur={commitRename}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") commitRename();
                    if (e.key === "Escape") { setEditingId(null); }
                  }}
                  onClick={(e) => e.stopPropagation()}
                />
              ) : (
                <span
                  className="plate-tab-name"
                  onDoubleClick={(e) => {
                    e.stopPropagation();
                    setEditingId(plate.id);
                    setEditValue(plate.name);
                  }}
                  title="Double-click to rename"
                >
                  {plate.name}
                </span>
              )}
              <span className="plate-tab-divider"/>
              <span className="plate-tab-printer-display" title={`Assigned to ${plate.printer} — change in the settings panel`}>
                {plate.printer}
              </span>
              <span className="plate-tab-meta">
                {plate.objects.length} obj
              </span>
              {plates.length > 1 && (
                <button
                  className="plate-tab-close"
                  onClick={(e) => { e.stopPropagation(); closePlate(plate.id); }}
                  title="Close plate"
                >
                  <svg width="9" height="9" viewBox="0 0 12 12" fill="none">
                    <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                  </svg>
                </button>
              )}
            </div>
          );
        })}
      </div>
      <button className="plate-tab-add" onClick={addPlate} title="New plate (uses next printer preset)">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
          <path d="M7 2v10M2 7h10" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
        </svg>
        <span>New plate</span>
      </button>
    </div>
  );
}

window.PlateTabs = PlateTabs;

</script>
<script type="text/babel" data-source="app.jsx">
// app.jsx — main shell. Wires TopBar / PlateTabs / ObjectsPanel / BuildPlate / SettingsPanel
// + Tweaks panel for theme/accountability/search variants.
//
// State is plate-centric: a project contains multiple Plates, each owning its
// own printer/bed/nozzle/objects/project-overrides. Switching plate tabs
// switches the entire workspace.

const { useState, useRef, useEffect, useMemo, useCallback } = React;
const { CASCADE_LAYERS, LAYER_BY_ID, CATEGORIES, ALL_SETTINGS } = window.SLICER_DATA;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accent": "cyan",
  "accountability": "rule",
  "search": "instant",
  "density": "regular"
}/*EDITMODE-END*/;

// Pre-seed a small set of objects so the prototype shows life on first load.
const INITIAL_FILAMENTS = [
  { id: "fil_a", label: "PETG Cool Grey", material: "PETG", color: "#7A8794" },
  { id: "fil_b", label: "PLA Signal Red", material: "PLA",  color: "#C24B45" },
  { id: "fil_c", label: "TPU Cyan",       material: "TPU",  color: "#2BB6C2" },
  { id: "fil_d", label: "PLA Matte Black",material: "PLA",  color: "#2A2D33" },
];

const PRINTER_PRESETS = [
  { id: "voron_2_4_350", name: "Voron 2.4 — 350",  bedPlate: "Textured PEI",     nozzle: "0.4 mm brass CHT",   plateSize: [256, 256] },
  { id: "prusa_mk4",     name: "Prusa MK4",        bedPlate: "Satin Powder",     nozzle: "0.4 mm hardened",    plateSize: [250, 210] },
  { id: "bambu_x1c",     name: "Bambu X1C",        bedPlate: "Engineering PEI",  nozzle: "0.4 mm hardened",    plateSize: [256, 256] },
  { id: "ender_3_v3",    name: "Ender 3 V3 KE",    bedPlate: "PC Spring Steel",  nozzle: "0.4 mm brass",       plateSize: [220, 220] },
];

const INITIAL_PLATES = [
  {
    id: "plate_1",
    name: "Production batch",
    printer: "Voron 2.4 — 350",
    bedPlate: "Textured PEI",
    nozzle: "0.4 mm brass CHT",
    plateSize: [256, 256],
    objects: [
      {
        id: "obj_seed_1", name: "front_mount_v3.stl",   kind: "stl_mount",  x: -45, y: -30, rotZ: 0, filamentId: "fil_a",
        overrides: { infill_density: 45, wall_count: 5, print_temp: 235 },
      },
      {
        id: "obj_seed_2", name: "calibration_cube.stl", kind: "calicube",   x: 40,  y: -30, rotZ: 0, filamentId: "fil_b",
        overrides: { infill_density: 100, top_layers: 3, bottom_layers: 3, support_enable: false, print_speed: 30 },
      },
      {
        id: "obj_seed_3", name: "fan_bracket_r2.stl",   kind: "stl_bracket",x: -20, y: 40,  rotZ: 0.5, filamentId: "fil_c",
        overrides: { support_enable: true, support_density: 25, adhesion_type: "brim", brim_width: 12 },
      },
    ],
    userOverrides: { top_layers: { user: 6 } },
    selectedId: null,
  },
  {
    id: "plate_2",
    name: "TPU gaskets",
    printer: "Prusa MK4",
    bedPlate: "Satin Powder",
    nozzle: "0.6 mm hardened",
    plateSize: [250, 210],
    objects: [
      {
        id: "obj_p2_1", name: "gasket_outer.stl", kind: "torus", x: -40, y: 0, rotZ: 0, filamentId: "fil_c",
        overrides: { print_temp: 235, retract_dist: 0.4, print_speed: 25 },
      },
      {
        id: "obj_p2_2", name: "gasket_inner.stl", kind: "torus", x: 40,  y: 0, rotZ: 0, filamentId: "fil_c",
        overrides: { print_temp: 235, retract_dist: 0.4 },
      },
    ],
    userOverrides: {},
    selectedId: null,
  },
];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [contextLayer, setContextLayer] = useState("project");
  const [plates, setPlates] = useState(INITIAL_PLATES);
  const [activePlateId, setActivePlateId] = useState(INITIAL_PLATES[0].id);
  const [filaments] = useState(INITIAL_FILAMENTS);
  const [slicing, setSlicing] = useState(false);
  const cameraResetRef = useRef(null);

  // Derived: active plate + its slot accessors
  const activePlate = useMemo(
    () => plates.find(p => p.id === activePlateId) || plates[0],
    [plates, activePlateId]
  );

  // Patch the active plate
  const patchPlate = useCallback((id, patch) => {
    setPlates(prev => prev.map(p => p.id === id ? { ...p, ...(typeof patch === "function" ? patch(p) : patch) } : p));
  }, []);

  // Wrappers that operate on the active plate so existing components don't need to know about plates
  const objects = activePlate.objects;
  const selectedId = activePlate.selectedId;
  const userOverrides = activePlate.userOverrides;
  const plateSize = activePlate.plateSize;
  const printer = activePlate.printer;
  const bedPlate = activePlate.bedPlate;
  const nozzle = activePlate.nozzle;

  const setObjects = useCallback((updater) => {
    patchPlate(activePlateId, p => ({ objects: typeof updater === "function" ? updater(p.objects) : updater }));
  }, [activePlateId, patchPlate]);
  const setSelectedId = useCallback((id) => {
    patchPlate(activePlateId, { selectedId: id });
    if (id) setContextLayer("object");
    else if (contextLayer === "object") setContextLayer("project");
  }, [activePlateId, patchPlate, contextLayer]);
  const setUserOverrides = useCallback((updater) => {
    patchPlate(activePlateId, p => ({ userOverrides: typeof updater === "function" ? updater(p.userOverrides) : updater }));
  }, [activePlateId, patchPlate]);

  // Plate management
  const addPlate = useCallback(() => {
    const preset = PRINTER_PRESETS[plates.length % PRINTER_PRESETS.length];
    const id = `plate_${Date.now()}`;
    setPlates(prev => [...prev, {
      id, name: `Plate ${prev.length + 1}`,
      printer: preset.name, bedPlate: preset.bedPlate, nozzle: preset.nozzle, plateSize: preset.plateSize,
      objects: [], userOverrides: {}, selectedId: null,
    }]);
    setActivePlateId(id);
  }, [plates.length]);
  const closePlate = useCallback((id) => {
    setPlates(prev => {
      if (prev.length <= 1) return prev;
      const next = prev.filter(p => p.id !== id);
      if (activePlateId === id) setActivePlateId(next[0].id);
      return next;
    });
  }, [activePlateId]);
  const renamePlate = useCallback((id, name) => {
    patchPlate(id, { name });
  }, [patchPlate]);
  const setPlatePrinter = useCallback((id, presetId) => {
    const preset = PRINTER_PRESETS.find(p => p.id === presetId);
    if (!preset) return;
    patchPlate(id, { printer: preset.name, bedPlate: preset.bedPlate, nozzle: preset.nozzle, plateSize: preset.plateSize });
  }, [patchPlate]);

  // Filaments actually used by current objects (with use-counts)
  const filamentsInUse = useMemo(() => {
    const counts = {};
    objects.forEach(o => { counts[o.filamentId] = (counts[o.filamentId] || 0) + 1; });
    return Object.entries(counts).map(([id, useCount]) => {
      const fil = filaments.find(f => f.id === id);
      return fil ? { ...fil, useCount } : null;
    }).filter(Boolean);
  }, [objects, filaments]);

  // Stubs for the swap actions (would open a profile picker in the real app)
  const noop = (label) => () => console.log(`[swap] ${label}`);

  // Object-level overrides live on each object. These helpers patch the
  // selected object's `overrides` map.
  const setObjectOverride = useCallback((settingId, value) => {
    if (!selectedId) return;
    setObjects(prev => prev.map(o => o.id === selectedId
      ? { ...o, overrides: { ...(o.overrides || {}), [settingId]: value } }
      : o
    ));
  }, [selectedId]);

  const resetObjectOverride = useCallback((settingId) => {
    if (!selectedId) return;
    setObjects(prev => prev.map(o => {
      if (o.id !== selectedId) return o;
      const next = { ...(o.overrides || {}) };
      delete next[settingId];
      return { ...o, overrides: next };
    }));
  }, [selectedId]);

  // Apply theme + accent tokens
  useEffect(() => {
    const root = document.documentElement;
    root.setAttribute("data-theme", t.theme);
    if (t.accent === "cyan") root.removeAttribute("data-accent");
    else root.setAttribute("data-accent", t.accent);
  }, [t.theme, t.accent]);

  // Context-aware target label
  const contextTarget = useMemo(() => {
    if (contextLayer === "object") {
      const sel = objects.find(o => o.id === selectedId);
      return sel ? sel.name : "Select an object";
    }
    if (contextLayer === "filament")    return filaments[0].label;
    if (contextLayer === "project")     return "untitled.3mf";
    if (contextLayer === "user")        return "Anders · Travel";
    if (contextLayer === "printer")     return "Voron 2.4 — 350mm";
    if (contextLayer === "build_plate") return "Textured PEI";
    if (contextLayer === "default")     return "Shipped defaults";
    return "";
  }, [contextLayer, selectedId, objects, filaments]);

  // Auto-switch to object context when an object is selected (gentle behavior)
  useEffect(() => {
    if (selectedId && contextLayer !== "object") {
      // don't auto-jump — but if user clicks object chip with selected, the panel reflects
    }
  }, [selectedId]);

  const countObjectOverrides = useCallback((objId) => {
    const obj = objects.find(o => o.id === objId);
    if (!obj || !obj.overrides) return 0;
    return Object.keys(obj.overrides).length;
  }, [objects]);

  const onSlice = () => {
    setSlicing(true);
    setTimeout(() => setSlicing(false), 1800);
  };

  const onResetCamera = () => {
    cameraResetRef.current?.();
  };

  // Status bar info
  const overrideCount = Object.values(userOverrides).reduce(
    (n, layers) => n + Object.keys(layers).length, 0
  );

  return (
    <div className="app">
      <TopBar
        projectName="untitled.3mf"
        onSlice={onSlice}
        onResetCamera={onResetCamera}
      />

      <PlateTabs
        plates={plates}
        activePlateId={activePlateId}
        setActivePlateId={setActivePlateId}
        addPlate={addPlate}
        closePlate={closePlate}
        renamePlate={renamePlate}
      />

      <div className="workspace">
        <ObjectsPanel
          objects={objects}
          setObjects={setObjects}
          selectedId={selectedId}
          setSelectedId={setSelectedId}
          filaments={filaments}
          printerName={activePlate.name}
          countObjectOverrides={countObjectOverrides}
          plateSize={plateSize}
        />

        <div className="viewport">
          <BuildPlate
            key={activePlateId}
            objects={objects}
            setObjects={setObjects}
            selectedId={selectedId}
            setSelectedId={setSelectedId}
            plateSize={plateSize}
            filaments={filaments}
            onCameraReset={cameraResetRef}
          />

          <div className="viewport-toolbar">
            <button className="vp-tool active" title="Move">
              <svg viewBox="0 0 14 14" fill="none">
                <path d="M7 1v12M1 7h12M7 1l-2 2M7 1l2 2M7 13l-2-2M7 13l2-2M1 7l2-2M1 7l2 2M13 7l-2-2M13 7l-2 2" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
              </svg>
            </button>
            <button className="vp-tool" title="Rotate">
              <svg viewBox="0 0 14 14" fill="none">
                <path d="M2 7a5 5 0 1 0 1.5-3.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                <path d="M1.5 1.5v3h3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
            <button className="vp-tool" title="Scale">
              <svg viewBox="0 0 14 14" fill="none">
                <rect x="2" y="2" width="6" height="6" stroke="currentColor" strokeWidth="1.2"/>
                <rect x="6" y="6" width="6" height="6" stroke="currentColor" strokeWidth="1.2"/>
              </svg>
            </button>
            <div className="vp-sep"/>
            <button className="vp-tool" title="Auto-arrange">
              <svg viewBox="0 0 14 14" fill="none">
                <rect x="1.5" y="1.5" width="4" height="4" stroke="currentColor" strokeWidth="1.2"/>
                <rect x="8.5" y="1.5" width="4" height="4" stroke="currentColor" strokeWidth="1.2"/>
                <rect x="1.5" y="8.5" width="4" height="4" stroke="currentColor" strokeWidth="1.2"/>
                <rect x="8.5" y="8.5" width="4" height="4" stroke="currentColor" strokeWidth="1.2"/>
              </svg>
            </button>
            <button className="vp-tool" title="Layer preview">
              <svg viewBox="0 0 14 14" fill="none">
                <path d="M1.5 4l5.5 3 5.5-3-5.5-3-5.5 3z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/>
                <path d="M1.5 7l5.5 3 5.5-3M1.5 10l5.5 3 5.5-3" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>

          <div className="gizmo-hint">
            Drag · LMB rotate · MMB pan · scroll zoom
          </div>

          <div className="viewport-corner">
            <div className="axes">
              <span className="axis axis-x">X</span>
              <span className="axis axis-y">Y</span>
              <span className="axis axis-z">Z</span>
            </div>
            <div>{plateSize[0]} × {plateSize[1]} × 250 mm</div>
          </div>

          {slicing && (
            <div style={{
              position: "absolute", inset: 0, background: "rgba(15,17,21,0.45)",
              display: "flex", alignItems: "center", justifyContent: "center",
              backdropFilter: "blur(2px)",
              zIndex: 20,
            }}>
              <div style={{
                background: "var(--surface)", padding: "18px 22px", borderRadius: 10,
                boxShadow: "var(--shadow-lg)",
                fontFamily: "var(--font-mono)", fontSize: 13,
                display: "flex", flexDirection: "column", gap: 8, minWidth: 280,
              }}>
                <div>Slicing {objects.length} object{objects.length !== 1 ? "s" : ""}…</div>
                <div style={{ height: 4, background: "var(--surface-3)", borderRadius: 2, overflow: "hidden" }}>
                  <div style={{
                    height: "100%", width: "60%", background: "var(--accent)",
                    animation: "progress 1.6s ease-in-out infinite",
                  }}/>
                </div>
                <div className="dim" style={{ fontSize: 11 }}>Walls · Top/Bottom · Infill · Support · G-code</div>
              </div>
            </div>
          )}
        </div>

        <SettingsPanel
          contextLayer={contextLayer}
          setContextLayer={setContextLayer}
          selectedObject={objects.find(o => o.id === selectedId) || null}
          setObjectOverride={setObjectOverride}
          resetObjectOverride={resetObjectOverride}
          accountabilityMode={t.accountability}
          searchMode={t.search}
          userOverrides={userOverrides}
          setUserOverrides={setUserOverrides}
          objects={objects}
          filaments={filaments}
          printer={printer}
          bedPlate={bedPlate}
          nozzle={nozzle}
          filamentsInUse={filamentsInUse}
          printerPresets={PRINTER_PRESETS}
          onSwapPrinter={(presetId) => setPlatePrinter(activePlateId, presetId)}
          onSwapBedPlate={noop("bedPlate")}
          onSwapNozzle={noop("nozzle")}
          onSwapFilament={(id) => console.log("[swap] filament", id)}
        />
      </div>

      <div className="statusbar">
        <span className="dot"/>
        <span>Ready</span>
        <span>·</span>
        <span>{objects.length} object{objects.length !== 1 ? "s" : ""} on plate</span>
        <span>·</span>
        <span>{overrideCount} active override{overrideCount !== 1 ? "s" : ""}</span>
        <span className="spacer"/>
        <span>Editing {LAYER_BY_ID[contextLayer].label.toLowerCase()} layer</span>
        <span>·</span>
        <span>v0.4.1-prototype</span>
      </div>

      <TweaksPanel>
        <TweakSection label="Accountability" />
        <TweakRadio  label="Source viz" value={t.accountability}
                     options={["rule", "breadcrumb", "ladder-only"]}
                     onChange={(v) => setTweak('accountability', v)} />
        <div style={{ fontSize: 10.5, color: "rgba(41,38,27,.55)", lineHeight: 1.45 }}>
          <b>rule</b> — left rule colored by origin · <b>breadcrumb</b> — adds inline cascade trail · <b>ladder-only</b> — rule + hover ladder only
        </div>

        <TweakSection label="Search" />
        <TweakRadio  label="Filter mode" value={t.search}
                     options={["instant", "scoped", "fuzzy"]}
                     onChange={(v) => setTweak('search', v)} />
        <div style={{ fontSize: 10.5, color: "rgba(41,38,27,.55)", lineHeight: 1.45 }}>
          <b>instant</b> — substring across all · <b>scoped</b> — only active category · <b>fuzzy</b> — sloppy match
        </div>

        <TweakSection label="Theme" />
        <TweakRadio  label="Mode" value={t.theme}
                     options={["light", "dark"]}
                     onChange={(v) => setTweak('theme', v)} />
        <TweakColor  label="Accent" value={t.accent === "cyan" ? "#2BB6C2" : t.accent === "ember" ? "#D97757" : t.accent === "violet" ? "#7A5AE0" : "#1F8A5B"}
                     options={["#2BB6C2", "#D97757", "#7A5AE0", "#1F8A5B"]}
                     onChange={(v) => {
                       const map = { "#2BB6C2": "cyan", "#D97757": "ember", "#7A5AE0": "violet", "#1F8A5B": "mint" };
                       setTweak('accent', map[v] || "cyan");
                     }} />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App/>);

</script>
</body>
</html>
