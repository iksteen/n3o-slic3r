# Per-(material family × nozzle diameter) pressure-advance (K) defaults for the
# Snapmaker U1. Seeded from the U1 firmware's own flow_k table
# (klippy/extras/filament_parameters.py, generic-vendor/generic-sub values).
#
# Why this file exists: pressure advance is a printer/kinematics property, but
# OrcaSlicer stores `pressure_advance` on the *filament*. n3o's consolidated
# generic filament fragments carry a cross-printer default (~0.05) that is ~2.5×
# too high for the U1 and causes underextruded corners. These values are the
# authoritative per-printer defaults, applied in the composer over whatever the
# filament fragment carries (the fragments themselves are never edited). K is
# strongly nozzle-diameter dependent (up to ~25× across sizes), so every entry
# is keyed by nozzle diameter. A user's on-printer calibration overrides these.
# See docs/dev/u1-pressure-advance.md.
#
# Keys: [<filament base_type>] then "<nozzle diameter>" = K. Unmatched
# (base_type, nozzle) falls back to the filament fragment's own value.

