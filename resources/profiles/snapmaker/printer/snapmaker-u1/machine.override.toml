# machine.override.toml — deliberate divergences from the upstream
# OrcaSlicer import, splatted over the generated profile on every re-pin
# (see scripts/import_machine_profile.py::load_profile_overrides).
#
# Values are strings to match the emitted profile. `[machine]` keys land
# in machine.toml; `[nozzles._all]` / `[nozzles."<sku>"]` land in the
# per-nozzle files. Whole-value replacement — a gcode block here freezes
# that block against upstream, so re-check it when the pin bump changes
# the upstream start gcode.

[machine]
# Motion limits: adopt Snapmaker's own Orca fork values over upstream Orca's.
# Upstream (our import source) ships higher generic figures; the vendor fork
# tunes them down for the actual machine. Two-mode ("normal,silent").
machine_max_speed_x = "500,200"
machine_max_speed_y = "500,200"
machine_max_acceleration_x = "20000,20000"
machine_max_acceleration_y = "20000,20000"
machine_max_acceleration_extruding = "20000,20000"
machine_max_acceleration_travel = "20000,20000"

# Restore the AI spaghetti-detection pre-print baseline capture. Upstream's
# U1 start gcode (dated 20251222) omits it; verified required by decompiling
# the printer's `unisrv` camera service — per-layer noodle detection diffs
# each frame against the pre-print reference image this call establishes
# (UpdatePrePrintImage). Without it the detector loses its baseline and
# false-positives on the purge line / pre-existing bed features. Placed
# after `G28 X Y`, matching Snapmaker's own Orca profile.
machine_start_gcode = """
SET_PRINT_AUTO_BED_LEVELING ENABLE=1
SET_TIME_LAPSE_CAMERA ENABLE=1
;===== date: 20251222 =====================

PRINT_START
DEFECT_DETECTION_START
SET_PRINT_STATS_INFO TOTAL_LAYER={total_layer_count}
SET_PRINT_STATS_INFO CURRENT_LAYER=0
TIMELAPSE_START
M140 S{bed_temperature_initial_layer_single}
M104 T{initial_extruder} S140
M204 S10000

G28 X Y
DEFECT_DETECT_NOODLE_FIRST
;===== 床面异物检测 ========
T{initial_extruder}
G90
DEFECT_DETECTION_DETECT_BED
;===== 取放头检测 =================
SM_PRINT_CHECK_SWITCH_EXTRUDER

;===== 自动进料 & 挤出流量 & 预挤出 ======================
SM_PRINT_EXTRUDER_PREHEAT EXTRUDER=1 TEMP=140
SM_PRINT_AUTO_FEED EXTRUDER=0
SM_PRINT_FLOW_CALIBRATE EXTRUDER=0
SM_PRINT_EXTRUDER_PREHEAT EXTRUDER=2 TEMP=140
SM_PRINT_AUTO_FEED EXTRUDER=1
SM_PRINT_FLOW_CALIBRATE EXTRUDER=1
SM_PRINT_EXTRUDER_PREHEAT EXTRUDER=3 TEMP=140
SM_PRINT_AUTO_FEED EXTRUDER=2
SM_PRINT_FLOW_CALIBRATE EXTRUDER=2
SM_PRINT_AUTO_FEED EXTRUDER=3
SM_PRINT_FLOW_CALIBRATE EXTRUDER=3
M104 S0 T0 A0
M104 S0 T1 A0
M104 S0 T2 A0
M104 S0 T3 A0
M104 T{initial_extruder} S{nozzle_temperature[initial_extruder] - 90}

;===== 粗回零 =================
T{initial_extruder}
M106 S255
M106 P2 S0
MOVE_TO_DISCARD_FILAMENT_POSITION
M109 T{initial_extruder} S{nozzle_temperature[initial_extruder] - 90}
ROUGHLY_CLEAN_NOZZLE_WITH_DISCARD
MOVE_TO_XY_IDLE_POSITION_EXTRUDER
G28 Z I140 J140

;===== 检测钢板 =================
DETECT_BED_PLATE

;===== 深度清洁喷嘴 =================
G90
G0 Z5 F10000
MOVE_TO_DISCARD_FILAMENT_POSITION
M109 S{nozzle_temperature[initial_extruder] - 50}
ROUGHLY_CLEAN_NOZZLE
MOVE_TO_XY_IDLE_POSITION_EXTRUDER
FINELY_CLEAN_NOZZLE_STAGE_1
M104 S{nozzle_temperature[initial_extruder] - 90}
G0 Z5 F10000
MOVE_TO_DISCARD_FILAMENT_POSITION
ROUGHLY_CLEAN_NOZZLE
MOVE_TO_XY_IDLE_POSITION_EXTRUDER
FINELY_CLEAN_NOZZLE_STAGE_2

;===== 精回零 =================
M106 S255
M109 S{nozzle_temperature[initial_extruder] - 90}
M190 S{bed_temperature_initial_layer_single}
M107 P2
G90
G0 Z5 F10000
G28 Z

;===== 热床调平 =================
; Always pass `ADAPTIVE_MARGIN=0` because Orca has already handled `adaptive_bed_mesh_margin` internally
; Make sure to set ADAPTIVE to 0 otherwise Klipper will use it's own adaptive bed mesh logic
BED_MESH_CALIBRATE mesh_min={adaptive_bed_mesh_min[0]},{adaptive_bed_mesh_min[1]} mesh_max={adaptive_bed_mesh_max[0]},{adaptive_bed_mesh_max[1]} ALGORITHM=[bed_mesh_algo] PROBE_COUNT={bed_mesh_probe_count[0]},{bed_mesh_probe_count[1]} ADAPTIVE=0 ADAPTIVE_MARGIN=0
; Original upstream: BED_MESH_CALIBRATE PROBE_COUNT=11,11

;===== 画起始线 =================
G90
G1 Z1.5
G0 X10 Y3 Z2 F18000
M109 S{nozzle_temperature_initial_layer[initial_extruder]}
G1 Z0.2
M83
G1 X110 E15 F360
G1 Z1.5

G90
M106 S0
"""

# Retraction: adopt Snapmaker's own Orca fork values. Speeds are uniform
# across nozzles; retraction length is per-SKU (larger nozzles differ).
# nozzle_type is deliberately NOT overridden — ours (stainless_steel) is
# believed correct for the actual hardware.
[nozzles._all]
retraction_speed = "30"
deretraction_speed = "30"

[nozzles."0.2"]
retraction_length = "0.4"

[nozzles."0.4"]
retraction_length = "1.5"

[nozzles."0.6"]
retraction_length = "1.4"

[nozzles."0.8"]
retraction_length = "1.5"
