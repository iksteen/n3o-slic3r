brand = "Snapmaker"
brand_short = "S"
driver_kind = "u1"
# 4 magnetically-docked toolheads; each slot maps 1:1 to a physical
# toolhead (vs the A1 mini's AMS feeding a single toolhead). The
# extruder count is read off `len(toolheads)` at load time.
# Toolchanger, no AMS.
ams_max = 0

# One toolhead per slot. Defaults assume the as-shipped 4× identical
# 0.4mm set; the data model permits any combination, but the MVP
# cascade fixtures assume uniform. Hotend material is no longer
# authored here — it's derived in `registry::hydrate_profile` from
# the per-nozzle profile (`nozzles/0.4.toml::nozzle_type`, which is
# stainless_steel for the U1's stock toolhead).
[[toolheads]]
default_nozzle_diameter = "0.4"
max_temp = 300.0

[[toolheads]]
default_nozzle_diameter = "0.4"
max_temp = 300.0

[[toolheads]]
default_nozzle_diameter = "0.4"
max_temp = 300.0

[[toolheads]]
default_nozzle_diameter = "0.4"
max_temp = 300.0
