# Base machine — keys shared across every nozzle variant.
# Generated by scripts/import_machine_profile.py from:
#   external/OrcaSlicer/resources/profiles/Creality/machine/
# Per-nozzle scalars live under `creality-ender-3-v3-ke/nozzles/<sku>.toml`.

auxiliary_fan = "0"
bed_exclude_area = "0x0"
# Not authored upstream (Creality profiles predate Orca's bed-type
# picker). Textured PEI is the project default for new printers —
# the near-universal sheet in practice; the stock PC plate stays
# available in beds/.
default_bed_type = "Textured PEI Plate"
before_layer_change_gcode = ''';BEFORE_LAYER_CHANGE
;[layer_z]
G92 E0
'''
change_filament_gcode = "M600"
extruder_clearance_height_to_lid = "34"
extruder_clearance_height_to_rod = "47"
extruder_clearance_radius = "90"
gcode_flavor = "klipper"
layer_change_gcode = ""
machine_end_gcode = '''G92 E0 ;Reset Extruder
G1 E-1.2 Z{max_layer_z + 0.5} F1800 ;Retract and raise Z
{if max_layer_z < 50}
G1 Z{max_layer_z + 25} F900 ;Raise Z more
{endif}

G1 X2 Y218 F3000 ;Present print
M106 S0 ;Turn-off fan
M104 S0 ;Turn-off hotend
M140 S0 ;Turn-off bed

M84 X Y E ;Disable all steppers but Z'''
machine_load_filament_time = "11"
machine_max_acceleration_e = "5000,5000"
machine_max_acceleration_extruding = "8000,8000"
machine_max_acceleration_retracting = "5000,5000"
machine_max_acceleration_travel = "8000,8000"
machine_max_acceleration_x = "8000,8000"
machine_max_acceleration_y = "8000,8000"
machine_max_acceleration_z = "300,300"
machine_max_jerk_e = "5,5"
machine_max_jerk_x = "7,7"
machine_max_jerk_y = "7,7"
machine_max_jerk_z = "0.4,0.4"
machine_max_speed_e = "40,40"
machine_max_speed_x = "500,500"
machine_max_speed_y = "500,500"
machine_max_speed_z = "30,30"
machine_min_extruding_rate = "0,0"
machine_min_travel_rate = "0,0"
machine_pause_gcode = "PAUSE"
machine_start_gcode = '''SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=fan0_min VALUE=30 ;compensate for fan speed
SET_VELOCITY_LIMIT ACCEL_TO_DECEL=2500 ;revert accel_to_decel back to 2500
M220 S100 ;Reset Feedrate
M221 S100 ;Reset Flowrate

M140 S[bed_temperature_initial_layer_single] ;Set bed temp
G28 X Y ;Home XY axes
M190 S[bed_temperature_initial_layer_single] ;Wait for bed temp to stabilize
G28 Z ;Home Z axis & load bed mesh
BED_MESH_CALIBRATE PROBE_COUNT=5,5 ;Auto bed level

M104 S[nozzle_temperature_initial_layer] ;Set nozzle temp
G92 E0 ;Reset Extruder
G1 X-2.0 Y20 Z0.3 F5000.0 ;Move to start position
M109 S[nozzle_temperature_initial_layer] ;Wait for nozzle temp to stabilize
G1 Z0.2 ;Lower nozzle to printing height
G1 Y145.0 F1500.0 E15 ;Draw the first line
G1 X-1.7 F5000.0 ;Move to side a little
G1 Y30 F1500.0 E15 ;Draw the second line
G92 E0 ;Reset Extruder'''
manual_filament_change = "1"
printable_area = "0x0,220x0,220x220,0x220"
printable_height = "245"
printer_model = "Creality Ender-3 V3 KE"
printer_structure = "i3"
printer_technology = "FFF"
scan_first_layer = "0"
silent_mode = "0"
single_extruder_multi_material = "1"
support_air_filtration = "0"
support_chamber_temp_control = "0"
thumbnails = "96x96,300x300"
