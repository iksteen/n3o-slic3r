# Strategy B PoC: can wgpu render to a NATIVE Tauri window surface (via
# window_handle()) and coexist with a webview in the same window — instead of
# offscreen-render + pixel-copy (Strategy A)? Standalone (own [workspace]).
[package]
name = "tauri-native-window-poc"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` gates the bare `Window` container + `add_child` multi-webview API.
tauri = { version = "2", features = ["unstable"] }
wgpu = "0.20"
raw-window-handle = "0.6"
pollster = "0.3"
