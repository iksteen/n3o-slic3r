[package]
name = "n3o-slic3r"
version = "0.1.0"
description = "n3o-slic3r: a modern desktop slicer UI driving libslic3r via orca-slicer-ffi"
authors = ["Ingmar Steen <iksteen@gmail.com>"]
edition = "2021"
license = "AGPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "n3o_slic3r_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slic3r-ffi = { path = "../crates/slic3r-ffi" }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[[example]]
name = "spike1"
path = "examples/spike1.rs"

[[example]]
name = "spike2"
path = "examples/spike2.rs"

[[example]]
name = "spike3"
path = "examples/spike3.rs"

[[example]]
name = "phase1_smoke"
path = "examples/phase1_smoke.rs"

