[package]
name = "n3o-slic3r"
version = "0.1.0"
description = "n3o-slic3r: a modern desktop slicer UI driving libslic3r via orca-slicer-ffi"
authors = ["Ingmar Steen <iksteen@gmail.com>"]
edition = "2021"
license = "AGPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "n3o_slic3r_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri keys production vs. dev off this feature: is_dev() == !custom-protocol.
# With it on, the app serves the embedded frontend (frontendDist); with it off
# it loads build.devUrl (the dev server). `npm run tauri build` enables it
# automatically; a raw `cargo build` (e.g. the Linux→macOS cross in
# packaging/macos-cross/) must pass `--features custom-protocol`. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

# Test-only: compiles the bundled A1 mini + U1 instance fixtures and the
# registry's no-storage-root fallback that seeds them. Enabled for the test
# build (`cargo test --features test-fixtures`, and CI) plus the lib's own
# unit tests via `cfg(test)`; NEVER enabled for release builds, so the
# shipped binary carries no fixtures and a missing storage root yields an
# empty registry rather than silently fabricated printers. Integration tests
# that need the fixtures are themselves `#![cfg(feature = "test-fixtures")]`,
# so a plain `cargo test` (no feature) skips them instead of failing.
test-fixtures = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
glam = { version = "0.33", features = ["serde"] }
# Strategy-A wgpu viewport: render the 3D scene offscreen and blit the frame
# into an opaque <canvas>. WebKitGTK can't composite a transparent webview over
# GPU content (it smears dynamic DOM) — see docs/dev/wgpu-renderer.md — so the
# render lives in the webview as an opaque canvas fed by these frames.
# default-features=false is a `windows`-crate version pin in disguise — DO NOT
# restore default features (or add the "dx12" feature) without reading this.
#
# wgpu-hal's dx12 backend depends on gpu-allocator, which uses the `windows`
# crate. wgpu-hal 29 is on windows 0.62; tauri 2.11.3's webview stack (tao, wry,
# webview2-com, tauri-runtime-wry) pins windows ^0.61. No single windows version
# satisfies both, so two nodes must coexist — and cargo parks gpu-allocator on
# tauri's 0.61 node while wgpu-hal compiles against 0.62, so the dx12 suballocator
# mixes 0.61/0.62 D3D12 types and fails to cross-compile (windows-msvc). It can't
# be pinned away. Dropping dx12 sidesteps it; we render offscreen, so Vulkan/GL
# cover Windows fine. The feature list below is wgpu's `default` minus "dx12".
#
# If a Windows build breaks at a dependency-of-a-dependency with "multiple
# different versions of crate `windows`/`windows-core`", this is the pattern:
# some transitive crate's `windows` collides with tauri's pinned ^0.61. Re-enable
# dx12 (and drop default-features=false) once tauri's stack moves to windows 0.62.
wgpu = { version = "29", default-features = false, features = [
    "std",
    "parking_lot",
    "metal",
    "gles",
    "vulkan",
    "wgsl",
    "webgpu",
] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
# Compact binary serde codec for the .n3o project's per-mesh geometry blobs.
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slic3r-ffi = { path = "../crates/slic3r-ffi" }
stl_io = "0.11"
tobj = "4"
toml = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
# Decode the frontend-rendered thumbnail PNG (passed as base64 over the
# IPC) back to bytes for the Bambu `.gcode.3mf`; the U1 G-code block
# reuses the base64 directly.
base64 = "0.22"
quick-xml = "0.40"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
# Driver layer (Phase 7). tokio is technically transitive via tauri
# but the driver code uses watch/mpsc/oneshot directly so we depend
# explicitly with the feature flags we need.
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net"] }
# CancellationToken for cooperative camera-worker shutdown (so a source's
# async teardown — e.g. the U1 camera release — runs before the task exits).
tokio-util = "0.7"
# Bambu LAN driver (PR-7a-2). native-tls + matching tokio adapter
# because the BBL device cert is X.509 v1 with CN-as-serial — rustls
# can't accept that with a custom verifier; matches bambu-overlay's
# choice for the same reason.
native-tls = "0.2"
tokio-native-tls = "0.3"
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"] }
x509-parser = "0.18"
# Snapmaker U1 camera pairing: the printer issues PKCS#1 RSA client keys,
# but native-tls's Identity::from_pkcs8 requires the PKCS#8 wrapper — the
# `rsa` crate does the one-call re-encode.
rsa = "0.9"
# FTPS upload to Bambu's /cache/ directory (PR-7a-5). Same crate +
# feature set bambu-overlay uses for downloads; `deprecated` brings
# in the explicit `connect_secure_implicit` constructor we need
# (port 990 implicit-TLS rather than the AUTH-TLS handshake).
suppaftp = { version = "9.0.0", default-features = false, features = ["tokio-async-native-tls", "deprecated"] }
# Scratch-file allocator used by the driver's send pipeline to wrap
# the raw .gcode into a Bambu .gcode.3mf bundle before upload. Was
# dev-only until PR-7a-7 made it part of the runtime path.
tempfile = "3"
# Snapmaker U1 driver (PR-7b). Plain Moonraker over Klipper firmware:
# reqwest for the HTTP probe + file upload + print/start, tokio-
# tungstenite for the WebSocket status subscription. Both pinned to
# native-tls (not rustls) so we reuse the TLS stack already linked
# in for the Bambu MQTT driver — keeps the binary single-TLS-stack
# and avoids two trust-store paths.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "multipart", "stream"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "native-tls"] }
futures-util = "0.3"
# Lua plugin host (Phase 8, PR-8-1). `vendored` builds Lua 5.4 from
# source so we don't depend on a system Lua — keeps the standalone-at-
# runtime guarantee. The host runs untrusted plugin code in a sandbox
# (see core/plugin/sandbox.rs): only string/table/math/coroutine
# stdlib, no io/os/package/debug.
# `send` makes `Lua: Send` so the PluginHost can live in shared Tauri
# state (Arc<Mutex<PluginHost>>); it requires registered Rust closures
# to be Send, which ours are.
mlua = { version = "0.11", features = ["lua54", "vendored", "send"] }
# Plugin manifest version validation (Phase 8). Used only to confirm a
# manifest's `version` parses as semver; the string is stored verbatim.
semver = "1"

# File open/save dialogs. On Linux the flatpak sandbox's
# xdg-desktop-portal is unreliable (fails when logind marks the
# graphical session inactive), so we drive GTK's in-process
# FileChooserDialog directly — it browses the `--filesystem=home` mount
# without the portal. Pinned to 0.18 to share tao/wry's already-linked
# GTK3 (gtk 0.18.2 in the lockfile); a second gtk-sys would fail to link.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# macOS/Windows have no portal indirection; rfd gives the native dialog.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.16"

[dev-dependencies]
# HTTP/WebSocket fixture servers for the U1 driver unit tests.
# Pinned to wiremock's tokio-1 compatibility.
wiremock = "0.6"

[[example]]
name = "slice_to_gcode_3mf"
path = "examples/slice_to_gcode_3mf.rs"

[[example]]
name = "slice_repro"
path = "examples/slice_repro.rs"

