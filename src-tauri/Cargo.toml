[package]
name = "n3o-slic3r"
version = "0.1.0"
description = "n3o-slic3r: a modern desktop slicer UI driving libslic3r via orca-slicer-ffi"
authors = ["Ingmar Steen <iksteen@gmail.com>"]
edition = "2021"
license = "AGPL-3.0-or-later"
# With the n3o-send CLI added as a second bin, `cargo run` is ambiguous;
# pin the bare `cargo run` to the slicer app.
default-run = "n3o-slic3r"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "n3o_slic3r_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri keys production vs. dev off this feature: is_dev() == !custom-protocol.
# With it on, the app serves the embedded frontend (frontendDist); with it off
# it loads build.devUrl (the dev server). `npm run tauri build` enables it
# automatically; a raw `cargo build` (e.g. the Linux→macOS cross in
# packaging/macos-cross/) must pass `--features custom-protocol`. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slic3r-ffi = { path = "../crates/slic3r-ffi" }
stl_io = "0.8"
tobj = "4"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Decode the frontend-rendered thumbnail PNG (passed as base64 over the
# IPC) back to bytes for the Bambu `.gcode.3mf`; the U1 G-code block
# reuses the base64 directly.
base64 = "0.22"
quick-xml = "0.36"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
# Driver layer (Phase 7). tokio is technically transitive via tauri
# but the driver code uses watch/mpsc/oneshot directly so we depend
# explicitly with the feature flags we need.
async-trait = "0.1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net"] }
# Bambu LAN driver (PR-7a-2). native-tls + matching tokio adapter
# because the BBL device cert is X.509 v1 with CN-as-serial — rustls
# can't accept that with a custom verifier; matches bambu-overlay's
# choice for the same reason.
native-tls = "0.2"
tokio-native-tls = "0.3"
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"] }
x509-parser = "0.18"
# FTPS upload to Bambu's /cache/ directory (PR-7a-5). Same crate +
# feature set bambu-overlay uses for downloads; `deprecated` brings
# in the explicit `connect_secure_implicit` constructor we need
# (port 990 implicit-TLS rather than the AUTH-TLS handshake).
suppaftp = { version = "8.0.3", default-features = false, features = ["native-tls", "deprecated"] }
# Scratch-file allocator used by the driver's send pipeline to wrap
# the raw .gcode into a Bambu .gcode.3mf bundle before upload. Was
# dev-only until PR-7a-7 made it part of the runtime path.
tempfile = "3"
# Snapmaker U1 driver (PR-7b). Plain Moonraker over Klipper firmware:
# reqwest for the HTTP probe + file upload + print/start, tokio-
# tungstenite for the WebSocket status subscription. Both pinned to
# native-tls (not rustls) so we reuse the TLS stack already linked
# in for the Bambu MQTT driver — keeps the binary single-TLS-stack
# and avoids two trust-store paths.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "multipart", "stream"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "native-tls"] }
futures-util = "0.3"
# Lua plugin host (Phase 8, PR-8-1). `vendored` builds Lua 5.4 from
# source so we don't depend on a system Lua — keeps the standalone-at-
# runtime guarantee. The host runs untrusted plugin code in a sandbox
# (see core/plugin/sandbox.rs): only string/table/math/coroutine
# stdlib, no io/os/package/debug.
# `send` makes `Lua: Send` so the PluginHost can live in shared Tauri
# state (Arc<Mutex<PluginHost>>); it requires registered Rust closures
# to be Send, which ours are.
mlua = { version = "0.11", features = ["lua54", "vendored", "send"] }
# Plugin manifest version validation (Phase 8). Used only to confirm a
# manifest's `version` parses as semver; the string is stored verbatim.
semver = "1"

[dev-dependencies]
# HTTP/WebSocket fixture servers for the U1 driver unit tests
# (PR-7b-*). Pinned to wiremock's tokio-1 compatibility.
wiremock = "0.6"

[[example]]
name = "spike1"
path = "examples/spike1.rs"

[[example]]
name = "spike2"
path = "examples/spike2.rs"

[[example]]
name = "spike3"
path = "examples/spike3.rs"

[[example]]
name = "phase1_smoke"
path = "examples/phase1_smoke.rs"

[[example]]
name = "slice_to_gcode_3mf"
path = "examples/slice_to_gcode_3mf.rs"

[[example]]
name = "slice_repro"
path = "examples/slice_repro.rs"

