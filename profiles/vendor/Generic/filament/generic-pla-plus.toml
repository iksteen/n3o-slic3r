# ---- Per-printer overrides (deltas vs baseline) ----

[[rule]]
when.printer.model = ["Anker M5", "Anker M5 All-Metal", "Anker M5C"]
set.fan_cooling_layer_time = "100"
set.filament_cost = "25"
set.filament_id = "GFL95"
set.filament_max_volumetric_speed = "16"
set.filament_minimal_purge_on_wipe_tower = "10"
set.full_fan_speed_layer = "0"
set.nozzle_temperature = "220"
set.nozzle_temperature_range_high = "230"
set.slow_down_layer_time = "4"
set.slow_down_min_speed = "10"
set.temperature_vitrification = "70"

[[rule]]
when.printer.model = "Qidi Q1 Pro"
set.filament_id = "GFB99"
set.nozzle_temperature = "220"
set.pressure_advance = "0.042"

[[rule]]
when.printer.model = "Qidi X-Plus 4"
set.filament_id = "GFB99"
set.nozzle_temperature_initial_layer = "230"
set.pressure_advance = "0.034"
