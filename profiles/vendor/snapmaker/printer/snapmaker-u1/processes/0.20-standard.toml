# ---- Per-(printer, nozzle) compatibility + overrides ----
# Every (printer, nozzle) pair this process supports has at
# least one [[rule]] below; pairs that match the baseline
# carry a `when`-only rule (no `set.*` lines). The picker
# derives availability from these predicates.

[[rule]]
when.nozzle.diameter = "0.4"
when.printer.model = "Snapmaker U1"

[[rule]]
when.nozzle.diameter = "0.4+0.6"
when.printer.model = "Snapmaker U1"
set.description = "Standard profile for the Snapmaker U1 mixed-nozzle configuration (T0/T1 = 0.4 mm, T2/T3 = 0.6 mm). Line widths are expressed as percentages of nozzle diameter so they scale correctly per tool. Use T0/T1 for detail work and outer walls; use T2/T3 for fast infill or large structural features."
set.initial_layer_line_width = "125%"
set.inner_wall_line_width = "112%"
set.internal_solid_infill_line_width = "105%"
set.line_width = "105%"
set.outer_wall_line_width = "105%"
set.sparse_infill_line_width = "105%"
set.support_line_width = "105%"
set.top_surface_line_width = "105%"

[[rule]]
when.nozzle.diameter = "0.6"
when.printer.model = "Snapmaker U1"
set.bridge_flow = "0.95"
set.description = "Standard 0.2 mm layer height profile for the Snapmaker U1 with 0.6 mm nozzles. Balances print speed and surface quality for everyday prints."
