set.eng_plate_temp_initial_layer = "0"
set.filament_flow_ratio = "1"
set.filament_max_volumetric_speed = "24"
set.slow_down_layer_time = "10"
set.slow_down_min_speed = "10"

[[rule]]
when.printer.model = "Prusa MK3.5"
set.cool_plate_temp = "35"
set.cool_plate_temp_initial_layer = "35"
