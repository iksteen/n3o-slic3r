# ---- Per-printer overrides (deltas vs baseline) ----

[[rule]]
when.printer.model = ["Tiertime UP310 Pro", "Tiertime UP400 Pro"]
set.filament_end_gcode = """; filament end gcode 
;M106 P3 S0
"""
set.filament_start_gcode = """; Filament gcode
;{if activate_air_filtration[current_extruder] && support_air_filtration}
;M106 P3 S{during_print_exhaust_fan_speed_num[current_extruder]} 
;{endif}"""

[[rule]]
when.printer.model = "Bambu Lab H2S"
set.filament_end_gcode = """; filament end gcode 

"""
set.filament_start_gcode = """; Filament gcode
{if activate_air_filtration[current_extruder] && support_air_filtration}
M106 P3 S{during_print_exhaust_fan_speed_num[current_extruder]} 
{endif}"""
set.long_retractions_when_ec = "0"
set.retraction_distances_when_ec = "0"
set.temperature_vitrification = "80"

[[rule]]
