# Bambu A1 mini — *demo* cascade (resolver fixture only)
#
# Phase 1 reference profile — minimal hand-authored cascade
# demonstrating the three syntactic forms (top-level default, section
# shorthand, [[rule]]) and exercising specificity-based resolution.
#
# **NOT FOR PRODUCTION SLICING.** The production cascade lives at
# `bambu-a1-mini-default.toml` (generated by
# `scripts/spikes/convert_bbs_profile.py` from the vendored BambuStudio
# profile snapshot — has the real machine_start_gcode, end_gcode,
# change_filament_gcode, etc. that the printer requires).
#
# This file exists so `reference_profiles.rs` and any future resolver
# fixture tests can exercise the spec-0/1/2 ladder against a tiny
# auditable surface without having to assert on 1300-line BBS-derived
# values.
#
# Context shape (provided by SlicingContext):
#   printer.model = "Bambu A1 mini"
#   plate.type    = one of Cool / Textured PEI / Smooth PEI /
#                   Engineering / SuperTack
#   filament.type = one of PLA / PETG / ABS / ...
#   filament.name = the loaded filament's identity
#
# Resolved values follow libslic3r's option vocabulary; the cascade
# adapter (core/cascade_adapter) handles dimensional expansion of
# `bed_temp` across libslic3r's per-plate-type keys at apply time.

# --- Default rule (specificity 0) -----------------------------------
# Process defaults that don't depend on filament or plate.
layer_height = "0.2"
initial_layer_print_height = "0.2"
wall_loops = "2"
sparse_infill_density = "15%"
sparse_infill_pattern = "crosshatch"
top_shell_layers = "5"
bottom_shell_layers = "3"
travel_speed = "500"
outer_wall_speed = "120"
inner_wall_speed = "150"
sparse_infill_speed = "250"
nozzle_diameter = ["0.4"]
filament_diameter = ["1.75"]
gcode_flavor = "marlin2"
# Absolute E so the default `layer_gcode` validates without a
# `G92 E0` reset (libslic3r enforces this when relative E is on).
# Production cascades that opt into relative E pair it with a
# `layer_gcode` override containing the reset.
use_relative_e_distances = "0"

# --- Filament rule (specificity 1, section shorthand) ---------------
# PLA-specific temperatures + fan curves.
[filament.type.PLA]
nozzle_temperature = "220"
nozzle_temperature_initial_layer = "220"
fan_max_speed = "100"
fan_min_speed = "60"

# --- Plate rule (specificity 1, explicit form) ----------------------
# Textured PEI bed temperature. The cascade carries the logical
# `bed_temp`; the adapter expands across libslic3r's per-plate-type
# keys at apply time (BED_TEMP_KEYS in core/schema).
[[rule]]
when.plate.type = "Textured PEI"
set.bed_temp = "65"

# --- Plate × filament rule (specificity 2) --------------------------
# PLA on Textured PEI specifically — slightly different first-layer
# strategy than the catch-all PLA rule.
[[rule]]
when.filament.type = "PLA"
when.plate.type = "Textured PEI"
set.bed_temp = "65"
set.initial_layer_print_height = "0.2"
