# ---- Per-printer overrides (deltas vs baseline) ----

[[rule]]
when.printer.model = ["Elegoo Centauri", "Elegoo Centauri Carbon", "Elegoo Centauri Carbon 2"]
set.cool_plate_temp = "0"
set.cool_plate_temp_initial_layer = "0"
set.eng_plate_temp = "90"
set.eng_plate_temp_initial_layer = "90"
set.fan_cooling_layer_time = "25"
set.filament_type = "ASA-CF"
set.slow_down_min_speed = "20"
set.temperature_vitrification = "100"

[[rule]]
when.printer.model = ["BLOCKS RD50 V2", "BLOCKS RF50"]
set.activate_air_filtration = "1"
set.close_fan_the_first_x_layers = "4"
set.complete_print_exhaust_fan_speed = "80"
set.during_print_exhaust_fan_speed = "100"
set.fan_max_speed = "45"
set.filament_cost = "30"
set.filament_flow_ratio = "0.95"
set.filament_id = "BSFI010"
set.filament_max_volumetric_speed = "10"
set.filament_start_gcode = """; filament start gcode
