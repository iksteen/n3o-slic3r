# ---- Per-printer overrides (deltas vs baseline) ----

[[rule]]
when.printer.model = ["Elegoo Centauri", "Elegoo Centauri Carbon", "Elegoo Centauri Carbon 2"]
set.during_print_exhaust_fan_speed = "70"
set.hot_plate_temp = "90"
set.hot_plate_temp_initial_layer = "90"
set.nozzle_temperature_range_high = "280"

[[rule]]
when.printer.model = ["Flashforge Guider4", "Flashforge Guider4 Pro"]
set.close_fan_the_first_x_layers = "1"
set.complete_print_exhaust_fan_speed = "50"
set.cool_plate_temp = "60"
set.cool_plate_temp_initial_layer = "60"
set.eng_plate_temp = "60"
set.eng_plate_temp_initial_layer = "60"
set.fan_cooling_layer_time = "10"
set.fan_min_speed = "0"
set.filament_cost = "20"
set.filament_density = "1.4"
set.filament_id = "GFG99"
set.filament_max_volumetric_speed = "15"
set.filament_retraction_length = "1.2"
set.filament_start_gcode = """; filament start gcode
;right_extruder_material:PET
"""
set.nozzle_temperature_range_low = "260"
set.overhang_fan_speed = "30"
set.overhang_fan_threshold = "95%"
set.pressure_advance = "0.02"
set.required_nozzle_HRC = "0"
set.slow_down_layer_time = "6"
set.support_material_interface_fan_speed = "-1"
set.temperature_vitrification = "80"
set.textured_plate_temp = "60"
set.textured_plate_temp_initial_layer = "60"

[[rule]]
when.printer.model = ["Flashforge Guider4 0.6 HF nozzle", "Flashforge Guider4 Pro 0.6 HF nozzle"]
set.complete_print_exhaust_fan_speed = "40"
set.eng_plate_temp = "80"
set.eng_plate_temp_initial_layer = "80"
set.fan_cooling_layer_time = "20"
set.fan_max_speed = "40"
